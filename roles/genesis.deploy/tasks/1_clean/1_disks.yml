---
# genesis.deploy 1_clean/1_disks.yml
#  - Zero-Touch Provisioning Hardware Cleansing Execution Core
#    - Block: Native OpenStack Ironic Action Clean (Zero-Script Goal)
#    - Rescue: Raw Linux Kernel DD Mass Fallback & Native Reboot Bypass (Unified Shell)
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "B5 - DEPLOY - 1.- Clean : 1) Wipe Disks" 
  ignore_errors: yes 
  
  #--------------------------------------------------------------------------  
  # 1.- Machine Already Power On
  #--------------------------------------------------------------------------
  block:
 
    # 1.1.- Power On Machine
    #.......................
    - name: "B5 - DEPLOY - 1.- Clean: 1.1) Power On via Ironic API URI Calls"
      ansible.builtin.include_tasks: "2_lifecycle.yml"
      vars:
        b5_lifecycle_instructions: "b5_lifecycle_api_calls.poweron"
 
    - name: "B5 - DEPLOY - 1.- Clean: 1.2) Power On Executing node_action openstack ansible module"
      openstack.cloud.baremetal_node_action:
        uuid: "{{ uuid | default('') }}"
        deploy: false
        power: "on"
        state: present
        timeout: 60
        wait: true

    # 1.2.- Wipe Disks
    #....................... 
    - name: "B5 - DEPLOY - 1.- Clean: 1.2) Raw Disk Zapping & Native OS Reboot via Unified Bash"
      become: yes
      
      # Safe Perimeter Check: Prevent structural damage to the Genesis Orchestrator
      when:
        - inventory_hostname != 'localhost'
        - inventory_hostname != '127.0.0.1'
        - inventory_hostname != (b5_url_genesis_ip | default('127.0.0.1'))
        - inventory_hostname != (ansible_default_ipv4.address | default('127.0.0.1'))
        - inventory_hostname not in (ansible_all_ipv4_addresses | default(['127.0.0.1']))

      # Destroy Storage Signature Blueprint (Strictly aligned syntax block)
      ansible.builtin.shell:
        cmd: |
          echo "==> [FALLBACK] Initiating mass storage partition table signature zapping..."
          
          # DYNAMIC DESTRUCTION: Overwriting MBR/GPT/LVM metadata on ALL detected block devices
          for dev in /sys/class/block/sd* /sys/class/block/vd* /sys/class/block/nvme*n1; do
              if [ -b "/dev/${dev##*/}" ]; then
                  echo "Zapping /dev/${dev##*/}"
                  dd if=/dev/zero of="/dev/${dev##*/}" bs=512 count=100 conv=notrunc 2>/dev/null || true
              fi
          done
          
          echo "==> [FALLBACK] Raw block device cleansing completed successfully."
          
          # NETWORK-SAFE KERNEL BYPASS: Delay execution slightly to guarantee Ansible async payload delivery
          echo "==> [REBOOT] Scheduling immediate hardware reset signal..."
          ( sleep 2 && echo 1 > /proc/sys/system_filter/sysrq 2>/dev/null; echo b > /proc/sysrq-trigger ) &
          exit 0
          
      # ASYNCHRONOUS FIRE ENGINE: Drop connection payload and proceed instantly without lag
      async: 30
      poll: 0
      register: b5_fallback_script_result
      changed_when: true

  #---------------------------------------------------------------------------
  # 2.- Machine Power Off => Force Cleaning Ironic Stage
  #---------------------------------------------------------------------------
  rescue:

    - name: "B5 - DEPLOY - 1.- Clean: 1.3) Clean via Ironic API URI Calls"
      ansible.builtin.include_tasks: "2_lifecycle.yml"
      vars:
        b5_lifecycle_instructions: "{{ b5_api_calls_list.api_calls | default([]) }}"
      loop: 
        - api_calls: "{{ b5_lifecycle_api_calls.poweron | default([]) }}"
        - api_calls: "{{ b5_lifecycle_api_calls.clean   | default([]) }}"
      loop_control:
        loop_var: "b5_api_calls_list"
      when: 
        - b5_api_calls_list.api_calls is defined
        - b5_api_calls_list.api_calls is not none
        - b5_api_calls_list.api_calls is iterable
        - b5_api_calls_list.api_calls is not string
        - b5_api_calls_list.api_calls is not mapping
        - b5_api_calls_list.api_calls | length > 0