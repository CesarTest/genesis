- name: "B6 - PROVISION DOC NODE: Certification Testing Documentation Server"
  become: true
  block:

    - name: "B6 - PROVISION DOC NODE: 0) Refresh facts"
      ansible.builtin.setup:

    - name: "B6 - PROVISION DOC NODE: 1) Deploy Mandatory Access Control and security policies"
      ansible.builtin.include_tasks: "1_mac.yml"

    - name: "B6 - PROVISION DOC NODE: 2) Configure HTTP server and web runtime baseline"
      ansible.builtin.include_tasks: "2_web.yml"

    - name: "B6 - PROVISION DOC NODE: 3) Deploy Package into Web Server"
      ansible.builtin.include_tasks: "3_package.yml"
      loop: "{{ grav_deploy | default([]) }}"
      loop_control:
         loop_var: "grav_package"
      vars:
         package:  "{{ grav_package }}"

    - name: "B6 - PROVISION DOC NODE: 4) Finalize environment deploying Grav CMS instance"
      ansible.builtin.include_tasks: "4_grav.yml"

  rescue:

    - name: "B6 - PROVISION DOC NODE: [RESCUE] Print non-blocking provisioning failure alert message"
      ansible.builtin.debug:
        msg: |
          WARNING ALERT: An exception has been detected during the B6 provisioning phase on host {{ inventory_hostname }}.
          Execution will CONTINUE in non-blocking mode. Please review previous tasks to audit potential inconsistencies.

    - name: "B6 - PROVISION DOC NODE: [RESCUE] Clear host error state to avoid interrupting execution"
      ansible.builtin.meta: clear_host_errors