---
# ==============================================================================
#  PROJECT:   GENESIS SYSTEM
#  MODULE:    Infrastructure Deployment (Testing Env)
#  PLATFORM:  Proxmox VE (PVE)
#  
#  DESCRIPTION:
#  This role provisions and configures the automated testing infrastructure
#  required for the Genesis platform lifecycle.
# ==============================================================================
galaxy_info:
  author: "Cesar Delgado"
  description: "Deploys test infrastructure for the Genesis system on Proxmox VE"
  company: "Genesis"

  # License under which the role is distributed
  license: MIT

  # Minimum required Ansible version to execute this role
  min_ansible_version: "2.14"

  # Supported platforms for the Ansible control node
  platforms:
    - name: EL
      versions:
        - all
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all

  # Keywords to categorize and search for this role
  galaxy_tags:
    - proxmox
    - pve
    - genesis
    - testing
    - IaC

# External role dependencies (none required as we rely on community.general collection)
dependencies: []
