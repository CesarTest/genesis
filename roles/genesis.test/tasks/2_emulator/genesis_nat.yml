---
# genesis.test 3_emulator/genesis_nat.yml
#  - Redirect all BMC Emulator Traffic to Hypervisor
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- ignore_errors: yes
  vars:
    t3_bastion_nat_rules:
      - protocol:    "{{ t1_enroll_node_bmc_transport | default('tcp') }}"
        source_port: "{{ t1_enroll_node_bmc_port      | default('8000') }}"
        dest_port:   "{{ genesis_bmc_credentials[t1_enroll_node_bmc_driver]['port'] | default('8000') }}"
        dest_ip:     "{{ genesis_bmc_credentials[t1_enroll_node_bmc_driver]['ipv4'] | default('127.0.0.1') | ansible.utils.ipaddr('address') }}"
        comment:     "Genesis Redirection to Hypervisor BMC Emulator"

    # Diccionario de comandos de fuerza bruta por Shell para el Rescue
    t3_cli_commands:
      present: >-
        sysctl -w net.ipv4.ip_forward=1 >/dev/null;
        {% for rule in t3_bastion_nat_rules -%}
        iptables -t nat -A PREROUTING -p {{ rule.protocol }} --dport {{ rule.source_port }} -j DNAT --to-destination {{ rule.dest_ip }}:{{ rule.dest_port }} -m comment --comment "{{ rule.comment }}" 2>/dev/null || true;
        iptables -t nat -A POSTROUTING -p {{ rule.protocol }} -d {{ rule.dest_ip }} --dport {{ rule.dest_port }} -j MASQUERADE -m comment --comment "{{ rule.comment }}" 2>/dev/null || true;
        iptables -A FORWARD -p {{ rule.protocol }} -d {{ rule.dest_ip }} --dport {{ rule.dest_port }} -j ACCEPT 2>/dev/null || true;
        {% endfor -%}
        mkdir -p /etc/iptables 2>/dev/null || true; iptables-save > /etc/iptables/rules.v4 2>/dev/null || true
      absent: >-
        {% for rule in t3_bastion_nat_rules -%}
        iptables -t nat -D PREROUTING -p {{ rule.protocol }} --dport {{ rule.source_port }} -j DNAT --to-destination {{ rule.dest_ip }}:{{ rule.dest_port }} 2>/dev/null || true;
        iptables -t nat -D POSTROUTING -p {{ rule.protocol }} -d {{ rule.dest_ip }} --dport {{ rule.dest_port }} -j MASQUERADE 2>/dev/null || true;
        iptables -D FORWARD -p {{ rule.protocol }} -d {{ rule.dest_ip }} --dport {{ rule.dest_port }} -j ACCEPT 2>/dev/null || true;
        {% endfor -%}
        mkdir -p /etc/iptables 2>/dev/null || true; iptables-save > /etc/iptables/rules.v4 2>/dev/null || true

  block:

    #-----------------------------------------------------------------------
    # 1.- NAT through Ansible Modules
    #-----------------------------------------------------------------------
    - name: "T2 - GENESIS_NAT -2- Emulator: 1.0) Ensure IP Forwarding is enabled in Kernel"
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true
      delegate_to: "{{ t1_hypervisor_node | default('localhost') }}"

    - name: "T2 - GENESIS_NAT -2- Emulator: 1.1a) Ensure PREROUTING DNAT rules exist"
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        protocol: "{{ item.protocol }}"
        destination_port: "{{ item.source_port }}"
        jump: DNAT
        to_destination: "{{ item.dest_ip }}:{{ item.dest_port }}"
        comment: "{{ item.comment }}"
        state: "{{ t3_zone_state | default('present') }}"
      loop: "{{ t3_bastion_nat_rules }}"

    - name: "T2 - GENESIS_NAT -2- Emulator: 1.1b) Ensure POSTROUTING MASQUERADE rules exist"
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        protocol: "{{ item.protocol }}"
        destination: "{{ item.dest_ip }}"
        destination_port: "{{ item.dest_port }}"
        jump: MASQUERADE
        comment: "{{ item.comment }}"
        state: "{{ t3_zone_state | default('present') }}"
      loop: "{{ t3_bastion_nat_rules }}"

    - name: "T2 - GENESIS_NAT -2- Emulator: 1.1c) Ensure FORWARD filter rules exist"
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: "{{ item.protocol }}"
        destination: "{{ item.dest_ip }}"
        destination_port: "{{ item.dest_port }}"
        jump: ACCEPT
        comment: "{{ item.comment }}"
        state: "{{ t3_zone_state | default('present') }}"
      loop: "{{ t3_bastion_nat_rules }}"

  rescue:

    #-----------------------------------------------------------------------
    # 2.- NAT through Shell Commands
    #-----------------------------------------------------------------------
    - name: "T2 - GENESIS_NAT -2- Emulator: 1.2) RESCUE - Force NAT Creation via CLI"
      become: true
      ansible.builtin.shell: 
        cmd: "{{ t3_cli_commands[t3_selector] | default('') }}"
      vars:
        t3_selector: "{{ t3_zone_state | default('present') }}" 
      register: t3_zone_cli_fallback
      delegate_to: "{{ t1_hypervisor_node | default('localhost') }}"
      failed_when: false
      changed_when: true