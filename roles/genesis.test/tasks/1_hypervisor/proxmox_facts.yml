# SPDX-License-Identifier: Apache-2.0

- name: "T1 - TESTING ENVIRONMENT: Proxmox Testing User Provisioning"
  block:


    #-----------------------------------------------------------------------
    # 1.- Node Name
    #-----------------------------------------------------------------------
    - name: "T1 - TESTING ENVIRONMENT 3.- Nodes: 2.1) Query Proxmox API node name dynamically"
      become: true
      ansible.builtin.shell: |
        pvesh get /nodes --output-format json | awk -F'\"node\":\"' '{print $2}' | awk -F'\"' '{print $1}'
      register: t1_pve_detected_node
      changed_when: false
      delegate_to: "{{ t1_hypervisor_node | default('localhost') }}"

    - name: "T1 - TESTING ENVIRONMENT 3.- Nodes: 2.2) Register node name as a runtime fact"
      ansible.builtin.set_fact:
        t1_hypervisor_api_hostname: "{{ genesis_hypervisor_api_hostname | default(t1_captured_hostname) }}"
      vars:
        t1_captured_hostname: "{{ t1_pve_detected_node.stdout | trim | default(omit) }}"

    #-----------------------------------------------------------------------
    # 2.- Declared SDN Zones
    #-----------------------------------------------------------------------
    - name: "T1 - NETWORK: Probe existing SDN zones via PVE API CLI"
      become: true
      ansible.builtin.shell: "pvesh get /cluster/sdn/zones --output-format json 2>/dev/null || echo '[]'"
      register: t1_pve_sdn_zones_raw
      changed_when: false
      failed_when: false
      delegate_to: "{{ t1_hypervisor_node | default('localhost') }}"

    - name: "T1 - NETWORK: Register active SDN zones as native Ansible Facts"
      ansible.builtin.set_fact:
        t1_proxmox_sdn_zone: "localnetwork"
      vars:
        t1_captured_sdn_zones: "localnetwork"