---
# genesis.init 4_ready/nat.yml
#  - Redirect all BMC Emulator Traffic to Hypervisor
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "G3 - INIT: -4- READY NAT - 2) Manage BMC Emulator Network Redirection"
  block:

    #-----------------------------------------------------------------------
    # 1.1.- Enable IP Forwarding at Kernel Level (Sysctl)
    #-----------------------------------------------------------------------
    - name: "G3 - INIT: -4- READY NAT - 2.1) Ensure IP Forwarding is enabled in Kernel"
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    #-----------------------------------------------------------------------
    # 1.2.- Inject Flattened IPTABLES Rules in a Single Loop
    #-----------------------------------------------------------------------
    - name: "G3 - INIT: -4- READY NAT - 2.2) Ensure NAT and Forwarding Rules exist in Bastion"
      ansible.builtin.iptables:
        table: "{{ g3_nat_rule.table }}"
        chain: "{{ g3_nat_rule.chain }}"
        protocol: "{{ g3_nat_rule.protocol }}"
        destination_port: "{{ g3_nat_rule.src_port | default(omit, true) }}"
        destination: "{{ g3_nat_rule.dst_filter | default(omit, true) }}"
        jump: "{{ g3_nat_rule.jump }}"
        to_destination: "{{ g3_nat_rule.to_dst | default(omit, true) }}"
        comment: "{{ g3_nat_rule.comment }}"
        state: "{{ g3_state | default('present') }}"
      loop: "{{ g3_bastion_nat_rules }}"
      loop_control:
        loop_var: "g3_nat_rule"

  rescue:

    #-----------------------------------------------------------------------
    # 2.- FALLBACK PATH: Atomic Shell Force Brute via CLI (Zero Dependencies)
    #-----------------------------------------------------------------------
    - name: "G3 - INIT: -4- READY NAT - 2.3) RESCUE - Force NAT Creation via CLI"
      become: true
      ansible.builtin.shell: 
        cmd: "{{ g3_cli_commands[g3_selector] | default('') }}"
      vars:
        g3_selector: "{{ g3_state | default('present') }}" 
      register: g3_zone_cli_fallback
      failed_when: false
      changed_when: true