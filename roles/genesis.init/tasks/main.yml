- name: "------------------> G3- INIT - Populate TFTP Service <------------------" 
  vars:
  
    # 1.- OS Deploy Paths   
    g3_deploy_os_path:   "{{ g3_repo_os_path | realpath }}/{{ g3_image_os_distro }}/{{ g3_image_os_distro_version }}"
    g3_deploy_tftp_path:   "{{ g3_tftp_path | realpath }}/{{ g3_image_os_distro }}/{{ g3_image_os_distro_version }}"
    g3_deploy_mount_path:  "{{ g3_repo_mount_path | realpath }}/{{ g3_image_os_distro }}/{{ g3_image_os_distro_version }}"

  block:
    #---------------------------------------
    # 1. PXE - TFTP: Upload Bootloader & OS Installers
    #---------------------------------------   
    - name: "G3 - INIT: Setup PXE-TFTP - Upload Bootloader & OS Installers"
      ansible.builtin.include_tasks: "1_tftp.yml"
      loop: "{{ download_image_sources | default([]) }}"
      loop_control:
         loop_var:  "g3_image"
         index_var: "g3_image_index"       

    #---------------------------------------
    # 2. PXE - HTTP: Full Access to Images Repositories
    #--------------------------------------- 
    - name: "G3 - INIT: Setup PXE-HTTP - Create Images Repositories"
      ansible.builtin.include_tasks: "2_http.yml"
      loop: "{{ download_image_sources | default([]) }}"      
      loop_control:
         loop_var: "g3_image"
         index_var: "g3_image_index"
         
    - name: "G3 - INIT: Setup PXE-HTTP - Expose Images Repositories"
      ansible.builtin.include_tasks: "2_http/4_expose.yml"  

#---------------------------------------
# 3. PXE - ORAS: Full Access to Images Repositories
#---------------------------------------   
#- name: "------------------> G3- INIT - Populate ORAS Service <------------------" 
#  ignore_errors: yes
#  block:
  
   
    #- name: "G3 - INIT: Setup PXE-ORAS - Expose Images Repositories"
    #  ansible.builtin.include_tasks: "3_oras.yml"
    #  loop: "{{ download_image_sources | default([]) }}"
    #  loop_control:
    #     loop_var: "g3_image"
    #     index_var: "g3_image_index"                

    #---------------------------------------
    # 4. Permissions
    #---------------------------------------
    - name: "------------------> G3- INIT - Permissions <------------------"
      ignore_errors: yes
      ansible.builtin.include_tasks: "4_ready/1_permissions.yml"
