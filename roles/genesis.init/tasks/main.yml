- name: "------------------> G3- INIT GENESIS NODE <------------------" 
  ignore_errors: yes
  block:
    - name: "G3 - INIT"
      ansible.builtin.include_tasks: "{{ genesis_init_stage | default ('1_copy.yml') }}"
      loop:
         - "1_copy.yml"
         - "2_build.yml"
         - "3_load_ironic.yml" 
         - "4_load_oras.yml"          
      loop_control:
        loop_var: "genesis_init_stage"
       