      ansible.builtin.include_tasks: "{{ genesis_init_stage | default ('1_repos.yml') }}"
      loop:
         - "1_repos.yml"
         - "2_mount.yml"
         - "3_os_installer.yml" 
         #- "4_cloud_image_manifesto.yml"         
         #- "5_load_oras.yml"          
      loop_control:
        loop_var: "genesis_init_stage"
       