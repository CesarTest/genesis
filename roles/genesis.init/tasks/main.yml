#---------------------------------------
# 1. PXE - TFTP: Upload Bootloader & OS Installers
#---------------------------------------   
- name: "------------------> G3- INIT - Populate TFTP Service <------------------" 
  ignore_errors: yes
  block:
    - name: "G3 - INIT: Setup PXE-TFTP - Upload Bootloader & OS Installers"
      ansible.builtin.include_tasks: "1_tftp.yml"
      loop: "{{ download_image_sources | default([]) }}"
      loop_control:
         loop_var:  "g3_image"
         index_var: "g3_image_index"       

#---------------------------------------
# 2. PXE - HTTP: Full Access to Images Repositories
#--------------------------------------- 
- name: "------------------> Populate HTTP Service <------------------" 
  ignore_errors: yes
  vars:
    # HTTP Paths particulars    
    g3_os_images_repo_path: "{{ g3_repo_os_path | realpath }}/{{ g3_repos['os'] | default('os') }}"
    g3_os_images_http_path: "{{ g3_http_path    | realpath }}/{{ g3_repos['os'] | default('os') }}" 
    g3_cloud_images_repo_path: "{{ g3_repo_os_path | realpath }}/{{ g3_repos['cloud'] | default('dib') }}"
    g3_cloud_images_http_path: "{{ g3_http_path    | realpath }}/{{ g3_repos['cloud'] | default('dib') }}"     
    g3_mnt_repo_path: "{{ g3_repo_os_path | realpath }}/{{ g3_repos['repo'] | default('mnt') }}"
    g3_mnt_http_path: "{{ g3_http_path    | realpath }}/{{ g3_repos['repo'] | default('mnt') }}"       
    g3_manifesto_repo_path: "{{ genesis_repo_path | realpath }}/{{ g3_repos['manifesto'] | default('manifesto') }}"
    g3_manifesto_http_path: "{{ g3_http_path }}/{{ g3_repos['manifesto'] | default('manifesto') }}"  
    g3_paths_to_expose:
      - repo:   "{{ g3_manifesto_repo_path }}"  
        expose: "{{ g3_manifesto_http_path }}"
      - repo:   "{{ g3_os_images_repo_path }}"
        expose: "{{ g3_os_images_http_path }}"
      - repo:   "{{ g3_cloud_images_repo_path }}"
        expose: "{{ g3_cloud_images_http_path }}"
      - repo:   "{{ g3_mnt_repo_path }}"
        expose: "{{ g3_mnt_http_path }}"
  block:
    - name: "G3 - INIT: Setup PXE-HTTP - Create Images Repositories"
      ansible.builtin.include_tasks: "2_http.yml"
      loop_control:
         loop_var: "g3_image"
         index_var: "g3_image_index"
         
    - name: "G3 - INIT: Setup PXE-HTTP - Expose Images Repositories"
      ansible.builtin.include_tasks: "2_http/4_expose.yml"  

