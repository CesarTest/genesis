- name: "------------------> G3- INIT GENESIS NODE <------------------" 
  ignore_errors: yes
  block:

    #---------------------------------------
    # 1. PXE - TFTP: Upload Bootloader & OS Installers
    #---------------------------------------   
    - name: "G3 - INIT: Setup PXE-TFTP - Upload Bootloader & OS Installers"
      ansible.builtin.include_tasks: "1_tftp.yml"
      loop: "{{ download_image_sources | default([]) }}"
      loop_control:
         loop_var: "g3_image"
         index_var: "g3_image_index"       

    #---------------------------------------
    # 2. PXE - HTTP: Full Access to Images Repositories
    #--------------------------------------- 
    - name: "G3 - INIT: Setup PXE-HTTP - Expose Images Repositories"
      ansible.builtin.include_tasks: "2_http.yml"
      loop: "{{ download_image_sources | default([]) }}"
      loop_control:
         loop_var: "g3_image"
         index_var: "g3_image_index"      
  
