---
# genesis.init 2_http/3_expone.yml
#   - Expones Image Repositories
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

#---------------------------------------
# 1. MAC - Mandatory Access Control to Contents
#---------------------------------------  
- name: "STEP 2.1.- MAC - Mandatory Access Control to Contents"
  block: 
  
    # ----> 1.1. Linux Permissions: Ownership of Folders to Expose (Web Server Owner = Ironic)
    - name: "STEP 2.3 - HTTP: Grant Web Server Permission to Base Repo Path"
      ansible.builtin.file:
        path: "{{ http_exposure_subdir | realpath }}"
        mode: 'o+x'
      when:
        - http_exposure_subdir != '//'      
        - (http_exposure_subdir | realpath) != '/'
        - (http_exposure_subdir | realpath) != ''
      loop: "{{ g3_base_list_subfolders_base_path | default([ g3_base_path ]) }}"
      loop_control:
        loop_var: "http_exposure_subdir"
    
    - name: "STEP 2.3 - HTTP: Ownership Before exposure"
      ansible.builtin.file:
        path:  "{{ http_exposure.repo }}"
        owner: "{{ g3_webserver_user | default(omit) }}"
        group: "{{ g3_webserver_group | default(omit) }}"
        recurse: true
      loop: "{{ g3_paths_to_expose | default([]) }}"
      loop_control:
        loop_var: "http_exposure"

    # ----> 1.2. AppArmor
    # ----> 1.3. SELinux 
    # ----> 1.4. Crypto Policies 

#---------------------------------------
# 2. HTTP EXPOSURE - Ensure Access to Public Web Folder
#---------------------------------------     
- name: "STEP 2.1.- HTTP EXPOSURE - Ensure Access to Web Public Folder"
  block: 
      
    # ----> 2.1. Create Symbolik Links to HTTP folder
    - name: "STEP 2.3 - HTTP: Expose Image Repositories"
      file:
        src:   "{{ http_exposure.repo }}"
        dest:  "{{ http_exposure.expose }}"
        owner: "{{ g3_webserver_user  | default(omit) }}"
        group: "{{ g3_webserver_group | default(omit) }}"  
        state: link
      loop: "{{ g3_paths_to_expose | default([]) }}"
      loop_control:
        loop_var: "http_exposure"  
         
    # ----> 2.2. WebServer Update
    - name: "STEP 2.3 - HTTP: adjust Webserver Configurations Files"
      ansible.builtin.lineinfile:
        path:        "{{ g3_web.file        | default(omit) }}"
        regexp:      "{{ g3_web.regexp      | default(omit) }}"
        line:        "{{ g3_web.line        | default(omit) }}"    
        insertafter: "{{ g3_web.insertafter | default(omit) }}" 
      loop: "{{ g3_setup_webserver | default([]) }}"
      loop_control:
        loop_var: "g3_web"
      notify:
        - Restart Web Server