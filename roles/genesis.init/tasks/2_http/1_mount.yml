---
# genesis.init 1_tftp/3_mount.yml
#   - Mount ISOS to create local repositories
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#
- vars:
    g3_deploy_default_path: "{{ g3_deploy_mount_path | default('') }}" 
    g3_deploy_path: "{{ g3_image.mount_path | default( g3_deploy_default_path ) | realpath }}"
    g3_src_path:    "{{ g3_deploy_os_path | default('') }}" 
    g3_src_image:   "{{ g3_src_path | realpath }}/{{ g3_deploy_image_name }}"       
  block:
    - name: "G3 - INIT: Setup PXE-HTTP: 1 - Create Mount Folder"
      become: yes
      ansible.builtin.file:
        path: "{{ g3_deploy_path }}" 
        state: directory
        owner: "{{ g3_webserver_user | default(omit) }}"
        group: "{{ g3_webserver_group | default(omit) }}"  
      when: 
        - g3_image.mount is defined
        - g3_image.mount   

    - name: "G3 - INIT: Setup PXE-HTTP: 1 Mount ISO Image"
      become: yes
      ansible.posix.mount:
        path: "{{ g3_deploy_path }}"
        src:  "{{ g3_src_image }}"
        fstype: iso9660
        opts:  "{{ g3_iso_mount_properties | default(omit) }}"
        state: "{{ g3_mount_state          | default('present') }}"     
      loop:
        - unmounted
        - mounted
      loop_control:
        loop_var: "g3_mount_state"
      when: 
        - g3_image.mount is defined
        - g3_image.mount