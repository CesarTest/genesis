---
# genesis.bootstrap 2_download.yml
#   - Bootstrap Genesis Node for Airgap Ironic Install
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

#---------------------------------------
# 1. OpenStack Components
#--------------------------------------- 
- name: "G1 - BOOTSTRAP - 2.- Download: 1) OpenStack Components from GIT"
  ansible.builtin.include_tasks: "2_download/1_git.yml"

#---------------------------------------
# 2. OS Images
#--------------------------------------- 
- name: "G1 - BOOTSTRAP - 2.- Download: 2) OS Images"
  ansible.builtin.include_tasks: "2_download/2_os.yml"
  vars:
  
    # 1.- OS Particulars
    g1_image_os_distro:         "{{ g1_image.distribution | default('RedHat') | lower }}"
    g1_image_os_distro_version: "{{ g1_image.distribution_version | default('8') }}"
    g1_deploy_os_path:   "{{ g1_repo_os_path | realpath }}/{{ g1_image_os_distro }}/{{ g1_image_os_distro_version }}"
    g1_deploy_tftp_path:   "{{ g1_tftp_path | realpath }}/{{ g1_image_os_distro }}/{{ g1_image_os_distro_version }}"
    g1_deploy_mount_path:  "{{ g1_repo_mount_path | realpath }}/{{ g1_image_os_distro }}/{{ g1_image_os_distro_version }}"	
 
    # 2.- Image Name Default Values
    g1_deploy_image_url:          "{{ g1_image.image | default('')  }}"
    g1_deploy_image_default_name: "{{ g1_deploy_image_url | basename }}"
    g1_deploy_image_default_ext:  "{{ g1_deploy_image_default_name | ansible.builtin.splitext | last }}"
    g1_default_os_image_name:     "{{ genesis_default_os_image_name[g1_deploy_image_default_ext] |  default(g1_deploy_image_default_name) }}" 
    g1_deploy_image_name: "{{ g1_image.os_image_name | default(g1_default_os_image_name) }}" 
   
    # 3.- Download Folders
    g1_image_os_default_local_path: "{{ g1_repo_os_path | realpath }}/{{ g1_image_os_distro }}/{{ g1_image_os_distro_version }}"
    g1_image_os_local_folder: "{{ image_src.local_folder | default(g1_image_os_default_local_path) | realpath }}"
   
  loop: "{{ download_image_sources | default([]) }}"
  loop_control:
     loop_var: "g1_image"

#---------------------------------------
# 3. Tarballs
#--------------------------------------- 
- name: "G1 - BOOTSTRAP - 2.- Download: 4) Tarballs"
  ansible.builtin.include_tasks: "2_download/3_tarball.yml"
  vars:
    g1_oras_dest_path: "{{ g1_repo_openstack_path | realpath }}/{{ oras_tarball_name }}"
    g1_proxmox_default_tarball_name: "{{ proxmox_download_url | basename }}" 
    g1_proxmox_dest_path: "{{ g1_repo_openstack_path | realpath }}/{{ proxmox_download_name | default(g1_proxmox_default_tarball_name) }}"
    g1_tarball_download:
     - url:  "{{ oras_download_url }}"
       dest: "{{ g1_oras_dest_path }}"
       checksum: "sha256:{{ oras_checksum }}"
     - url: "{{ proxmox_download_url }}"
       dest: "{{ g1_proxmox_dest_path }}"
 
#---------------------------------------
# 4. IPA
#--------------------------------------- 
- name: "G1 - BOOTSTRAP - 2.- Download: 3) IPA (Ironic Python Agent) for Cloud OS Installation"
  ansible.builtin.include_tasks: "2_download/4_ipa.yml"
  loop: "{{ ipa_image_sources | default([]) }}"
  loop_control:
     loop_var: "g1_ipa_image"
