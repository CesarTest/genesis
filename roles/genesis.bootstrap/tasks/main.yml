---
# genesis.bootstrap main.yml
#   - Bootstrap Genesis Node for Airgap Ironic Install
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "------------------> G1- REFRESH GENESIS NODE <------------------" 
  block:

    #-------------------------------------
    # 1.- Load Sources
    #-------------------------------------
    - name: "G1 REFRESH - SOURCES : Ingesting sources.yml from inventory path"
      ansible.builtin.include_vars:
        file: "{{ inventory_dir | string }}/sources.yml"
      ignore_errors: true

    - name: "G1 REFRESH - SOURCES : Freezing verified source list into memory facts"
      ansible.builtin.set_fact:
        download_image_sources: "{{ genesis_download_images | default([]) }}"
      when:
        - genesis_sources_enabled is defined
        - genesis_sources_enabled is not none
        - genesis_sources_enabled | bool

    #-------------------------------------
    # 2.- Bootsrap the Node
    #-------------------------------------
    - ansible.builtin.include_tasks: "1_prepare/1_repos.yml"
    - ansible.builtin.include_tasks: "2_download.yml"
    - ansible.builtin.include_tasks: "3_ready/1_setup.yml"
    - ansible.builtin.include_tasks: "3_ready/2_network.yml"
        
  rescue:

    - name: "G1 - REFRESH : Try to Recover Network Configuration"
      ansible.builtin.include_tasks: "3_ready/2_network.yml"		
 
    - name: "------------------> G1- REFRESH GENESIS NODE - Error"
      debug:
        msg:
        - "Possible errors:"	 