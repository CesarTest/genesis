- name: "------------------> G1- REFRESH GENESIS NODE <------------------" 
  block:
  
    - name: "G1 - BOOTSTRAP : Prepare Target Machine"
      ansible.builtin.include_tasks: "1_prepare/1_repos.yml"
    - ansible.builtin.include_tasks: "2_download.yml"
    - ansible.builtin.include_tasks: "3_ready/1_setup.yml"
    - ansible.builtin.include_tasks: "3_ready/2_network.yml"
        
  rescue:

    - name: "G1 - REFRESH : Try to Recover Network Configuration"
      ansible.builtin.include_tasks: "3_ready/2_network.yml"		
 
    - name: "------------------> G1- REFRESH GENESIS NODE - Error"
      debug:
        msg:
        - "Possible errors:"	 