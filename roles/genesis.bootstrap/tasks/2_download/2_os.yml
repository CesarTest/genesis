---
# genesis.bootstrap 3_os.yml
#   - Download OS Images from Internet
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "G1 - BOOTSTRAP - 2.- Download OS: Tasks for element of the List"
  vars:
    # Image Source: URL Details
    deploy_image_upstream_url: "{{ g1_deploy_image_url  | default('') }}"
    deploy_image_checksum_url: "{{ g1_image.checksum   | default('') }}"
    deploy_image_checksum_algorithm: "{{ g1_image.checksum_algorithm | default(g1_default_checksum_algorithm) | default('sha256') }}" 
    
    # Image Destination: Path Details
    http_boot_folder: "{{ g1_image_os_local_folder }}"
    deploy_image_filename: "{{ g1_deploy_image_name }}"
    deploy_image: "{{ http_boot_folder }}/{{ deploy_image_filename }}"

  #---------------------------------------
  # 1. Download OS
  #--------------------------------------- 
  block:

    # 1.0. Log Image Download Properties
    #--------------------------------------- 
    - name: "G1 - BOOTSTRAP - 2.- Download OS:  2.0) Dump Download Properties"
      ignore_errors: true
      vars:
        t4_download_properties_block: |
          --- 1. OS Particulars ---
          Distro:       {{ g1_image_os_distro | default('[g1_image_os_distro is NOT DEFINED]') }}
          Version:      {{ g1_image_os_distro_version | default('[g1_image_os_distro_version is NOT DEFINED]') }}
          Major Ver:    {{ g1_image_os_distro_version_main | default('[g1_image_os_distro_version_main is NOT DEFINED]') }}
          Arch:         {{ g1_image_os_distro_arch | default('[g1_image_os_distro_arch is NOT DEFINED]') }}
          Alias:        {{ g1_image_os_distro_alias | default('[g1_image_os_distro_alias is NOT DEFINED]') }}
          
          --- Provision Paths ---
          OS Path:      {{ g1_deploy_os_path | default('[g1_deploy_os_path is NOT DEFINED]') }}
          TFTP Path:    {{ g1_deploy_tftp_path | default('[g1_deploy_tftp_path is NOT DEFINED]') }}
          
          --- Netinstaller URLs ---
          Pattern:      [{{ g1_image_os_netinstaller_url_pattern | default('[g1_image_os_netinstaller_url_pattern is NOT DEFINED]') }}]
          Arch URL:     [{{ g1_image_os_netinstaller_url_arch | default('[g1_image_os_netinstaller_url_arch is NOT DEFINED]') }}]
          Version URL:  [{{ g1_image_os_netinstaller_url_version | default('[g1_image_os_netinstaller_url_version is NOT DEFINED]') }}]
          Default URL:  [{{ g1_image_os_netinstaller_url_default | default('[g1_image_os_netinstaller_url_default is NOT DEFINED]') }}]
          Final URL:    [{{ g1_image_os_netinstaller_url | default('[g1_image_os_netinstaller_url is NOT DEFINED]') }}] 
          
          --- Firmware URLs ---
          Pattern:      [{{ g1_image_os_firmware_url_pattern | default('[g1_image_os_firmware_url_pattern is NOT DEFINED]') }}]
          Arch URL:     [{{ g1_image_os_firmware_url_arch | default('[g1_image_os_firmware_url_arch is NOT DEFINED]') }}]
          Version URL:  [{{ g1_image_os_firmware_url_version | default('[g1_image_os_firmware_url_version is NOT DEFINED]') }}]
          Default URL:  [{{ g1_image_os_firmware_url_default | default('[g1_image_os_firmware_url_default is NOT DEFINED]') }}]
          Final URL:    [{{ g1_image_os_firmware_url | default('[g1_image_os_firmware_url is NOT DEFINED]') }}] 
          
          --- 2. Image Naming ---
          Image URL:    {{ g1_deploy_image_url | default('[g1_deploy_image_url is NOT DEFINED]') }}
          Basename:     {{ g1_deploy_image_default_name | default('[g1_deploy_image_default_name is NOT DEFINED]') }}
          Extension:    {{ g1_deploy_image_default_ext | default('[g1_deploy_image_default_ext is NOT DEFINED]') }}
          Default Name: {{ g1_default_os_image_name | default('[g1_default_os_image_name is NOT DEFINED]') }}
          Final Name:   {{ g1_deploy_image_name | default('[g1_deploy_image_name is NOT DEFINED]') }}
          
          --- 3. Download Folders ---
          Default Path: {{ g1_image_os_default_local_path | default('[g1_image_os_default_local_path is NOT DEFINED]') }}
          Dest Folder:  {{ g1_image_os_local_folder | default('[g1_image_os_local_folder is NOT DEFINED]') }}
      ansible.builtin.debug:
        msg: "{{ t4_download_properties_block.splitlines() }}"

    # 1.1. Prepare Local Folders
    #--------------------------------------- 
    - name: "G1 - BOOTSTRAP - 2.- Download OS:  2.1) Create OS Local Folder"
      ansible.builtin.file: 
        path: "{{ g1_image_os_local_folder }}"
        state: directory
        recurse: true
        owner: "{{ ansible_user | default('ironic') }}"
        group: "{{ ansible_user | default('ironic') }}"
        mode: "0775"
   
    # 1.2. Download Images
    #--------------------------------------- 
    - name: "G1 - BOOTSTRAP - 2.- Download OS: 2.2) Download OS Images"
      ansible.builtin.include_tasks: "{{ genesis_bifrost_ironic_install }}/tasks/download_deployment_image.yml"
  
  rescue:
    - name: "G1 - BOOTSTRAP - 2.- Download OS: Handle Base Image Download Warning"
      vars:
        t4_rescue_base_block: |
          [WARN] G1 - BOOTSTRAP - 2.- Download OS: Base Image Download Problem.
          ------------------------------------------------------------------------------------
          Distro Target: {{ g1_image_os_distro | default('g1_image_os_distro is NOT DEFINED') }} {{ g1_image_os_distro_version | default('g1_image_os_distro_version is NOT DEFINED') }}
          
          Potential Issues (Execution continues):
            => 1. Upstream URL could be unreachable: [{{ deploy_image_upstream_url }}]
            => 2. Checksum validation failed or file not present: [{{ deploy_image_checksum_url }}]
            => 3. Local directory path issue: {{ g1_image_os_local_folder | default('N/A') }}
      ansible.builtin.debug:
        msg: "{{ t4_rescue_base_block.splitlines() }}"

  #---------------------------------------
  # 2.  Download ISO NetInstaller
  #---------------------------------------  
- vars:
    deploy_image_filename: "netinstaller.iso"
    deploy_image_upstream_url: "{{ g1_image_os_netinstaller_url | default('') }}"
    deploy_image_checksum_url: "{{ g1_image_os_netinstaller_url | default('') | dirname }}/SHA256SUMS"
    deploy_image_checksum_algorithm: "sha256"
    deploy_image: "{{ g1_image_os_local_folder | default('') }}/{{ deploy_image_filename }}"

  block:
    - name: "G1 - BOOTSTRAP - 2.- Download OS: 2.3) Download NetInstall Bootloader ISO Version"
      ansible.builtin.include_tasks: "{{ genesis_bifrost_ironic_install }}/tasks/download_deployment_image.yml"

  rescue:
    - name: "G1 - BOOTSTRAP - 2.- Download OS: Handle ISO Warning"
      vars:
        t4_rescue_iso_block: |
          [WARN] G1 - BOOTSTRAP - 2.- Download OS: ISO NetInstaller Component Problem.
          -----------------------------------------------------------------------------------
          Target ISO Filename: {{ deploy_image_filename }}
          
          --- Runtime Variables Dump ---
          Upstream ISO URL: [{{ deploy_image_upstream_url | default('NOT DEFINED') }}]
          Checksum URL:     [{{ deploy_image_checksum_url | default('NOT DEFINED') }}]
          Checksum Algo:    {{ deploy_image_checksum_algorithm }}
          Local Target Dest: {{ deploy_image | default('NOT DEFINED') }}
          
          Potential Issues (Execution continues):
            => 1. ISO Netinstaller URL is down, misconfigured or unreachable.
            => 2. Expected SHA256SUMS file is missing or hash match failed at parent directory.
            => 3. Insufficient disk space on host or target path lacks write permissions.
      ansible.builtin.debug:
        msg: "{{ t4_rescue_iso_block.splitlines() }}"

  when:
    - g1_image.netinstall_ramdisk is defined
    - g1_image.netinstall_ramdisk is not none
    - g1_image.netinstall_ramdisk is string
    - "'iso' in g1_image.netinstall_ramdisk"
    - g1_image_os_netinstaller_url is defined
    - g1_image_os_netinstaller_url is not none
    - g1_image_os_netinstaller_url is string
    - g1_image_os_netinstaller_url | length > 0

  #---------------------------------------
  # 3.  Download TARBALL NetInstaller
  #---------------------------------------  
- vars:
    g1_distro_definitions: "{{ genesis_os_definitions[g1_image_os_distro] | default({}) }}"
    g1_image_os_ramdisk: "{{ g1_distro_definitions['ramdisk'] | default(g1_image_os_local_folder ~ 'initrd.gz')  | default('') }}"
    g1_concat_addition_filename: "{{ g1_image_os_firmware_url | default('') | basename | default('firmware.cpio.gz', true) }}"
    g1_concat_addition: "{{ g1_image_os_local_folder  | default('') }}/{{ g1_concat_addition_filename }}"
    g1_concat_src:      "{{ g1_image_os_local_folder  | default('') }}/{{ g1_image_os_ramdisk  | default('') }}" 
    g1_concat_dest:     "{{ g1_image_os_local_folder  | default('') }}/{{ g1_image_os_ramdisk  | default('') }}" 
    g1_tarball_download: 
      - url:  "{{ g1_image_os_netinstaller_url | default(omit) }}"
        dest: "{{ g1_image_os_local_folder     | default(omit) }}"
        unzip: true
      - url:  "{{ g1_image_os_firmware_url     | default(omit) }}"
        dest: "{{ g1_image_os_local_folder     | default(omit) }}"
        unzip: false
        concat_addition: "{{ g1_concat_addition | default('') }}"
        concat_src:      "{{ g1_concat_src      | default('') }}"
        concat_dest:     "{{ g1_concat_dest     | default('') }}"

  block:
    - name: "G1 - BOOTSTRAP - 2.- Download OS: 2.4) Download NetInstall Bootloader Tarball Version"
      ansible.builtin.include_tasks: "3_tarball.yml"

  rescue:
    - name: "G1 - BOOTSTRAP - 2.- Download OS: Handle Tarball Warning"
      vars:
        t4_rescue_tarball_block: |
          [WARN] G1 - BOOTSTRAP - 2.- Download OS: Tarball / Firmware Processing Flow Problem.
          ------------------------------------------------------------------------------------
          Target Distro: {{ g1_image_os_distro | default('N/A') }} {{ g1_image_os_distro_version | default('') }}
          
          --- Runtime Variables Dump ---
          Netinstaller URL: [{{ g1_image_os_netinstaller_url | default('NOT DEFINED') }}]
          Firmware URL:     [{{ g1_image_os_firmware_url | default('NOT DEFINED') }}]
          Local Folder:     {{ g1_image_os_local_folder | default('NOT DEFINED') }}
          
          --- Pipeline Concatenation Specs ---
          Concat Src:       {{ g1_concat_src | default('NOT DEFINED') }}
          Concat Addition:  {{ g1_concat_addition | default('NOT DEFINED') }}
          Concat Dest:      {{ g1_concat_dest | default('NOT DEFINED') }}
          
          Potential Issues (Execution continues):
            => 1. Netinstaller components or Firmware URL could not be pulled from upstream.
            => 2. Post-download pipeline issue (Unarchive tasks or binary concatenation crashed).
            => 3. Permissions / Lock issues on destination folder or missing base 'initrd.gz'.
            => 4. Check '3_tarball.yml' execution logs for specific step details.
      ansible.builtin.debug:
        msg: "{{ t4_rescue_tarball_block.splitlines() }}"

  when:
    - g1_image.firmware_ramdisk | default(false) | bool
    - g1_image.netinstall_ramdisk is defined
    - g1_image.netinstall_ramdisk is not none
    - g1_image.netinstall_ramdisk is string
    - "'tarball' in g1_image.netinstall_ramdisk"
    - g1_image_os_netinstaller_url is defined
    - g1_image_os_netinstaller_url is not none
    - g1_image_os_netinstaller_url is string
    - g1_image_os_netinstaller_url | length > 0
