---
# genesis.bootstrap 3_os.yml
#   - Download OS Images from Internet
#   - Download NetInstaler Associated from whhch extract installer RAM Disk/Kernel
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

#---------------------------------------
# 1. Download OS
#--------------------------------------- 
- name: "G1 - BOOTSTRAP - 2.- Download OS: Download OS Images"
  become: true
  vars:
    # Image Source: URL Details
    deploy_image_upstream_url:       "{{ g1_deploy_image_url                 | default('') }}"
    deploy_image_checksum_url:       "{{ g1_image_os_installer_checksum_url  | default(deploy_image_upstream_url ~ 'SHA256SUMS', true) }}"
    deploy_image_checksum_algorithm: "{{ g1_image_os_installer_checksum_algo | default('sha256') }}" 
    
    # Image Destination: Path Details
    http_boot_folder:      "{{ g1_image_os_local_folder | default('/var/www/html', true) }}"
    deploy_image_filename: "{{ g1_deploy_image_name     | default('amd.64.iso', true)    }}"
    deploy_image:          "{{ http_boot_folder }}/{{ deploy_image_filename }}"
  block:
 
    # 1.0. Log Image Download Properties
    #--------------------------------------- 
    - name: "G1 - BOOTSTRAP - 2.- Download OS:  2.0) Dump Download Properties"
      ignore_errors: true
      ansible.builtin.debug:
        msg: "{{ t4_download_properties_block.splitlines() }}"
      vars:
        t4_download_properties_block: |
          --- 1. OS Particulars ---
          Distro:       [{{ g1_image_os_distro              | default('g1_image_os_distro is NOT DEFINED') }}]
          Version:      [{{ g1_image_os_distro_version      | default('g1_image_os_distro_version is NOT DEFINED') }}]
          Latest:       [{{ g1_image_os_distro_version_latest| default('g1_image_os_distro_version_latest is NOT DEFINED') }}]
          Major Ver:    [{{ g1_image_os_distro_version_main | default('g1_image_os_distro_version_main is NOT DEFINED') }}]
          Arch:         [{{ g1_image_os_distro_arch         | default('g1_image_os_distro_arch is NOT DEFINED') }}]
          Alias:        [{{ g1_image_os_distro_alias        | default('g1_image_os_distro_alias is NOT DEFINED') }}]
          Inst Type:    [{{ g1_image_os_installer_type      | default('g1_image_os_installer_type is NOT DEFINED') }}]
          Netinst Type: [{{ g1_image_os_netinstaller_type   | default('g1_image_os_netinstaller_type is NOT DEFINED') }}]
           
          --- Provision Paths ---
          OS Path:      [{{ g1_deploy_os_path   | default('g1_deploy_os_path is NOT DEFINED') }}]
          TFTP Path:    [{{ g1_deploy_tftp_path | default('g1_deploy_tftp_path is NOT DEFINED') }}]
          
          --- Installer URL Cascade Trace ---
          Pattern:      [{{ g1_image_os_installer_url_pattern    | default('g1_image_os_installer_url_pattern is NOT DEFINED') }}]
          After Arch:   [{{ g1_image_os_installer_url_arch       | default('g1_image_os_installer_url_arch is NOT DEFINED') }}]
          After Ver:    [{{ g1_image_os_installer_url_version    | default('g1_image_os_installer_url_version is NOT DEFINED') }}]
          Default:      [{{ g1_image_os_installer_url_default    | default('g1_image_os_installer_url_default is NOT DEFINED') }}]
          Final URL:    [{{ g1_image_os_installer_url            | default('g1_image_os_installer_url is NOT DEFINED') }}]
                  
          --- 2. Image Naming ---
          Upstream URL:  [{{ deploy_image_upstream_url       | default('deploy_image_upstream_url is NOT DEFINED') }}]
          Checksum URL:  [{{ deploy_image_checksum_url       | default('deploy_image_checksum_url is NOT DEFINED') }}]
          Checksum Algo: [{{ deploy_image_checksum_algorithm | default('deploy_image_checksum_algorithm is NOT DEFINED') }}]
          Final Filename:[{{ deploy_image_filename           | default('deploy_image_filename is NOT DEFINED') }}]
          - - -  Naming y Jinja2 Debug - - -
          URL Basename (Default Name):  [{{ g1_deploy_image_default_name       | default('g1_deploy_image_default_name is NOT DEFINED') }}]
          URL Extension (Splitext):     [{{ g1_deploy_image_default_ext        | default('g1_deploy_image_default_ext is NOT DEFINED') }}]
          Computed Name by Arch:        [{{ g1_default_os_image_name_default_arch| default('g1_default_os_image_name_default_arch is NOT DEFINED') }}]
          Computed Name by Ext:         [{{ g1_default_os_image_name_default   | default('g1_default_os_image_name_default is NOT DEFINED') }}]
          Dynamic Fallback Base:        [{{ g1_default_os_image_name         | default('g1_default_os_image_name is NOT DEFINED') }}]
          Explicit Image Override:      [{{ g1_image.os_image_name             | default('g1_image.os_image_name is NOT DEFINED') }}]
          RESOLVED DEPLOY IMAGE NAME:   [{{ g1_deploy_image_name               | default('g1_deploy_image_name is NOT DEFINED') }}]
          
          --- 3. Download Folders ---
          Default Folder: [{{ g1_image_os_local_folder | default('g1_image_os_local_folder is NOT DEFINED') }}]
          Dest Path:      [{{ http_boot_folder         | default('http_boot_folder is NOT DEFINED') }}]
      ignore_errors: true
      delegate_to: localhost
      connection: local

    # 1.1. Prepare Local Folders
    #--------------------------------------- 
    - name: "G1 - BOOTSTRAP - 2.- Download OS:  2.1) Create OS Local Folder"
      ansible.builtin.file: 
        path: "{{ g1_image_os_local_folder }}"
        state: directory
        recurse: true
        owner: "{{ ansible_user | default('ironic') }}"
        group: "{{ ansible_user | default('ironic') }}"
        mode: "0775"
   
    # 1.2. Download Images
    #--------------------------------------- 
    - name: "G1 - BOOTSTRAP - 2.- Download OS: 2.2) Download OS Images"
      ansible.builtin.include_tasks: "{{ genesis_bifrost_ironic_install }}/tasks/download_deployment_image.yml"

  rescue:
    - name: "G1 - BOOTSTRAP - 2.- Download OS: Handle Base Image Download Warning"
      ansible.builtin.debug:
        msg: "{{ t4_rescue_base_block.splitlines() }}"
      vars:
        t4_rescue_base_block: |
          [WARN] G1 - BOOTSTRAP - 2.- Download OS: Base Image Download Problem.
          ------------------------------------------------------------------------------------
          Distro Target: [{{ g1_image_os_distro | default('g1_image_os_distro is NOT DEFINED') }}/{{ g1_image_os_distro_version | default('g1_image_os_distro_version is NOT DEFINED') }}]
          
          Potential Issues (Execution continues):
            => 1. Upstream URL could be unreachable: [{{ deploy_image_upstream_url              | default('deploy_image_upstream_url NOT DEFINED') }}]
            => 2. Checksum validation failed or file not present: [{{ deploy_image_checksum_url | default('deploy_image_checksum_url NOT DEFINED') }}]
            => 3. Local directory path issue: [{{ g1_image_os_local_folder                      | default('g1_image_os_local_folder NOT DEFINED')  }}]
      ignore_errors: true
      delegate_to: localhost
      connection: local

  #---------------------------------------
  # 2.  Download NetInstaller
  #---------------------------------------  
- name: "G1 - BOOTSTRAP - 2.- Download OS: Download NetInstall Bootloader TARBALL Version"
  vars:
    g1_tarball_download_src:
      tarball:
        - url:  "{{ g1_image_os_netinstaller_url | default(omit) }}"
          dest: "{{ g1_image_os_local_folder     | default(omit) }}"
          unzip: true
        - url:  "{{ g1_image_os_firmware_url     | default(omit) }}"
          dest: "{{ g1_image_os_local_folder     | default(omit) }}"
          unzip: false
      mini:
        - url:  "{{ g1_image_os_netinstaller_url | default(omit) }}"
          dest: "{{ g1_image_os_local_folder     | default(omit) }}"
          unzip: false
        - url:  "{{ g1_image_os_firmware_url     | default(omit) }}"
          dest: "{{ g1_image_os_local_folder     | default(omit) }}"
          unzip: false
    g1_netinstall_type:  "{{ g1_image.netinstall_ramdisk                 | default('none',true) }}"
    g1_tarball_download: "{{ g1_tarball_download_src[g1_netinstall_type] | default([],true) }}"

  block:
  
    - name: "G1 - BOOTSTRAP - 2.- Download OS: 2.3) Download NetInstall Bootloader Tarball Version"
      ansible.builtin.debug:
        msg: "{{ t4_download_properties_block.splitlines() }}"
      vars:
        t4_download_properties_block: |
          --- Firmware & Tarball Matrix ---
          Mode Type:   [{{ g1_netinstall_type }}]
          Local Folder:[{{ g1_image_os_local_folder   | default('g1_image_os_local_folder NOT DEFINED') }}]
          Firmware URL:[{{ g1_image_os_firmware_url   | default('g1_image_os_firmware_url NOT DEFINED') }}]
          
          --- Processing Matrix Payload ---
          {{ g1_tarball_download | to_nice_yaml }}
      delegate_to: localhost
      connection: local
      ignore_errors: true

    - name: "G1 - BOOTSTRAP - 2.- Download OS: 2.3) Download NetInstall Bootloader Tarball Version"
      ansible.builtin.include_tasks: "3_tarball.yml"

  rescue:
    - name: "G1 - BOOTSTRAP - 2.- Download OS: Netinstall Tarball Warning"
      ansible.builtin.debug:
        msg: "{{ t4_rescue_tarball_block.splitlines() }}"
      vars:
        t4_rescue_tarball_block: |
          [WARN] G1 - BOOTSTRAP - 2.- Download OS: Netinstall Tarball Flow Problem.
          ------------------------------------------------------------------------------------
          Target Distro:    [{{ g1_image_os_distro | default('g1_image_os_distro NOT DEFINED') }}]
          Target Version:   [{{ g1_image_os_distro_version | default('g1_image_os_distro_version NOT DEFINED') }}]
          Netinstall Type:  [{{ g1_netinstall_type | default('NOT DEFINED') }}]
          
          --- Runtime Variables Dump ---
          Netinstaller URL: [{{ g1_image_os_netinstaller_url | default('g1_image_os_netinstaller_url NOT DEFINED') }}]
          Checksum URL:     [{{ g1_image_os_netinstaller_checksum_url | default('g1_image_os_netinstaller_checksum_url NOT DEFINED') }}]
          Checksum Algo:    [{{ g1_image_os_netinstaller_checksum_algo | default('g1_image_os_netinstaller_checksum_algo NOT DEFINED') }}]
          Firmware URL:     [{{ g1_image_os_firmware_url | default('g1_image_os_firmware_url NOT DEFINED') }}]
          Drivers URL:      [{{ g1_image_os_drivers_url | default('g1_image_os_drivers_url NOT DEFINED') }}]
          Local Folder:     [{{ g1_image_os_local_folder | default('g1_image_os_local_folder NOT DEFINED') }}]
          
          Potential Issues (Execution continues):
            => 1. Netinstaller components, Integrity Checksums, Firmware, or Drivers URL could not be pulled from upstream.
            => 2. Mismatch on expected vs actual cryptographic signature/hash during the download stage.
            => 3. Permissions / Lock issues on destination folder or network timeout.
            => 4. Check '3_tarball.yml' execution logs for specific step details.
      ignore_errors: true
      delegate_to: localhost
      connection: local
  when:
    - g1_tarball_download | default([],true) | length > 0