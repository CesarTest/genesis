- block:
   - name: "G1 - BOOTSTRAP - 2.- Download: 1) OpenStack Components"
     ansible.builtin.include_role: 
       name: "bifrost-prep-for-install"
   
   - name: "G1 - BOOTSTRAP - 2.- Download: 2) Sylva Components"
     ansible.builtin.include_role: 
       name: "bifrost-prep-for-install"
     vars:
       bifrost_install_sources: "{{ b1_sylva_git_repos | default([]) }}"
       
  when: not (skip_install | default(false) | bool)
