---
# genesis.bootstrap 3_os.yml
#   - Download OS Images from Internet
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

#---------------------------------------
# 1. Prepare Local Folders
#--------------------------------------- 
- name: "STEP 3 - Create OS Local Folder"
  file: 
    path: "{{ deploy_local_folder }}"
    state: directory
    recurse: true
    owner: "{{ansible_user | default('ironic') }}"
    group: "{{ansible_user | default('ironic') }}"
    mode: "775"
  loop: "{{ download_image_sources | default([]) }}"
  loop_control:
     loop_var: "image_src"
  vars:
     deploy_image: "{{ image_src.image | default('') | basename }}"
     default_local_repo: "{{ image_src.local_repo | default('os') }}"
     #default_distro: "{{ deploy_image | regex_search('([a-zA-Z]+)(?=-\\d+)', '\\1')  | first }}" 
     #default_version: "{{ deploy_image | regex_search('(\\d+)(?=-[^0-9]*\\.)', '\\1') | first }}"
     os_distro:  "{{ image_src.distribution | default('distro') }}"
     os_version: "{{ image_src.distribution_version | default ('unknown') }}"
     default_local_path: "{{ default_local_repo }}/{{ os_distro }}/{{ os_version }}"
     download_local_path: "{{ image_src.local_folder | default(default_local_path) }}"
     deploy_local_folder: "{{ genesis_repo_path | default('/tmp') | realpath }}/{{ download_local_path }}" 

#---------------------------------------
# 2. Download Images
#--------------------------------------- 
- name: "STEP 3 - Download OS Cloud Ready images"
  include_tasks: "{{ genesis_bifrost_ironic_install }}/tasks/download_deployment_image.yml"
  loop: "{{ download_image_sources | default([]) }}"
  loop_control:
     loop_var: "image_src"
  vars:
     deploy_image_upstream_url: "{{ image_src.image    | default('') }}"
     deploy_image_checksum_url: "{{ image_src.checksum | default('') }}"
     deploy_image_checksum_algorithm: "{{ image_src.checksum_algorithm | default('') }}"
     deploy_image_filename: "{{ image_src.image | basename }}"
     default_local_repo: "{{ image_src.local_repo | default('os') }}"
     #default_distro: "{{ deploy_image | regex_search('([a-zA-Z]+)(?=-\\d+)', '\\1')  | first }}" 
     #default_version: "{{ deploy_image | regex_search('(\\d+)(?=-[^0-9]*\\.)', '\\1') | first }}"
     os_distro:  "{{ image_src.distribution  | default('distro') }}"
     os_version: "{{ image_src.distribution_version | default ('unknown') }}"
     default_local_path: "{{ default_local_repo }}/{{ os_distro }}/{{ os_version }}"
     download_local_path: "{{ image_src.local_folder | default(default_local_path) }}"
     deploy_local_folder: "{{ genesis_repo_path | default('/tmp') | realpath }}/{{ download_local_path }}"      
     http_boot_folder: "{{ deploy_local_folder }}"
     deploy_image_default_name: "{{ image_src.image | default('') | basename }}"
     deploy_image_default_ext: "{{ deploy_image_default_name | ansible.builtin.splitext | last }}"
     default_os_image_name: "{{ genesis_default_os_image_name[deploy_image_default_ext] | default(deploy_image_default_name) }}" 
     deploy_image_name: "{{ image_src.os_image_name | default(default_os_image_name) }}"
     deploy_image: "{{ http_boot_folder }}/{{ deploy_image_name }}"