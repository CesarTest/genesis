---
# genesis.setup defaults
#   - Generate Install Manifesto for each Node
#   - Enroll Nodes
#   - Set Boot Interface
#   - Set deploy Interface
#   - Move across node life cycle transitions until Available State
#  
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

######################################################
#  GENESIS PATHS (global for update all genesis roles at once)
######################################################
# 1.- Repos Paths
genesis_repo_path:     "{{ role_path }}/../../repo"
genesis_local_repo_url: "file://{{ genesis_repo_path | realpath }}"

# 2.- Bifrost Role Paths
genesis_bifrost_role_name: "genesis.bifrost"
genesis_bifrost_path:  "{{ role_path }}/../{{ genesis_bifrost_role_name }}"
genesis_bifrost_roles: "{{ genesis_bifrost_path | realpath }}/{{ genesis_bifrost_role_name }}/playbooks/roles"
genesis_bifrost_files_path: "{{ genesis_bifrost_path | realpath }}/files"
genesis_bifrost_venv_dir: "{{ lookup('env', 'VENV') or '/opt/stack/bifrost' }}"

# 3.- Repositories
genesis_default_repos:
  os: "os"
  manifesto: "manifesto" 
  components: "openstack"
  cloud: "dib"
  ipa: "dib/files" 
  repo: "mnt"

genesis_os:
  centos:
    ansible_distribution: "CentOS"
    installer: "anaconda"
    manifesto: 
      - "kickstart.j2"
    prefix: "ks_"
    ext: ".ks" 
  redhat:
    ansible_distribution: "RedHat"
    installer: "anaconda"
    manifesto: 
      - "kickstart.j2"
    prefix: "ks_"
    ext: ".ks"     
  ubuntu:
    ansible_distribution: "Ubuntu"
    installer: "subsiquity"
    manifesto_folder: yes
    manifesto: 
      - "cloud-init/meta-data.j2"
      - "cloud-init/user-data.j2"     

######################################################
# B4 - PATHS
######################################################
b4_repos: "{{ genesis_airgap_repos | default(genesis_default_repos) }}" 
b4_repo_os_path: "{{ genesis_repo_path | realpath }}/{{ b4_repos['os'] | default('os') }}"
b4_manifesto_subpath: "{{ b4_repos['manifesto'] | default('manifesto') }}"
b4_repo_manifesto_path: "{{ genesis_repo_path | realpath }}/{{ b4_manifesto_subpath }}"
b4_http_manifesto_path: "{{ ironic_http_path | realpath }}/{{ b4_manifesto_subpath }}"

######################################################
#  BIFROST ROLES DEFINITION 
######################################################
b4_configdrive_roles:
   - name: "bifrost-configdrives-dynamic"

b4_enroll_roles:
   - name: "ironic-enroll-dynamic"
   - name: "ironic-inspect-node"
     condition: "{{ inspect_nodes | default('false') | bool }}" 

######################################################
# NODE PARTICULARS
######################################################

# 1.- Node Details
#------------------
# 1.1.- Properties
b4_node_name: "{{ name | default(hostname) | default(inventory_hostname_short) | default(ansible_hostname) | default('nohost') }}"

   

# 1.2.- BMC
b4_node_bmc_driver: "{{ driver | default('redfish') }}"
b4_node_bmc_info:   "{{ driver_info | default('') }}"
b4_node_bmc_mac:    ""
b4_node_bmc_ip: "{{ netaddress | default('genesis') }}"
b4_node_bmc_gateway: ""
b4_node_bmc_netmask: ""

# 1.2.- OS
b4_capture_node_os: "{{ os.name | default('centos') | lower }}"
b4_node_os: "{{ genesis_os[b4_capture_node_os]['ansible_distribution'] }}"
b4_node_os_version: "{{ os.version | default('9') }}"
b4_node_os_arch:    "{{ os.arch | default('x86_64') }}"
b4_node_os_installer: "{{ genesis_os[b4_capture_node_os]['installer'] | default('anaconda') }}"
b4_node_os_manifesto_template: "{{ genesis_os[b4_capture_node_os]['manifesto'] | default( [ 'kickstart.j2' ] )}}"
b4_node_os_manifesto_prefix: "{{ genesis_os[b4_capture_node_os]['prefix'] | default('ks_') }}"
b4_node_os_manifesto_ext: "{{ genesis_os[b4_capture_node_os]['ext'] | default('.ks') }}"
b4_node_os_manifesto_in_folder: "{{  genesis_os[b4_capture_node_os]['manifesto_folder'] | default(false) }}"
b4_node_os_manifesto_path:  "{{ b4_repo_manifesto_path }}{{ b4_node_os_manifesto_in_folder | ternary('/'+b4_node_name,'','') }}"
 
# 2.- Users 
#------------------
b4_default_user_name: 'genesis'
b4_default_user_password: ''
b4_root_user_password: ''

# 3.- OS Installers URLs
#------------------
b4_netinstall_repo_path: "{{ b4_node_os | lower }}{{ b4_node_os_version | lower}}"
b4_netinstall_iso_path: "{{ b4_node_os }}/{{ b4_node_os_version }}"

b4_manifesto_url: "http://{{ b4_manifesto_subpath }}/{{ b4_node_os_manifesto_file | default('') }}" 
b4_netinstall_iso_url: "http://{{ b4_netinstall_iso_path }}/{{ b4_node_os_arch }}.iso" 
b4_netinstall_url: "http://{{ b4_netinstall_repo_path }}"


######################################################
#  OS_NATIVE: BOOTLOADERS MENU RENDERING
###################################################### 
b4_bootloaders_menu:
   kickstart:  "inst.ks={{ b4_manifesto_url }} inst.repo={{ b4_netinstall_url }}"
   esxi:       "ks={{ b4_manifesto_url }}"
   cloud-init: "url={{ b4_netinstall_iso_url }} autoinstall ds=nocloud-net;s={{ b4_manifesto_url }}"
   preseed:    "auto=true priority=critical url={{ b4_manifesto_url }}"
   ignition:   "ignition.config.url={{ b4_manifesto_url }} ip=dhcp" 
   
######################################################
#  NODE LIFECYCLE STAGES DEFINITION
###################################################### 
