#####################################################
#  OS Installer Call from Bootloader
##################################################### 

#------------------------------------
# 1.- OS Installer Call from Bootloader
#------------------------------------
# SINGLE INTERFACE ENFORCEMENT & STATIC IP CONFIGURATION
#  - Multi-NIC race condition during PXE boot.
#  - Triple DHCP problem (ie.: PXE, dracut, anaconda)... assign statically
#
#  [ DHCP 1: Hardware/iPXE ]  ➔  [ DHCP 2: Initramfs/Dracut ]  ➔  [ DHCP 3: Installer/Anaconda ]
#             │                                │                                │
#     ALLOWED (Inevitable)                BLOCKED!                         BLOCKED!
#     (Temporary dynamic IP to           (Static anchoring via             (Direct inheritance via
#      fetch vmlinuz/initrd.img)          'ifname' and 'none' token)        'ksdevice=net0' flag)

# 2.1- NIC Rendering
#.....................................
# Syntax: ip=<client_ip>:<peer_ip>:<gateway>:<netmask>:<hostname>:<interface>:<autoconf>
#
# - client_ip : Static IPv4 address for the target machine.
# - peer_ip   : Boot/TFTP server IP (Left empty as "::" to bypass/skip).
# - gateway   : Default gateway routing IP (Genesis node infrastructure IP).
# - netmask   : Subnet mask string (e.g., 255.255.255.0).
# - hostname  : Alphanumeric node identity string (e.g., servera199).
# - interface : Physical or logic network card identifier (e.g., net0).
# - autoconf  : Set to "none" to completely kill implicit DHCP discovery loops.
# ==============================================================================
b4_render_ip: "{{ b4_enroll_nic_provision_ip }}::{{ b4_enroll_nic_provision_gateway }}:{{ b4_enroll_nic_provision_netmask }}:{{ b4_enroll_node_name }}"
b4_render_mac: "{{ b4_enroll_nic_provision_mac | default('') | lower | replace(':', '-') }}"
b4_render_ifname: "net0"

# --> Source Installers Renderering
b4_render_ksroot: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definitions.install | default('install.img') }}"
b4_render_ignroot: "{{ b4_render_ksroot }}"
# Beware with \; => Required for PXE,iPXE... but not for GRUB
b4_render_casperds: 'nocloud-net;s={{ b4_node_os_manifesto["url"] | default("") }}'
b4_render_modules_casper: "r8125,r8168,r8169,e1000e,igb,ixgbe,i40e,ice,tg3,bnxt_en,bnx2x,mlx5_core,virtio_net,vmxnet3"
b4_render_presubpath: "/{{ b4_os_mounted_repo_subpath }}/{{ b4_url_full_subpath }}"
b4_render_modules_preseed: "sd_mod,scsi_mod,mpt3sas,megaraid_sas,hpsa,virtio_blk"

# 2.2- Menu Rendering
#.....................................
# --> Kernel & InitRam
b4_render_kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definitions.kernel | default('vmlinuz') }}"
b4_render_initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definitions.ramdisk | default('initrd') }}"


# --> Menus
# ==============================================================================
# FAMILY 1: DRACUT FRAMEWORK ARCHITECTURE (PERSISTENT STAGE LIFECYCLE)
# TARGET SYSTEMS: Red Hat/CentOS/Rocky (Anaconda), SUSE 16 (Agama), CoreOS (Ignition), MicroOS.
#
# PARSING LOGIC:
# The Dracut engine natively understands dot-separated (.) syntax in both stages. 
# Ironic transmits dots safely, and the underlying installer successfully processes them.
#
# STAGE I: INITRAMFS EARLY KERNEL SPACE (RAM Space Execution)
# ------------------------------------------------------------------------------
# 1. root=live:<URL>:
#    Instructs the early RAM kernel to download and mount the target runtime squashfs root.
#    Critlcally important to bypass root=/dev/ram0 that Ironic Ramdisk deployment render into iPXE menu.
# 2. ifname=<interface>:<MAC>:
#    Executed strictly in RAM space. Binds the hardware MAC to a fixed custom token (e.g., net0).
# 3. ip=<client-ip>::<gw>:<netmask>:<hostname>:<interface>:none:
#    Positional argument for RAM space network configuration. The ':none' suffix completely 
#    disables early kernel-level DHCP broadcast loops on the specified interface.
# 4. rd.neednet=1:
#    Forces runtime network persistence inside the initramfs, preventing the RAM space 
#    from killing the network link prior to handing over control.
#
# STAGE II: INSTALLER USER-SPACE ENVIRONMENT (Installer Space Handover)
# ------------------------------------------------------------------------------
# 5. coreos.inst.<parameter>=<value> (CoreOS Installer Space):
#    Explicitly targeted at the secondary user-space installation script. These flags bypass 
#    the RAM kernel entirely and are parsed only after the live rootfs payload has been staged.
# 6. Continuous Lifecycle Handover:
#    BEHAVIOR: Unlike legacy d-i platforms, modern Dracut-powered installer environments (Anaconda, 
#    Agama, Ignition, Combustion) directly INHERIT the network interface state and custom name (net0) 
#    instantiated during Stage I. 
#    The host maintains unbroken network connectivity (ICMP/Ping active) througho
# ==============================================================================
b4_render_menu_anaconda: >-
    root=live:{{ b4_render_ksroot }}
    inst.ks={{ b4_node_os_manifesto['url'] }}
    inst.repo={{ b4_netinstall_os_mounted_repo_url }}/
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0
    rd.net.timeout.carrier=10
    ksdevice={{ b4_render_ifname }}
    inst.ks.sendmac
    inst.sshd

b4_render_menu_amanda: >-
    root=live:{{ b4_render_ksroot }}
    inst.install_url={{ b4_netinstall_os_mounted_repo_url }}/install/
    inst.auto={{ b4_node_os_manifesto['url'] }}
    console=tty0
    inst.unattended=1
    int.ay_check=0
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0
    rd.net.timeout.carrier=10
    copy_network=1

b4_render_menu_ignition: >-
    coreos.live.rootfs_url={{ b4_render_ksroot }}
    coreos.inst.install_dev={{ b4_render_disk }}
    coreos.inst.image_url={{ b4_render_ksroot }}
    coreos.inst.ignition_url={{ b4_node_os_manifesto['url'] }}
    coreos.inst.force_wipe=1
    coreos.inst=yes
    coreos.inst.reboot=true
    ignition.firstboot
    ignition.platform.id=metal
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.timeout.carrier=10
    BOOTIF=01-{{ b4_render_mac }}

b4_render_menu_microos: >-
    root=live:{{ b4_render_ksroot }}
    combustion.url={{ b4_node_os_manifesto['url'] }}
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0

b4_render_menu_ubcore: >-
    root=live:{{ b4_render_ksroot }}
    combustion.url={{ b4_node_os_manifesto['url'] }}
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0

# ==============================================================================
# FAMILY 2: CASPER ENVIRONMENT AND DEBIAN-INSTALLER (d-i) ARCHITECTURE
# TARGET SYSTEMS: Ubuntu Server (Subiquity/Casper), Debian (Preseed/Netcfg), VMware (ESXi).
#
# OPENSTACK IRONIC CONSTRAINT NOTICE:
# The Ironic API validator strictly aborts deployments upon detecting slashes (/), 
#  or URL encodings (%2f) within certain fields. To bypass this, downstream 
# d-i variables must leverage native hyphen substitution (e.g., netcfg- instead of netcfg/).
#
# STAGE I: INITRAMFS EARLY KERNEL SPACE (Executed strictly BEFORE the '---' delimiter)
# These parameters manipulate the hardware ring, kernel driver modules, and initial RAM interface.
# ------------------------------------------------------------------------------
# 1. ip=<client-ip>::<gw>:<netmask>:<hostname>::off (Debian/Ubuntu Native):
#    Forces static allocation in early kernel space. The ':off' (or ':none' for Casper) suffix
#    is mandatory to kill immediate kernel-level DHCP/RARP auto-configuration hooks.
# 2. BOOTIF=01-<MAC-with-hyphens> & interface=auto:
#    The physical hardware anchor. 'interface=auto' forces the kernel to inspect the iPXE 
#    BOOTIF ARP-01 Ethernet header to bind network-boot tasks directly to the active provision link.
# 3. modules_to_load=<csv_list> / pci=realloc / panic=10:
#    Kernel execution space arguments to stabilize disk controller/HBA fabrics prior to root handoff.
# 4. boot=casper & netboot=url (Ubuntu Exclusive):
#    Instructs the Casper framework to spawn an ephemeral interface, fetch the root squashfs
#    ISO via HTTP, and overlay it directly in RAM before the secondary installer executes.
#
# STAGE II: INSTALLER USER-SPACE ENVIRONMENT (Executed strictly AFTER the '---' delimiter)
# Debian 'd-i' totally tears down and erases the Initramfs network map. When udev renames 
# the adapter (e.g., net0 -> ens18), the following d-i / debconf responses maintain automation:
# ------------------------------------------------------------------------------
# 5. url=<URL> (Verified & Accepted):
#    CONFIRMED BEHAVIOR: The short alias 'url=' is successfully ingested and parsed by the 
#    preseed deployment framework without triggering environmental execution blocks.
# 6. auto=true & priority=critical:
#    Silences interactive wizard prompts. Forces debconf to instantly accept automated seeds.
# 7. netcfg-disable_dhcp=true & netcfg-disable_autoconfig=true:
#    Neutralizes user-space DHCP/IPv6 discovery attempts triggered on the newly renamed ens18 link.
# 8. netcfg-get_ipaddress / netcfg-get_netmask / netcfg-get_gateway / netcfg-get_nameservers:
#    Re-injects and locks the static networking architecture directly inside the debian-installer.
# ==============================================================================
b4_render_menu_casper: >-
    boot=casper
    netboot=url
    url={{ b4_netinstall_os_iso_url }}
    cloud-config-url=/dev/null
    autoinstall
    ds={{ b4_render_casperds }}
    ip={{ b4_render_ip }}::none
    nameserver={{ b4_url_genesis_ip }}
    rootdelay=20
    boot_delay=1
    pci=realloc
    panic=10
    BOOTIF=01-{{ b4_render_mac }}
    modules_to_load={{ b4_render_modules_casper }}

#----
# Debian Installer do not take parameters,
#    TODO: syntax allowed by Ironic and iPXE, 
#            accepted by installer 
#----
b4_render_menu_preseed: >-
    ip={{ b4_render_ip }}::none:::{{ b4_enroll_nic_provision_mac }} 
    BOOTIF=01-{{ b4_render_mac }}
    biosdevname=0
    pci=realloc
    panic=10
    modules_to_load={{ b4_render_modules_preseed }}
    interface=auto    
    nameserver={{ b4_url_genesis_ip }}    
    url={{ b4_node_os_manifesto['url'] }}
    ---
    auto=true
    priority=critical
    netcfg-disable_dhcp=true
    netcfg-disable_autoconfig=true
    netcfg-confirm_static=true
    netcfg-get_ipaddress={{ b4_enroll_nic_provision_ip }}
    netcfg-get_netmask={{ b4_enroll_nic_provision_netmask }}
    netcfg-get_gateway={{ b4_url_genesis_ip }}
    netcfg-get_nameservers={{ b4_url_genesis_ip }}
    netcfg-choose_interface={{ b4_enroll_nic_provision_mac }}

b4_render_menu_esxi: >-
    ks={{ b4_node_os_manifesto['url'] }}
    netdevice={{ b4_enroll_nic_provision_mac }}
    ip={{ b4_enroll_nic_provision_ip }}
    netmask={{ b4_enroll_nic_provision_netmask }}
    gateway={{ b4_enroll_nic_provision_gateway}}
    nameserver={{ b4_url_genesis_ip }}

b4_render_menu_autoyast: >-
    install={{ b4_netinstall_os_mounted_repo_url }}
    autoyast={{ b4_node_os_manifesto['url'] }}autoinst.xml
    ifcfg={{ b4_enroll_nic_provision_mac }}
    hostip={{ b4_enroll_nic_provision_ip }}
    netmask={{ b4_enroll_nic_provision_netmask }}
    gateway={{ b4_enroll_nic_provision_gateway }}
    nameserver={{ b4_url_genesis_ip }}
    netwait=10
    confirm=0

# 2.3- Installars Particulars
#.....................................
b4_os_installer_bootloader_call:
  anaconda:
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_anaconda }}"

  casper:
