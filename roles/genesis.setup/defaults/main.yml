# 0,. Post Install Scripts
#-------------------------
# 1.- El Diccionario Maestro de Excepciones por Proveedor
b4_os_post_install_bash_lines:
  ubuntu:
    root_lock: 'usermod -p "!" root'
    user_add: 'useradd -m -u 1001 -s /bin/bash {{ b4_provision_user_name }}'
    user_lock: 'usermod -p "!" {{ b4_provision_user_name }}'
    ssh_chown: 'chown -R {{ b4_provision_user_name }}:{{ b4_provision_user_name }} /home/{{ b4_provision_user_name }}/.ssh'
    extra_cmd: 'echo "==> Ubuntu configuration completed."'

  redhat:
    root_lock: 'usermod -p "*" root'
    user_add: 'useradd -m -u 1001 -s /bin/bash {{ b4_provision_user_name }}'
    user_lock: 'usermod -p "*" {{ b4_provision_user_name }}'
    ssh_chown: 'chown -R {{ b4_provision_user_name }}:{{ b4_provision_user_name }} /home/{{ b4_provision_user_name }}/.ssh'
    extra_cmd: 'echo "==> RedHat configuration completed."'

  suse:
    root_lock: 'usermod -p "!" root'
    user_add: 'useradd -m -u 1001 -g users -s /bin/bash {{ b4_provision_user_name }}'
    user_lock: 'usermod -p "!" {{ b4_provision_user_name }}'
    ssh_chown: 'chown -R {{ b4_provision_user_name }}:users /home/{{ b4_provision_user_name }}/.ssh'
    extra_cmd: 'systemctl enable sshd.service || true'

# 2.- El Script Core Maestro Unificado
b4_node_os_allow_passwords:     "{{ (deploy.login_password | default(true)  | bool) | ternary ('yes','no') }}"
b4_node_os_allow_root_password: "{{ (deploy.root_password  | default(false) | bool) | ternary ('yes','no') }}"
b4_os_postinstall_script: |
    #!/bin/bash
    set -e
    
    # =======================================================================
    # A. HARDEN ROOT ACCOUNT (Disable direct external access)
    # =======================================================================
    {{ b4_os_post_install_bash_lines[b4_node_os | trim].root_lock }}
    
    # =======================================================================
    # B. PROVISION AUTOMATION USER WITH SYNCHRONIZED INDUSTRIAL IDs
    # =======================================================================
    if ! id -u {{ b4_provision_user_name }} >/dev/null 2>&1; then
      {{ b4_os_post_install_bash_lines[b4_node_os | trim].user_add }}
    fi
    
    # Lock standard cleartext password entry mechanisms
    {{ b4_os_post_install_bash_lines[b4_node_os | trim].user_lock }}  
    
    # Grant privileged sudo rights without operational password prompts
    echo '{{ b4_provision_user_name }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{ b4_provision_user_name }}
    chmod 440 /etc/sudoers.d/{{ b4_provision_user_name }}
    
    # =======================================================================
    # C. INJECT ANSIBLE CORE PUBLIC KEY INTO IMMUTABLE STORAGE TARGET
    # =======================================================================
    mkdir -p /home/{{ b4_provision_user_name }}/.ssh
    echo "{{ b4_provision_user_ssh_key }}" > /home/{{ b4_provision_user_name }}/.ssh/authorized_keys
    
    # Enforce standard OpenSSH authorization security permissions matrix
    {{ b4_os_post_install_bash_lines[b4_node_os | trim].ssh_chown }} 
    chmod 700 /home/{{ b4_provision_user_name }}/.ssh
    chmod 600 /home/{{ b4_provision_user_name }}/.ssh/authorized_keys
    
    # Hide the provisioning service account from greeting managers
    mkdir -p /var/lib/AccountsService/users/
    echo -e "[User]\nSystemAccount=true" > /var/lib/AccountsService/users/{{ b4_provision_user_name }}
    
    # =======================================================================
    # D. REWRITE ACTIVE SECURE DAEMON POLICIES (sshd_config)
    # =======================================================================
    # Sanitize native password authentication entries and enforce root restrictions
    sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication {{ b4_node_os_allow_passwords }}/g' /etc/ssh/sshd_config
    sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin {{ b4_node_os_allow_root_password }}/g' /etc/ssh/sshd_config
           
    # Purge vendor drop-in overrides to guarantee strict configuration dominance
    rm -f /etc/ssh/sshd_config.d/*.conf
    
    # Execute vendor-specific services overrides (e.g. systemctl enablement for SUSE)
    {{ b4_os_post_install_bash_lines[b4_node_os | trim].extra_cmd }}

#------------------------------------
# 1.- Kickstart
#------------------------------------
# 1.1.- Storage Snippet according BIOS/UEFI
b4_kickstart_storage_chassis_type: 
  uefi: |
    bootloader
    part /boot/efi --fstype=efi --size=600
    part /boot --fstype=xfs --size=1024
  bios: |
    bootloader --location=mbr
    part /boot --fstype=ext4 --size=1024
b4_enroll_node_chassis_type: "{{ ('uefi' in (b4_enroll_node_chassis_capabilities.boot_mode | default('uefi') | string | lower)) | ternary('uefi', 'bios') }}"
b4_kickstart_storage_snippet: "{{ b4_kickstart_storage_chassis_type[b4_enroll_node_chassis_type] | default(b4_kickstart_storage_chassis_type['uefi']) }}"

# 1.2.- Default RHEL derivatives Kickstart
b4_kickstart_template_defaults:
  preinstall: |
    # Use Netinstall installation media
    url --url {{ b4_netinstall_os_mounted_repo_url }}/

  repos: |
    {% if b4_os_version | default(9) | int >= 8 %}
    repo --name="BaseOS" --baseurl="{{ b4_netinstall_os_mounted_repo_url }}/BaseOS/" --install 
    repo --name="AppStream" --baseurl="{{ b4_netinstall_os_mounted_repo_url }}/AppStream/" --install
    {% endif %}
  
  system: |       
    # System Language
    lang {{ b4_node_os_locale_info.lang | default('en_US.UTF-8') }}
           
    # System keyboard
    keyboard {{ b4_node_os_locale_info.keyboard | default('us') }}
           
    # Firewall configuration
    firewall --disabled
    
    # SELinux configuration
    selinux --disabled
          
    # System timezone
    timezone {{ b4_node_os_locale_info.timezone | default('America/New_York') }}
    
    # Use text mode install
    text
    
    # Reboot after installation
    reboot	
 
  auth: |
    authselect --useshadow --passalgo=sha512

  packages: |
    @core
    tar
    bzip2
 
  user: |
    rootpw --iscrypted {{ b4_root_user_password }}
    user --name={{ b4_provision_user_name }} --groups={{ b4_provision_user_groups }} --password={{ b4_provision_user_password }} --iscrypted
    sshkey --username={{ b4_provision_user_name }} "{{ b4_provision_user_ssh_key }}"

  network: |
    network --bootproto=static --ip={{ b4_enroll_nic_provision_ip }} --netmask={{ b4_enroll_nic_provision_netmask }} --gateway={{ b4_url_genesis_ip }} --onboot=on --hostname={{ b4_enroll_node_name }} --device={{ b4_enroll_nic_provision_mac }}

  storage: |	
    {% set b4_disk = b4_enroll_node_chassis_properties.root_device | default('sda') %}
    {% if '__omit_place_holder__' in b4_disk or b4_disk == "" %}{% set b4_disk = 'sda' %}{% endif %}
    
    {% set total_mb = (b4_enroll_node_chassis_properties.local_gb | default(32) | int * 1024) %}
    {% set fixed_mb = 19456 %}
    {% set pv_size = total_mb - fixed_mb - 512 %}
    {% set swap_size = (b4_enroll_node_chassis_properties.memory_mb | default(4096) | int / 2) | int %}
      
    # Partitions Configuration (100% Dynamic calculated from chassis properties)
    zerombr
    clearpart --all --initlabel
    
    # 1. First: Fixed size standard partitions (Total: ~19 GB / 19456 MB)
    {{ b4_kickstart_storage_snippet }} 
    part /         --fstype=ext4 --size=17408 
    
    # 2. Second: Physical Volume utilizing the calculated remaining space of the disk
    part pv.{{ b4_enroll_node_name }}-0001 --size={{ pv_size if pv_size > 1024 else 2048 }} --grow
    
    # 3. Third: Logical Volumes inside the Volume Group
    volgroup VolGroup00 --pesize=4096 pv.{{ b4_enroll_node_name }}-0001
    logvol /home --fstype=ext4 --name=LogVol03    --vgname=VolGroup00 --size=4096 --grow
    logvol swap                --name=lv_LogVol00 --vgname=VolGroup00 --size={{ swap_size if swap_size > 2048 else 2048 }}

  postinstall: "{{ b4_os_postinstall_script }}" 

# 1.3.- Changes over Default Template according OS release
b4_kickstart_template_os_profiles:
  "7": 
    auth: "auth --enableshadow --passalgo=sha512"
    logging: "logging --level=info"   
    packages: |
      @base
      @core
    repos: ''
    postinstall: |
      echo "==> Enforcing persistent production repositories layout for legacy target..."
      
      # Purge default vendor repository profiles to avoid timeout conflicts
      rm -f /etc/yum.repos.d/*.repo
      
      # Write clean, local-only repository target directly into the root filesystem
      cat << 'EOF' > /etc/yum.repos.d/genesis-internal.repo
      [genesis-legacy-base]
      name=Genesis System Legacy Base OS Repository - Local Mirror
      baseurl={{ b4_netinstall_os_mounted_repo_url }}/
      enabled=1
      gpgcheck=0
      EOF
          
      echo "==> Legacy repository profile injected successfully."

#------------------------------------
# 2.- Casper Automated Autoinstall (Ubuntu Server Modern Blueprint)
#------------------------------------
b4_casper_gateway_definition: >-
   {% if b4_node_os_version is defined and (b4_node_os_version | float) >= 22.04 -%}
   routes:
     - to: default
       via: {{ b4_url_genesis_ip }}
   {%- else -%}
   gateway4: {{ b4_url_genesis_ip }}
   {%- endif %}

b4_casper_template_defaults:   
  system: |
    version: 1
    locale: {{ b4_node_os_locale_info.lang | default('en_US.UTF-8') }}
    keyboard:
      layout: {{ b4_node_os_locale_info.keyboard | default('us') }}
    refresh-installer:
      update: false
  identity: |
    hostname: {{ b4_enroll_node_name }}
    username: {{ b4_main_user_name }}
    password: "{{ b4_main_user_password }}"
  user: |
    users:
      - name: root
        passwd: "{{ b4_root_user_password }}"
        lock_passwd: false
        shell: /bin/bash
      - name: "{{ b4_main_user_name }}"
        uid: 1000
        passwd: "{{ b4_main_user_password }}"
        lock_passwd: false
        shell: /bin/bash
  ssh: |
    install-server: true
    allow-pw: true             
    password_auth: true        
    authorized-keys:
      - "{{ b4_provision_user_ssh_key }}"
  #logging: |
  #  log_serv: "*.* @@{{ b4_url_genesis_ip }}:{{ genesis_rsyslog_port | default('514') }}"     
  network: |
    version: 2
    ethernets:
      # Static deployment interface aliased globally as 'provision'
      provision:
        critical: true
        addresses:
          - {{ b4_enroll_nic_provision_ipv4 }}
        match:
          macaddress: "{{ b4_enroll_nic_provision_mac | default('') | lower }}"
        set-name: provision
        
        routes:
          - to: default
            via: {{ b4_url_genesis_ip }}
        
        nameservers:
          addresses:
            - {{ b4_url_genesis_ip }}

  repos: |
    geoip: no
    preserve_sources_list: false
    sources_list: |
      deb [trusted=yes] {{ b4_netinstall_os_mounted_repo_url }} {{ b4_node_os_alias }} main restricted

  storage: |
    layout:
      name: lvm
      match: {}   
  postinstall: |
    - |
      cat << 'EOF' > /target/tmp/setup-users.sh
      {{ b4_os_postinstall_script }}
      EOF
    - curtin in-target -- bash /tmp/setup-users.sh
    - rm -f /target/tmp/setup-users.sh

#------------------------------------
# 3.- AutoYast
#------------------------------------
b4_autoyast_provision_user_groups: >-
   {% if b4_provision_user_groups is defined and b4_provision_user_groups %}
   <groups config:type="list">
     {% for group in b4_provision_user_groups.split(',') %}
     <group>{{ group | trim }}</group>
     {% endfor %}
   </groups>
   {% endif %}
b4_autoyast_template_defaults:
  system: |
    <system_settings>
       <timezone>
         <hwclock>UTC</hwclock>
         <timezone>{{ b4_node_os_locale_info.timezone | default('America/New_York') }}</timezone>
       </timezone>
    </system_settings>
    <language>
      <language>{{ (b4_node_os_locale_info.lang | default('en_US.UTF-8')).split('.') | first }}</language>
    </language>
    <keyboard>
       <keymap>{{ b4_node_os_locale_info.keyboard | default('us') }}</keymap>
    </keyboard>

  software: |
    <products config:type="list">
      <product>{{ b4_node_os_alias }}</product>
    </products>
    <repositories config:type="list">
      <repository>
        <name>Local-Base-Repo</name>
        <alias>local_base_repo</alias>
        <media_url>{{ b4_netinstall_os_mounted_repo_url }}/install/</media_url>
        <base_url config:type="boolean">true</base_url>
      </repository>
    </repositories>

  user: |
    <user>
      <username>root</username>
      <user_password>{{ b4_root_user_password }}</user_password>
      <encrypted config:type="boolean">true</encrypted>
    </user>
    <user>
      <username>{{ b4_main_user_name }}</username>
      <fullname>{{ b4_main_user_name | title }}</fullname>
      <user_password>{{ b4_main_user_password }}</user_password>
      <encrypted config:type="boolean">true</encrypted>
      <shell>/bin/bash</shell>
    </user>
    <user>
      <username>{{ b4_provision_user_name }}</username>
      <fullname>{{ b4_provision_user_name | title }}</fullname>
      <user_password>{{ b4_provision_user_password }}</user_password>
      <encrypted config:type="boolean">true</encrypted>
      <shell>/bin/bash</shell>
      {{ b4_autoyast_provision_user_groups | default('') }}
    </user>

  ssh: |
    <default_target>multi-user</default_target>
    <services>
      <enable config:type="list">
        <service>sshd</service> 
      </enable>
    </services>

  network: |
    <dhcp_all config:type="boolean">false</dhcp_all>   
    <dns>
      <hostname>{{ b4_enroll_node_name }}</hostname>
    </dns>
    <interfaces config:type="list">
      <interface>
        <method>manual</method> 
        <ipaddr>{{ b4_enroll_nic_provision_ip }}</ipaddr>
        <netmask>{{ b4_enroll_nic_provision_netmask }}</netmask>
        <gateway>{{ b4_url_genesis_ip }}</gateway>
        <mac>{{ b4_enroll_nic_provision_mac }}</mac>
      </interface>
    </interfaces>

  postinstall: |
    <chroot-scripts config:type="list">
      <script>
        <filename>genesis_setup_users.sh</filename>
        <chrooted config:type="boolean">true</chrooted>
        <interpreter_path>/bin/bash</interpreter_path>
        <source><![CDATA[
    {{ b4_os_postinstall_script }}
        ]]></source>
      </script>
    </chroot-scripts>

