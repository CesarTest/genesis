#------------------------------------
# 4.- Preseed Manifesto
#------------------------------------
b4_preseed_template_defaults:
  preinstall: |
    # Prevent DHCP loops and initialize manual network setup immediately
    d-i netcfg/disable_autoconfig boolean true
    d-i netcfg/use_dhcp boolean false
    d-i netcfg/disable_dhcp boolean true
    d-i netcfg/dhcp_options select Configure network manually
    d-i netcfg/confirm_static boolean true

  system: |       
    # System localization configuration
    d-i debian-installer/locale string {{ b4_node_os_locale_info.lang | default('en_US.UTF-8') }}
    d-i keyboard-configuration/xkb-keymap select {{ b4_node_os_locale_info.keyboard | default('us') | lower }}
    d-i debian-installer/language string {{ (b4_node_os_locale_info.lang | default('en_GB.UTF-8')).split('_') | first | lower }}
    d-i debian-installer/country string {{ b4_node_os_locale_info.keyboard | default('us') | upper }}
    d-i localechooser/supported-locales multiselect {{ b4_node_os_locale_info.lang | default('en_US.UTF-8') }}
    d-i pkgsel/ignore-incomplete-language-support boolean true
           
    # System timezone setup
    d-i time/zone string {{ b4_node_os_locale_info.timezone | default('America/New_York') }}
    d-i clock-setup/utc boolean true
    d-i clock-setup/ntp boolean true

  user: |
    # Root account configuration with encrypted password
    d-i passwd/root-login boolean true
    d-i passwd/root-password-crypted password {{ b4_root_user_password }}
    
    # Primary user account creation
    d-i passwd/make-user boolean true
    d-i passwd/user-fullname string {{ b4_provision_user_name }}
    d-i passwd/username string {{ b4_provision_user_name }}
    d-i passwd/user-password-crypted password {{ b4_provision_user_password }}

  repos: |
    # Main mirror repository configuration (Parsed Netinstall URL)
    d-i mirror/country string manual
    d-i mirror/protocol string http
    d-i mirror/http/hostname string {{ b4_url_genesis_url }}
    d-i mirror/http/directory string {{ b4_render_presubpath }}
    d-i mirror/http/proxy string
    d-i debian-installer/allow_unauthenticated boolean true
    d-i mirror/http/valid_mirror boolean true

  packages: |
    # Base packages and software selection
    d-i tasksel/first multiselect standard
    d-i pkgsel/include string tar bzip2

  network: |
    # Static network parameters and Hostname assignment
    d-i netcfg/get_ipaddress string {{ b4_enroll_nic_provision_ip }}
    d-i netcfg/get_netmask string {{ b4_enroll_nic_provision_netmask }}
    d-i netcfg/get_gateway string {{ b4_url_genesis_ip }}
    d-i netcfg/get_nameservers string {{ b4_url_genesis_ip }}
    d-i netcfg/get_hostname string {{ b4_enroll_node_name }}

  storage: |	
    {% set b4_disk = b4_enroll_node_chassis_properties.root_device | default('sda') %}
    {% if '__omit_place_holder__' in b4_disk or b4_disk == "" %}{% set b4_disk = 'sda' %}{% endif %}
    
    # Clear previous disk layouts and partition tables
    d-i partman-lvm/device_remove_lvm boolean true
    d-i partman-md/device_remove_md boolean true
    d-i partman-partitioning/confirm_write_new_label boolean true
        
    # Target disk assignment and LVM initialization
    d-i partman-auto/disk string /dev/{{ b4_disk }}
    d-i partman-auto/method string lvm
    d-i partman-auto-lvm/guided_size string max
       
    # Select standard atomic LVM recipe (Single root layout)
    d-i partman-auto/choose_recipe select atomic
       
    # Automatic format confirmations for zero-interaction provisioning
    d-i partman-lvm/confirm boolean true
    d-i partman-lvm/confirm_nooverwrite boolean true
    d-i partman/confirm_nochanges boolean true
    d-i partman/confirm boolean true
    d-i partman/confirm_nooverwrite boolean true
    d-i partman/choose_partition select finish
 
  postinstall: |
    # GRUB bootloader installation on target disk
    d-i grub-installer/only_debian boolean true
    d-i grub-installer/with_other_os boolean true
    d-i grub-installer/bootdev string default
    
    # Inject and execute Genesis core post-installation bash scripts via strict literal heredoc
    d-i preseed/late_command string \
        cat << 'EOF' > /target/tmp/postinstall.sh; \
        #!/bin/bash \
        # ============================================================================== \
        # START OF GENESIS CORE INJECTED SCRIPTS \
        # ============================================================================== \
        {{ b4_os_postinstall_script_render | indent(4,false) }}
        \
        # ------------------------------------------------------------------------------ \
        # NETWORK CONFIGURATION BLOCK \
        # ------------------------------------------------------------------------------ \
        {{ b4_os_postinstall_networkmanager_script_render  | indent(4,false) }}
        \
        # ------------------------------------------------------------------------------ \
        # APT REPOSITORIES CONFIGURATION BLOCK \
        # ------------------------------------------------------------------------------ \
        {{ b4_os_postinstall_apt_script_render | indent(4,false) }}
        # ============================================================================== \
        # END OF GENESIS CORE INJECTED SCRIPTS \
        # ============================================================================== \
        EOF; \
        chmod +x /target/tmp/postinstall.sh; \
        in-target /tmp/postinstall.sh
        
    # Signal completion and trigger automatic reboot
    d-i finish-install/reboot_in_progress note


#------------------------------------
# 4.- Ignition Manifesto
#------------------------------------
b4_ignition_template_defaults: 
  user: |
    "users": [
      {
        "name": "core",
        "sshAuthorizedKeys": [
          "{{ b4_provision_user_ssh_key }}"
        ]
      },
      {
        "name": "{{ b4_provision_user_name }}",
        "groups": [
          {{ b4_provision_user_groups | to_json }}
        ],
