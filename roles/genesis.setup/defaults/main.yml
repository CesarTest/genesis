---
# genesis.setup defaults
#   - Stage 1 - Enroll the Node - Outband BMC
#   - Stage 2 - Manage the Node - Inband Provision 
#     - Result: Instance Configure, Ready to Deploy
#  
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

######################################################
#  GENESIS PATHS (global for update all genesis roles at once)
######################################################
# 1.- Repos Paths
genesis_repo_path:     "{{ role_path | dirname | dirname | realpath }}/repo"
genesis_local_repo_url: "file://{{ genesis_repo_path | realpath }}"
genesis_rsyslog_port: "5456"
file_url_port_tls: "8083"

# 2.- Bifrost Role Paths
genesis_bifrost_role_name: "genesis.bifrost"
genesis_bifrost_path:  "{{ role_path | dirname }}/{{ genesis_bifrost_role_name }}"
genesis_bifrost_roles: "{{ genesis_bifrost_path | realpath }}/{{ genesis_bifrost_role_name }}/playbooks/roles"
genesis_bifrost_files_path: "{{ genesis_bifrost_path | realpath }}/files"
genesis_bifrost_venv_dir: "{{ lookup('env', 'VENV') or '/opt/stack/bifrost' }}"

# 3.- Repositories
genesis_http_path: "{{ ironic_http_path | default('/var/lib/ironic/httpboot') | realpath }}"
genesis_default_repos:
  os: "os"
  manifesto: "manifesto" 
  components: "openstack"
  cloud: "dib"
  ipa: "dib/files" 
  repo: "mnt"

# 4.- OS Definitions
genesis_os_definitions:

  redhat: &redhat_keys
    ansible_distribution: "RedHat"
    installer: "anaconda"
    prefix: "ks_"
    ext: ".ks" 

  centos: *redhat_keys
  rocky: *redhat_keys
  rhel: *redhat_keys
  fedora: *redhat_keys

  esxi:
    ansible_distribution: "VMwareESXi" 
    installer: "esxi"
    prefix: "ks_"
    ext: ".ks"     

  ubuntu:
    ansible_distribution: "Ubuntu"
    installer: "casper"
    alias:
      "26.04": "resolute"    
      "25.04": "plucky"      
      "24.10": "oracular"    
      "24.04": "noble"      
      "22.04": "jammy"      
      "20.04": "focal"      

  debian:
    ansible_distribution: "Debian"
    installer: "preseed"
    ext: ".cfg"
    ramdisk: "debian-installer/amd64/initrd.gz"
    kernel: "debian-installer/amd64/linux"
    alias:
      "13": &debian_13 "trixie"
      "12": &debian_12 "bookworm"
      "11": &debian_11 "bullseye"
      "13.0": *debian_13
      "13.1": *debian_13
      "13.2": *debian_13
      "13.3": *debian_13
      "13.4": *debian_13
      "13.5": *debian_13
      "13.6": *debian_13
      "12.0": *debian_12
      "12.1": *debian_12
      "12.2": *debian_12
      "12.3": *debian_12
      "12.4": *debian_12
      "12.5": *debian_12
      "12.6": *debian_12
      "12.7": *debian_12
      "12.8": *debian_12
      "12.9": *debian_12
      "11.0": *debian_11
      "11.1": *debian_11
      "11.5": *debian_11

  suse:
    ansible_distribution: "openSUSE"
    installer: "amanda"
    ext: ".xml"
    prefix: "autoyast_"
    alias:
      "16": &suse_16 "openSUSE_Leap"      
      "15": &suse_15 "openSUSE"          
      "12": &suse_12 "SLES"      
      "15.0": *suse_15
      "15.1": *suse_15
      "15.2": *suse_15
      "15.3": *suse_15
      "15.4": *suse_15
      "15.5": *suse_15
      "15.6": *suse_15
      "12.0": *suse_12
      "16.0": *suse_16

  sles:
    ansible_distribution: "SLES"    
    installer: "amanda"
    ext: ".xml"
    prefix: "autoyast_"
    alias:
      "16": &sles_16 "SLES"          
      "15": &sles_15 "SUSE_SLE"
      "12": &sles_12 "SLES"
      "15.0": *sles_15
      "15.1": *sles_15
      "15.2": *sles_15
      "15.3": *sles_15
      "15.4": *sles_15
      "15.5": *sles_15
      "15.6": *sles_15
      "12.0": *sles_12
      "12.1": *sles_12
      "12.2": *sles_12
      "12.3": *sles_12
      "12.4": *sles_12
      "12.5": *sles_12
      "16.0": *sles_16
 
  coreos:
    ansible_distribution: "Fedora CoreOS"
    installer: "ignition"
    ramdisk: "initramfs"
    prefix: "ignition_"
    ext: ".ign"
 
  microos:
    ansible_distribution: "openSuSE MicroOS"
    installer: "uos"
    prefix: "uos_"
    ext: ".xml"
 
  ubcore:
    ansible_distribution: "Ubuntu Core"
    installer: "ubcore"
    prefix: "ubcore_"
    ext: ".xml"

# 4.- OS Locale Definitions
genesis_locale_matrix:
  us:
    keyboard: "us"                   # El estándar internacional de sistemas
    lang: "en_US.UTF-8"
    timezone: "America/New_York"

  es:
    keyboard: "es"
    lang: "es_ES.UTF-8"
    timezone: "Europe/Madrid"
  
  fr:
    keyboard: "fr"                   # Teclado AZERTY francés nativo
    lang: "fr_FR.UTF-8"
    timezone: "Europe/Paris"
  
  de:
    keyboard: "de"                   # Teclado QWERTZ alemán nativo
    lang: "de_DE.UTF-8"
    timezone: "Europe/Berlin"
  
  it:
    keyboard: "it"
    lang: "it_IT.UTF-8"
    timezone: "Europe/Rome"
  
  pt:
    keyboard: "pt"
    lang: "pt_PT.UTF-8"
    timezone: "Europe/Lisbon"
  
  nl:
    keyboard: "nl"                   # Países Bajos
    lang: "nl_NL.UTF-8"
    timezone: "Europe/Amsterdam"
  
  be:
    keyboard: "be"                   # Bélgica (Generalmente AZERTY belga)
    lang: "fr_BE.UTF-8"
    timezone: "Europe/Brussels"
  
  ch:
    keyboard: "sg"                   # Suiza (Teclado Swiss-German/Swiss-French)
    lang: "de_CH.UTF-8"
    timezone: "Europe/Zurich"
  
  uk:
    keyboard: "gb"                   # Reino Unido
    lang: "en_GB.UTF-8"
    timezone: "Europe/London"

  ie:
    keyboard: "uk"                   # Irlanda (Comparte distribución de teclado con UK)
    lang: "en_IE.UTF-8"
    timezone: "Europe/Dublin"

  pl:
    keyboard: "pl"                   # Polonia
    lang: "pl_PL.UTF-8"
    timezone: "Europe/Warsaw"

  # Sabor nórdico (Crucial para infraestructura cloud y laboratorios europeos)
  se:
    keyboard: "se"                   # Suecia
    lang: "sv_SE.UTF-8"
    timezone: "Europe/Stockholm"

  no:
    keyboard: "no"                   # Noruega
    lang: "nb_NO.UTF-8"
    timezone: "Europe/Oslo"

  dk:
    keyboard: "dk"                   # Dinamarca
    lang: "da_DK.UTF-8"
    timezone: "Europe/Copenhagen"

  fi:
    keyboard: "fi"                   # Finlandia
    lang: "fi_FI.UTF-8"
    timezone: "Europe/Helsinki"

######################################################
# B4 - PATHS
######################################################
# 1.- Paths
b4_repos: "{{ genesis_airgap_repos | default(genesis_default_repos) }}" 
b4_os_images_subpath: "{{ b4_repos['os'] | default('os') }}"
b4_os_mounted_repo_subpath: "{{ b4_repos['repo'] | default('mnt') }}"
b4_os_manifesto_subpath: "{{ b4_repos['manifesto'] | default('manifesto') }}"
b4_repo_os_path: "{{ genesis_repo_path | realpath }}/{{ b4_os_images_subpath }}"
b4_repo_manifesto_path: "{{ genesis_repo_path | realpath }}/{{ b4_os_manifesto_subpath }}"
b4_http_manifesto_path: "{{ genesis_http_path | realpath }}/{{ b4_os_manifesto_subpath }}"

######################################################
#  BIFROST ROLES DEFINITION 
######################################################
b4_configdrive_roles:
   - name: "bifrost-configdrives-dynamic"
 
b4_delete_roles:
   - name: "ironic-delete-dynamic"
   
b4_enroll_roles:
   - name: "ironic-enroll-dynamic"
   - name: "ironic-inspect-node"
     condition: "{{ inspect_nodes | default('false') | bool }}" 
 
b4_manage_roles: []
 
######################################################
# ENROLL PARTICULARS
######################################################

#------------------
# 0.- Genesis Node Nics Details
#------------------
b4_url_genesis_ipv4:    "{{ hostvars[groups['target'][0]]['dhcp_address'] | default('127.0.0.1/24') }}"
b4_url_genesis_ip:      "{{ b4_url_genesis_ipv4 | ansible.utils.ipaddr('address') }}"
b4_url_genesis_gateway: "{{ b4_url_genesis_ipv4 | ansible.utils.ipaddr('last_usable') }}"
b4_url_genesis_netmask: "{{ b4_url_genesis_ipv4 | ansible.utils.ipaddr('netmask') }}"
b4_genesis_port:
  http:  "{{ genesis_http_port  | default(file_url_port)     | default('8080') }}"
  https: "{{ genesis_https_port | default(file_url_port_tls) | default('8083') }}" 
  oci:   "{{ genesis_https_oci  | default(registry_port)     | default('5500') }}"
  ironic: "{{ genesis_ironic_port  | default(ironic_api_port)     | default('6385') }}"

#------------------
# 1.- Nics Details, extract BMC and Provision NICs
#------------------
# 1.1.- Capture Nics Data
b4_enroll_nics:      "{{ enroll['nics'] | default({}) }}"
b4_enroll_node_inband_nics:  "{{ b4_enroll_nics['inband']  | default([]) }}"
b4_enroll_node_outband_nics: "{{ b4_enroll_nics['outband'] | default([]) }}" 
b4_enroll_nics_list: "{{ b4_enroll_node_inband_nics + b4_enroll_node_outband_nics }}"

# ---- Filter according to flag - provision: yes/true
b4_enroll_default_provision: "{{ b4_enroll_nics_list | selectattr('provision', 'defined') | selectattr('provision', 'equalto', true) | list }}"

# ---- NIC selection from list (BMC y Provisión)
b4_enroll_nic_bmc:   "{{ b4_enroll_node_outband_nics[0] | default(b4_enroll_default_provision[0] | default({})) }}"
b4_enroll_nic_provision: "{{ b4_enroll_default_provision[0] | default(b4_enroll_node_inband_nics[0] | default(b4_enroll_nic_bmc | default(b4_enroll_nics_list[0] | default({})))) }}"

# 1.2.- BMC NIC Particulars
b4_enroll_nic_bmc_mac:     "{{ b4_enroll_nic_bmc['mac'] | default('') | lower }}"
b4_enroll_nic_bmc_ipv4:    "{{ b4_enroll_nic_bmc['ipv4'] | default('127.0.0.1/24')  }}"
b4_enroll_nic_bmc_ip:      "{{ b4_enroll_nic_bmc_ipv4  | ansible.utils.ipaddr('address') }}"
b4_enroll_nic_bmc_netmask: "{{ b4_enroll_nic_bmc_ipv4  | ansible.utils.ipaddr('netmask') }}"
b4_enroll_nic_bmc_prefix:  "{{ b4_enroll_nic_bmc_ipv4  | ansible.utils.ipaddr('prefix') }}"
b4_enroll_nic_bmc_default_gateway: "{{ b4_enroll_nic_provision_ipv4 | ansible.utils.ipaddr('last_usable') }}"
b4_enroll_nic_bmc_gateway: "{{ b4_enroll_nic_bmc['gateway'] | default(b4_enroll_nic_bmc_default_gateway) }}"

# 1.3.- Provision NIC Particulars
b4_enroll_nic_provision_mac:     "{{ b4_enroll_nic_provision['mac'] | default('') | lower }}"
b4_enroll_nic_provision_ipv4:    "{{ b4_enroll_nic_provision['ipv4'] | default('127.0.0.1/24')  }}"
b4_enroll_nic_provision_ip:      "{{ b4_enroll_nic_provision_ipv4  | ansible.utils.ipaddr('address') }}"
b4_enroll_nic_provision_netmask: "{{ b4_enroll_nic_provision_ipv4  | ansible.utils.ipaddr('netmask') }}"
b4_enroll_nic_provision_prefix:  "{{ b4_enroll_nic_provision_ipv4  | ansible.utils.ipaddr('prefix') }}"
b4_enroll_nic_provision_default_gateway: "{{ b4_url_genesis_ip | default(b4_enroll_nic_provision_ipv4 | ansible.utils.ipaddr('last_usable'), true) }}"
b4_enroll_nic_provision_gateway: "{{ b4_enroll_nic_provision['gateway'] | default(b4_enroll_nic_provision_default_gateway, true) }}"

# 1.4.- List of NICs for OpenStack Ansible Module
b4_enroll_node_nics_raw: 
  - mac: "{{ b4_enroll_nic_provision_mac | default(none) }}" 
  - mac: "{{ b4_enroll_nic_bmc_mac       | default(none) }}"
b4_enroll_node_nics: >-
  {{ b4_enroll_node_nics_raw 
     | rejectattr('mac', 'none') 
     | rejectattr('mac', 'undefined') 
     | default(omit) }}
 
#------------------
# 2.- Out-Of-Band BMC Details (node -> inventory -> defaults)
#------------------
b4_enroll_node_name: "{{ enroll.name | default(hostname) | default(inventory_hostname_short) | default(inventory_hostname) | default(ansible_hostname) | default('nohost') }}" 
b4_enroll_node_uuid: "{{ enroll.uuid | default('') }}" 
b4_enroll_node_bmc_driver: "{{ enroll.driver  | default('redfish') }}" 

#---------------------------------------------------------------------------
# 3.- Out-Of-Band BMC Credentials Factory (node -> inventory -> defaults)
#---------------------------------------------------------------------------
# 3.1. Capture BMC credentials
b4_enroll_node_bmc_credentials: "{{ enroll['bmc_credentials'] | default({}) }}"
b4_enroll_default_node_id:      "{{ enroll['node_id']         | default('') }}"

# 3.2. Defaults BMC credentials
b4_ilo_deploy_iso: "http://{{ b4_url_genesis_ip | default('127.0.0.1') }}:{{ b4_url_genesis_port['http'] | default(8080) }}/os/agent.iso"
b4_enroll_default_bmc_credentials:
  redfish:
    ipv4: "{{ b4_enroll_nic_bmc_ipv4 }}"
    username: "root"
    password: "calvin"
    verify_ca: false 
  idrac:
    ipv4: "{{ b4_enroll_nic_bmc_ipv4 }}" 
    username: "root"
    password: "calvin"
    verify_ca: false 
    raid_config_backup: "none"
  ilo:
    ipv4: "{{ b4_enroll_nic_bmc_ipv4 }}"
    username: "root"
    password: "calvin"
    deploy_iso: "{{ b4_ilo_deploy_iso }}"
  ipmi:
    ipv4: "{{ b4_enroll_nic_bmc_ipv4 }}"  
    username: "root"
    password: "calvin" 
    priv_level: "ADMINISTRATOR"
    port: "623"
    cipher_suite: "17"

# 3.3. Inheritance => host_vars -> Inventory -> defaults -> empty
b4_node_bmc_credentials_all_drivers: "{{ b4_enroll_node_bmc_credentials | default(genesis_bmc_credentials, true) | default(b4_enroll_default_bmc_credentials, true) | default({}) }}"

# 3.4. Capture Node Driver Info
b4_node_bmc_credentials: "{{ b4_node_bmc_credentials_all_drivers[b4_enroll_node_bmc_driver] | default({}) }}" 
b4_enroll_bmc_node_driver_info: "{{ enroll['driver_info'] | default(b4_node_bmc_credentials) | default({}) }}"

#---------------------------------------------------------------------------
# 4.- Out-Of-Band BMC URLs Generation 
#---------------------------------------------------------------------------
b4_enroll_node_bmc_protocol: "{{ b4_enroll_bmc_node_driver_info['protocol'] | default('https') }}"
b4_enroll_node_bmc_ipv4_raw: "{{ b4_enroll_bmc_node_driver_info['ipv4']     | default(b4_enroll_nic_bmc_ip) | default('127.0.0.1') }}"
b4_enroll_node_bmc_ipv4: "{{ b4_enroll_node_bmc_ipv4_raw | ansible.utils.ipaddr('address') }}"
b4_enroll_node_bmc_port: "{{ b4_enroll_bmc_node_driver_info['port'] | default(none) }}"
b4_enroll_node_bmc_url: "{{ b4_enroll_node_bmc_protocol }}://{{ b4_enroll_node_bmc_ipv4 }}{{ (b4_enroll_node_bmc_port is not none and b4_enroll_node_bmc_port | string | length > 0) | ternary(':' ~ b4_enroll_node_bmc_port, '') }}"
b4_enroll_default_system_id: "/redfish/v1/Systems/{{ b4_enroll_default_node_id | default('') }}"

#------------------
# 5.- Out-Of-Band BMC driver Info
#------------------
b4_enroll_node_bmc_driver_info:
  redfish:
    redfish_address:   "{{ b4_enroll_node_bmc_url | default('http://127.0.0.1:8000') }}"
    redfish_username:  "{{ b4_enroll_bmc_node_driver_info['username']  | default('root') }}"
    redfish_password:  "{{ b4_enroll_bmc_node_driver_info['password']  | default('calvin') }}"
    redfish_verify_ca: "{{ b4_enroll_bmc_node_driver_info['verify_ca'] | default(true) }}"
    redfish_system_id: "{{ b4_enroll_bmc_node_driver_info['system_id'] | default(b4_enroll_default_system_id) | default('') }}"
  idrac:
    idrac_address:   "{{ b4_enroll_node_bmc_ipv4 | default(b4_enroll_nic_bmc_ip) | default('127.0.0.1') }}"
    idrac_username:  "{{ b4_enroll_bmc_node_driver_info['username']  | default('root') }}"
    idrac_password:  "{{ b4_enroll_bmc_node_driver_info['password']  | default('calvin') }}"
    idrac_verify_ca: "{{ b4_enroll_bmc_node_driver_info['verify_ca'] | default(false) }}"
    idrac_system_id: "{{ b4_enroll_bmc_node_driver_info['system_id'] | default('') }}"
    idrac_raid_config_backup: "{{ b4_enroll_node_drivo['raid_config_backup'] | default('none') }}"
  ilo:
    ilo_address:    "{{ b4_enroll_node_bmc_ipv4 | default(b4_enroll_nic_bmc_ip) | default('127.0.0.1') }}"
    ilo_username:   "{{ b4_enroll_bmc_node_driver_info['username']   | default('root') }}"
    ilo_password:   "{{ b4_enroll_bmc_node_driver_info['password']   | default('calvin') }}"
    ilo_deploy_iso: "{{ b4_enroll_bmc_node_driver_info['deploy_iso'] | default('') }}"
    ilo_system_id:  "{{ b4_enroll_bmc_node_driver_info['system_id']  | default('') }}"
  ipmi:
    ipmi_address:    "{{ b4_enroll_node_bmc_ipv4 | default(b4_enroll_nic_bmc_ip) | default('127.0.0.1') }}"
    ipmi_port:       "{{ b4_enroll_node_bmc_port | default('623') }}" 
    ipmi_username:   "{{ b4_enroll_bmc_node_driver_info['username']   | default('root') }}"
    ipmi_password:   "{{ b4_enroll_bmc_node_driver_info['password']   | default('calvin') }}"
    ipmi_priv_level: "{{ b4_enroll_bmc_node_driver_info['priv_level'] | default('ADMINISTRATOR') }}"
    ipmi_cipher_suite: "{{ b4_enroll_bmc_node_driver_info['cipher_suite'] | default('17') }}"

#------------------
# 7.- Properties 
#------------------
b4_enroll_node_chassis_properties_input: "{{ enroll['properties'] |  default({}) }}"
b4_enroll_node_chassis_capabilities_input: "{{ enroll['capabilities'] | default({}) }}"
b4_enroll_node_chassis_capabilities_string: "{{ (b4_enroll_node_chassis_capabilities_input | length > 0) | ternary(t1_enroll_node_chassis_capabilities_input.items() | map('join', ':') | join(',') | lower, '') }}"
b4_enroll_node_chassis_cpus: "{{ b4_enroll_node_chassis_properties_input['cpus']         | default('4') }}"
b4_enroll_node_chassis_cpu_arch: "{{ b4_enroll_node_chassis_properties_input['cpu_arch']     | default('x86_64') }}"
b4_enroll_node_chassis_memory_mb: "{{ b4_enroll_node_chassis_properties_input['memory_mb']    | default(b4_enroll_node_chassis_properties_input['ram'] ) | default('4096') }}"
b4_enroll_node_chassis_local_gb: "{{ b4_enroll_node_chassis_properties_input['local_gb']     | default('32')  }}"
b4_enroll_node_chassis_root_device: "{{ b4_enroll_node_chassis_properties_input['root_device']  | default('sda') }}"
b4_enroll_node_chassis_capabilities: "{{ b4_enroll_node_chassis_properties_input['capabilities'] | default(b4_enroll_node_chassis_capabilities_string)  }}"
b4_enroll_node_chassis_properties:
   cpus:         "{{ b4_enroll_node_chassis_cpus         }}"
   cpu_arch:     "{{ b4_enroll_node_chassis_cpu_arch     }}"
   memory_mb:    "{{ b4_enroll_node_chassis_memory_mb    }}"
   local_gb:     "{{ b4_enroll_node_chassis_local_gb     }}"
   root_device:  "{{ b4_enroll_node_chassis_root_device  }}"
   capabilities: "{{ b4_enroll_node_chassis_capabilities }}"

######################################################
# MANAGE STAGE PARTICULARS
######################################################

#------------------
# 0.- Bifrost Data Model Dump File
#------------------
b4_baremetal_fact_caching_connection: "{{ lookup('ansible.builtin.config', 'fact_caching_connection', plugin_type='cache', plugin_name='jsonfile', errors='ignore') }}"
b4_baremetal_setup_vars_path: "{{ b4_baremetal_fact_caching_connection | default('/tmp', boolean=True) }}"
b4_baremetal_vars_filename: "genesis_{{ inventory_hostname }}.json"
b4_baremetal_vars_file: "{{ b4_baremetal_setup_vars_path }}/{{ b4_baremetal_vars_filename }}"

#------------------
# 1.- Inband Provision URLs
#------------------
b4_url_protocol:      "http"
b4_url_short_subpath: "{{ b4_node_os | lower }}{{ b4_node_os_version | lower | replace('.', '') }}"
b4_url_full_subpath:  "{{ b4_node_os | lower }}/{{ b4_node_os_version | lower }}"
b4_url_genesis_port:  "{{ b4_genesis_port[b4_url_protocol] is defined | ternary (':','','') }}{{ b4_genesis_port[b4_url_protocol] | default('') }}"
b4_url_genesis_url:   "{{ genesis_address | default(b4_url_genesis_ip) }}{{ b4_url_genesis_port }}"
b4_url_ironic_port:   "{{ b4_genesis_port['ironic'] is defined | ternary (':','','') }}{{ b4_genesis_port['ironic'] | default('') }}"
b4_url_ironic_url:    "{{ genesis_address | default(b4_url_genesis_ip) }}{{ b4_url_ironic_port }}"

#------------------
# 2.- OS
#------------------
# 2.1.- Defaults
b4_node_default_os: "{{ genesis_node_default_os | default('CentOS') | lower }}"
b4_node_default_os_version: "{{ genesis_node_default_version | default('9') | lower }}"
b4_node_default_os_alias: "plucky"
b4_node_default_os_arch: "x86_64"
b4_node_default_os_profile: "none"
b4_node_default_os_installer: "anaconda"
b4_node_default_os_locale: "uk"
b4_default_os_locale: "{{ genesis_locale_matrix['us'] }}" 

# 2.2.- OS Attributes
b4_capture_node_os: "{{ deploy.os | default({}) }}"
b4_capture_node_os_name:   "{{ b4_capture_node_os.name | default(b4_node_default_os) | lower }}"

# 2.3.- OS Definitions
