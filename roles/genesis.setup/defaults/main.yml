j2_hostname:        "{{ b4_enroll_node_name  | default('')   }}"

#------------------------------------
# 2.- OS Installer Call from Bootloader
#------------------------------------
# SINGLE INTERFACE ENFORCEMENT & STATIC IP CONFIGURATION
#  - Multi-NIC race condition during PXE boot.
#  - Triple DHCP problem (ie.: PXE, dracut, anaconda)... assign statically
#
#  [ DHCP 1: Hardware/iPXE ]  ➔  [ DHCP 2: Initramfs/Dracut ]  ➔  [ DHCP 3: Installer/Anaconda ]
#             │                                │                                │
#     ALLOWED (Inevitable)                BLOCKED!                         BLOCKED!
#     (Temporary dynamic IP to           (Static anchoring via             (Direct inheritance via
#      fetch vmlinuz/initrd.img)          'ifname' and 'none' token)        'ksdevice=net0' flag)

# 2.1- NIC Rendering
#.....................................
# Syntax: ip=<client_ip>:<peer_ip>:<gateway>:<netmask>:<hostname>:<interface>:<autoconf>
#
# - client_ip : Static IPv4 address for the target machine.
# - peer_ip   : Boot/TFTP server IP (Left empty as "::" to bypass/skip).
# - gateway   : Default gateway routing IP (Genesis node infrastructure IP).
# - netmask   : Subnet mask string (e.g., 255.255.255.0).
# - hostname  : Alphanumeric node identity string (e.g., servera199).
# - interface : Physical or logic network card identifier (e.g., net0).
# - autoconf  : Set to "none" to completely kill implicit DHCP discovery loops.
# ==============================================================================
b4_render_ip: "{{ b4_enroll_nic_provision_ip }}::{{ b4_enroll_nic_provision_gateway }}:{{ b4_enroll_nic_provision_netmask }}:{{ b4_enroll_node_name }}"
b4_render_mac: "{{ b4_enroll_nic_provision_mac | default('') | lower | replace(':', '-') }}"
b4_render_ifname: "net0"
b4_render_modules: "r8125,r8168,r8169,e1000e,igb,ixgbe,i40e,ice,tg3,bnxt_en,bnx2x,mlx5_core,virtio_net,vmxnet3"

# --> Source Installers Renderering
b4_render_ksroot: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definitions.install | default('install.img') }}"
b4_render_ignroot: "{{ b4_render_ksroot }}"
# Beware with \; => Required for PXE,iPXE... but not for GRUB
b4_render_casperds: 'nocloud-net;s={{ b4_node_os_manifesto["url"] | default("") }}'

# 2.2- Menu Rendering
#.....................................
# --> Kernel & InitRam
b4_render_kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definitions.kernel | default('vmlinuz') }}"
b4_render_initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definitions.initram | default('initrd') }}"

# --> Menus
# ==============================================================================
# FAMILY 1: DRACUT FRAMERWORK ARCHITECTURE
# SYSTEMS: Red Hat/CentOS (Anaconda), SUSE 16 (Agama), CoreOS (Ignition), MicroOS (Combustion).
#
# PARAMETER LAYOUT & DRACUT STAGE REQUISITES:
# 1. root=live:<URL>:
#    Directs Dracut to pull and stage the runtime live installation environment squashfs into RAM.
# 2. ifname=<interface>:<MAC>:
#    Enforces absolute hardware isolation by forcing predictive interface allocation strictly 
#    to our targeted provisioning MAC address, binding it layout-wide to the custom token (net0).
# 3. ip=<client-ip>:[...]:<interface>:<autoconf>:
#    Dracut positional network argument. Appending ':none' globally terminates automatic 
#    DHCP network broadcast discovery loops, establishing static exclusivity on the selected NIC.
# 4. rd.neednet=1:
#    Mandates kernel runtime persistence for the established networking configurations, 
#    ensuring seamless lifecycle handover from initramfs to the secondary installer stage.
# ==============================================================================
b4_render_menu_anaconda: >-
    root=live:{{ b4_render_ksroot }}
    inst.ks={{ b4_node_os_manifesto['url'] }}
    inst.repo={{ b4_netinstall_os_mounted_repo_url }}/
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0
    rd.net.timeout.carrier=10
    ksdevice={{ b4_render_ifname }}
    inst.ks.sendmac
    inst.sshd

b4_render_menu_autoyast: >-
    root=live:{{ b4_render_ksroot }}
    inst.install_url={{ b4_netinstall_os_mounted_repo_url }}/install/
    inst.auto={{ b4_node_os_manifesto['url'] }}
    console=tty0
    inst.unattended=1
    int.ay_check=0
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0
    rd.net.timeout.carrier=10
    copy_network=1

b4_render_menu_ignition: >-
    root=live:{{ b4_render_ignroot }}
    ignition.config.url={{ b4_node_os_manifesto['url'] }}
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0
    rd.net.timeout.carrier=10
    BOOTIF=01-{{ b4_render_mac }}

b4_render_menu_microos: >-
    root=live:{{ b4_render_ksroot }}
    combustion.url={{ b4_node_os_manifesto['url'] }}
    ifname={{ b4_render_ifname }}:{{ b4_enroll_nic_provision_mac }}
    ip={{ b4_render_ip }}:{{ b4_render_ifname }}:none
    nameserver={{ b4_url_genesis_ip }}
    rd.neednet=1
    rd.net.dhcp.retry=0

# ==============================================================================
# FAMILY 2: CASPER ENVIRONMENT AND LEGACY DEBIAN-INSTALLER TRADITION
# SYSTEMS: Ubuntu Server (Subiquity), Debian (Preseed), VMware (ESXi Hypervisor), Old YaST.
#
# PARAMETER LAYOUT & STAGE OVERRIDES:
# 1. boot=casper & netboot=url:
#    Instructs the custom Ubuntu ramdisk framework to instantiate network-based bootstrapping,
#    fetching and mounting the complete cloud-init target squashfs ISO image directly from HTTP.
# 2. ds=nocloud-net;s=<URL>:
#    Seeds data source targets for automated cloud-init and subiquity ingestion parameters.
# 3. BOOTIF=01-<MAC>:
#    Forces strict hardware isolation mapping using the traditional 01-ARP Ethernet code standard,
#    bypassing predictive naming bugs across legacy kernel boot modules.
# 4. Explicit Field Assignments:
#    Unlike modular Dracut strings, these platforms explicitly process networking arguments 
#    isolated line-by-line across granular variable keys (ip, netmask, gateway, nameserver).
# ==============================================================================
b4_render_menu_casper: >-
    boot=casper
    netboot=url
    url={{ b4_netinstall_os_iso_url }}
    cloud-config-url=/dev/null
    autoinstall
    ds={{ b4_render_casperds }}
    ip={{ b4_render_ip }}::none
    nameserver={{ b4_url_genesis_ip }}
    rootdelay=20
    boot_delay=1
    pci=realloc
    panic=10
    BOOTIF=01-{{ b4_render_mac }}
    modules_to_load={{ b4_render_modules }}

b4_render_menu_preseed: >-
    rw
    auto=true
    priority=critical
    url={{ b4_node_os_manifesto['url'] }}
    interface=bootif
    netcfg/disable_dhcp=true
    netcfg/get_ipaddress={{ b4_enroll_nic_provision_ip  }}
    netcfg/get_netmask={{ b4_enroll_nic_provision_netmask  }}
    netcfg/get_gateway={{ b4_enroll_nic_provision_gateway  }}
    netcfg/get_nameservers={{ b4_url_genesis_ip }}
    netcfg/confirm_static=true
    netcfg/link_wait_timeout=10
    BOOTIF=01-{{ b4_render_mac }}

b4_render_menu_esxi: >-
    ks={{ b4_node_os_manifesto['url'] }}
    netdevice={{ b4_enroll_nic_provision_mac }}
    ip={{ b4_enroll_nic_provision_ip }}
    netmask={{ b4_enroll_nic_provision_netmask }}
    gateway={{ b4_enroll_nic_provision_gateway}}
    nameserver={{ b4_url_genesis_ip }}

b4_render_menu_autoyast_old: >-
    install={{ b4_netinstall_os_mounted_repo_url }}
    autoyast={{ b4_node_os_manifesto['url'] }}autoinst.xml
    ifcfg={{ b4_enroll_nic_provision_mac }}
    hostip={{ b4_enroll_nic_provision_ip }}
    netmask={{ b4_enroll_nic_provision_netmask }}
    gateway={{ b4_enroll_nic_provision_gateway }}
    nameserver={{ b4_url_genesis_ip }}
    netwait=10
    confirm=0

# 2.3- Installars Particulars
#.....................................
b4_os_installer_bootloader_call:
  anaconda:
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_anaconda }}"

  casper:
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_casper }}"

  autoyast:
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_autoyast }}"
    menu_old: "{{ b4_render_menu_autoyast_old }}"

  preseed:  
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_preseed }}"

  esxi:     
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_esxi }}"
 
  ignition:
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_ignition }}"

  microos:
    kernel:  "{{ b4_render_kernel }}"
    initram: "{{ b4_render_initram }}"
    menu:    "{{ b4_render_menu_microos }}"

#------------------------------------
# 3.- API Calls
#------------------------------------
b4_lifecycle_api_calls:
  poweroff:
    # Out-of-Band Power Management - Power Off Node
    - method: "PUT"
      path: "/states/power"
      body:
        target: "power off"
    # Verification Phase - Gather Current Instance Status
    #     (Force render GRUB/iPXE files)
    - method: "GET"
      path: "/validate"
    - method: "GET"
  setup:
    # Instance Information
    - method: "PATCH"
      body:
        - op: "add"
          path: "/properties"
          value: "{{ properties | default({}) }}"
        - op: "add"
          path: "/instance_info"
          value: "{{ instance_info | default({}) }}"
        - op: "add"
          path: "/driver_info/clean_steps"
          value: "{{ b4_clean_steps | default([]) }}"
  boot_pxe:
    - method: "PATCH"
      target: "ports"
      path: "/{{ b4_enroll_nic_provision_mac | lower }}" 
      body:
        - op: "replace"
          path: "/pxe_enabled"
          value: true
    - method: "PUT"
      path: "/management/boot_device"
      body:
        boot_device: "pxe"
        persistent: true   
  boot_disk:   
    - method: "PUT"
      path: "/management/boot_device"
      body:
        boot_device: "disk"
        persistent: true  
  render:
    - method: "PUT"
      path: "/states/provision"
      body:
        target: "manage"
    - method: "PUT"
      path: "/states/provision"
      body:
        target: "provide"  

#------------------------------------
# 3.- Workarounds
#------------------------------------ 
b4_proxmox_hypervisor: >-
  {{ b4_enroll_node_bmc_credentials.username is defined and	  
     b4_enroll_node_bmc_credentials.username is not none and
     '@pam' in b4_enroll_node_bmc_credentials.username }}

