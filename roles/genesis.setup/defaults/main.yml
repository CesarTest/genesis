#------------------------------------
# 1.- OS Installer Manifesto
#------------------------------------
b4_os_installer_manifesto:
  anaconda:
    template:  
      - "manifesto/kickstart.j2"
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_kickstart_template_defaults | default({}) }}"
    profiles:  "{{ b4_kickstart_template_profiles | default({}) }}"
    
  esxi:
    template:  
      - "manifesto/kickstart.j2"
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_kickstart_template_defaults | default({}) }}"
    profiles:  "{{ b4_kickstart_template_profiles | default({}) }}"    
    
  preseed:
    template:  
      - "manifesto/preseed.j2"
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_preseed_template_defaults | default({}) }}"
    profiles:  "{{ b4_preseed_template_profiles | default({}) }}"   
    
  subsiquity:
    template:  
      - "manifesto/cloud-init/meta-data.j2"
      - "manifesto/cloud-init/user-data.j2"     
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_enroll_node_name }}/meta-data"
      - "{{ b4_repo_manifesto_path }}/{{ b4_enroll_node_name }}/user-data"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_enroll_node_name }}/meta-data"  
    defaults:  "{{ b4_subsiquity_template_defaults | default({}) }}"
    profiles:  "{{ b4_subsiquity_template_profiles | default({}) }}"
    
  ignition:
    template:  
      - "manifesto/ignition.j2"    
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_ignition_template_defaults | default({}) }}"
    profiles:  "{{ b4_ignition_template_profiles | default({}) }}"

b4_node_default_os_manifesto: "{{ b4_os_installer_manifesto[b4_node_default_os_installer] }}"
b4_node_os_manifesto: "{{ b4_os_installer_manifesto[b4_node_os_installer] | default(b4_node_default_os_manifesto) }}"
  
#------------------------------------
# 2.- OS Installer Call from Bootloader
#------------------------------------
b4_os_installer_bootloader_call:
  anaconda:
    # ...............................................................
    # KERNEL PARAMETERS DOCUMENTATION (DRACUT & ANACONDA NETINSTALL)
    # ...............................................................
    # These parameters configure the behavior of the initramfs (Dracut) and the
    # OS installer (Anaconda) during the network boot (PXE) stage.
    #
    # Parameter breakdown:
    #
    # 1. inst.ks:
    #    - Purpose: Specifies the URL of the automated installation answer file (Kickstart).
    #    - Impact: Enables a 100% unattended and automated installation process.
    #
    # 2. inst.repo:
    #    - Purpose: Defines the repository path containing the actual RPM packages.
    #    - Impact: Anaconda looks here for the 'repodata/' structure to install the OS.
    #
    # 3. ip:
    #    - Purpose: Configures static networking during the early boot phase via Dracut.
    #    - Strict Syntax: ip=<client_ip>::<gateway>:<netmask>::<interface>:<method>
    #    - Note: 'bootif' binds to the PXE NIC; 'none' disables subsequent DHCP requests.
    #
    # 4. BOOTIF:
    #    - Purpose: Passes the MAC address of the network card used by the bootloader.
    #    - Format: Requires the '01-' hardware prefix followed by lowercase, dash-separated MAC.
    #
    # 5. rd.neednet=1:
    #    - Purpose: Forces Dracut to bring up and maintain the network infrastructure.
    #    - Impact: Prevents early network teardown before Anaconda takes full control.
    # ...............................................................
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd.img') }}"
    menu: >-
      inst.ks={{ b4_node_os_manifesto['url'] | default('') }}
      inst.repo={{ b4_netinstall_os_mounted_repo_url | default('') }}
      ip={{ b4_enroll_nic_provision_ip | default('') }}::{{ b4_url_genesis_ip | default('') }}:{{ b4_enroll_nic_provision_netmask | default('') }}::bootif:none
      BOOTIF=01-{{ b4_enroll_nic_provision_mac | default('') | lower | replace(':', '-') }}
      rd.neednet=1
      rd.net.timeout=60
      rd.shell rd.debug
  esxi:     
    # ...............................................................
    # KERNEL PARAMETERS DOCUMENTATION (VMWARE ESXI NETINSTALL)
    # ...............................................................
    # VMware ESXi uses its own native boot loader (mboot.c32 / efi) and setup engine.
    # It does not understand standard Linux network arguments as standalone keys.
    #
    # Parameter breakdown:
    #
    # 1. ks:
    #    - Purpose: Specifies the location of the ESXi Kickscript (ks.cfg) file.
    #    - Critical Note: Static network configurations MUST be appended inline within this parameter string.
    #
    # 2. ip / netmask / gateway / nameserver:
    #    - Purpose: Configures the initial temporary static network interface to pull the kickstart.
    #    - Syntax: Appended as suffix keypairs right after the ks URL path.
    #
    # 3. netdevice:
    #    - Purpose: Directs the installer to the physical network card mapping.
    #    - Value: 'detect' forces ESXi to probe and select the active link that initiated PXE.
    # ...............................................................
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd.img') }}"
    menu: >-
      ks={{ b4_node_os_manifesto.url }}
      ip={{ b4_enroll_nic_provision_ip }}
      netmask={{ b4_enroll_nic_provision_netmask }}
      gateway={{ b4_enroll_nic_provision_gateway }}
      nameserver=1.1.1.1
      netdevice=detect

  subsiquity:
    # ...............................................................
    # KERNEL PARAMETERS DOCUMENTATION (UBUNTU SUBIQUITY / CASPER)
    # ...............................................................
    # Ubuntu uses the 'casper' boot framework (initramfs-tools), which behaves
    # differently from Red Hat's Dracut engine.
    #
    # Parameter breakdown:
    #
    # 1. url:
    #    - Purpose: Specifies the HTTP/HTTPS path to the full Ubuntu Server cloud-init ISO.
    #    - Impact: Casper mounts this live ISO over the network into RAM memory.
    #
    # 2. autoinstall:
    #    - Purpose: Flags the Subiquity engine to trigger the non-interactive automated installer.
    #
    # 3. ds=nocloud-net:
    #    - Purpose: Defines the cloud-init data source location.
    #    - Syntax: 's=' points to the HTTP directory containing 'user-data' and 'meta-data'.
    #
    # 4. ip:
    #    - Purpose: Sets the static IP schema inside the casper network configuration block.
    #    - Strict Syntax: ip=<client_ip>::<gateway>:<netmask>::<interface>:<method>
    #    - Note: 'eth0' acts as a compatible placeholder; 'off' disables fallback DHCP hooks.
    #
    # 5. BOOTIF:
    #    - Purpose: Standard PXE hardware mapping string passed down to the internal network stack.
    # ...............................................................
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd') }}"  
    menu: >-
      url={{ b4_netinstall_os_iso_url }}
      autoinstall
      "ds=nocloud-net;s={{ b4_node_os_manifesto.url }}"
      ip={{ b4_enroll_nic_provision_ip }}::{{ b4_enroll_nic_provision_gateway }}:{{ b4_enroll_nic_provision_netmask }}::eth0:off
      BOOTIF=01-{{ b4_enroll_nic_provision_mac | lower | replace(':', '-') }}

  ignition:
    # ...............................................................
    # KERNEL PARAMETERS DOCUMENTATION (FEDORA COREOS / FLATCAR IGNITION)
    # ...............................................................
    # Ignition boots via Dracut but acts as a first-boot configuration engine
    # designed specifically for container-optimized immutable infrastructures.
    #
    # Parameter breakdown:
    #
    # 1. ignition.config.url:
    #    - Purpose: URL path pointing to the JSON-formatted Ignition provisioning file (.ign).
    #
    # 2. ip:
    #    - Purpose: Standard Dracut network string to set up early static network layers.
    #    - Note: 'bootif' ensures the JSON download interface matches the PXE boot interface.
    #
    # 3. BOOTIF:
    #    - Purpose: Resolves the dynamic hardware MAC address into a standard interface object,
    #               preventing systemd predictable naming rules from breaking hardcoded configurations.
    # ...............................................................
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initramfs') }}"      
    menu: >-
      ignition.config.url={{ b4_node_os_manifesto.url }}
      ip={{ b4_enroll_nic_provision_ip }}::{{ b4_enroll_nic_provision_gateway }}:{{ b4_enroll_nic_provision_netmask }}::bootif:none
      BOOTIF=01-{{ b4_enroll_nic_provision_mac | lower | replace(':', '-') }}

  preseed:  
    # ...............................................................
    # KERNEL PARAMETERS DOCUMENTATION (DEBIAN / DEVUAN PRESEED)
    # ...............................................................
    # Debian relies on the traditional Debian Installer (d-i) network module (netcfg)
    # which uses an explicit key-value argument mapping instead of standard colon strings.
    #
    # Parameter breakdown:
    #
    # 1. auto=true / priority=critical:
    #    - Purpose: Bypasses non-essential configuration prompts and forces automated execution.
    #
    # 2. url:
    #    - Purpose: Points to the raw flat-text Debian Preseed configuration deployment file.
    #
    # 3. netcfg/disable_dhcp=true:
    #    - Purpose: Instructs the d-i network framework to completely skip DHCP polling loops.
    #
    # 4. interface=auto:
    #    - Purpose: Triggers physical link detection to find the wire connected to the PXE host.
    #
    # 5. netcfg/get_*:
    #    - Purpose: Feeds static IPv4 parameters directly into the core installer network stack.
    # ...............................................................
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd') }}"  
    menu: >-
      auto=true
      priority=critical
      url={{ b4_node_os_manifesto.url }}
      netcfg/disable_dhcp=true
      interface=auto
      netcfg/get_ipaddress={{ b4_enroll_nic_provision_ip }}
      netcfg/get_netmask={{ b4_enroll_nic_provision_netmask }}
      netcfg/get_gateway={{ b4_enroll_nic_provision_gateway }}
      netcfg/confirm_static=true
  
b4_node_default_os_installer_bootloader_info: "{{ b4_os_installer_bootloader_call[b4_node_default_os_installer] | default({}) }}"
b4_node_os_installer_bootloader_info: "{{ b4_os_installer_bootloader_call[b4_node_os_installer] | default(b4_node_default_os_installer_bootloader_info) | default({}) }}" 
  
#------------------------------------
# 3.- Deploy Interfaces Configuration
#------------------------------------  
b4_node_os_installer_bootloader_menu: "{{ b4_node_os_installer_bootloader_info['menu'].split() | join(' ') }}"
b4_deploy_interface_instance_info:
  default:
    instance_info:
      image_source: "{{ b4_node_os_installer_bootloader_info['kernel'] }}"
      kernel:       "{{ b4_node_os_installer_bootloader_info['kernel'] }}"
      ramdisk:      "{{ b4_node_os_installer_bootloader_info['initram'] }}" 
  ramdisk:
    driver_info:
      pxe_append_params: "{{ b4_node_os_installer_bootloader_menu }}"
    instance_info:
      image_source: "{{ b4_node_os_installer_bootloader_info['kernel'] }}"
      kernel:       "{{ b4_node_os_installer_bootloader_info['kernel'] }}"
      ramdisk:      "{{ b4_node_os_installer_bootloader_info['initram'] }}"
      kernel_append_params: "{{ b4_node_os_installer_bootloader_menu }}"
  
