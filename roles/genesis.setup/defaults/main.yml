#####################################################
# OS_NATIVE: INSTALLERS TEMPLATES RENDERING
#   TODO: Install definition API that abstracts installer particulars
##################################################### 

#------------------------------------
# 1.- Kickstart
#------------------------------------
b4_kickstart_template_defaults:
    system: |
      # Use NFS installation media
      url --url {{ b4_netinstall_url }}    
      
      #system Language
      lang en_GB
             
      #system keyboard
      keyboard uk
             
      # Firewall configuration
      firewall --disabled
      
      # SELinux configuration
      selinux --disabled
             
      # System authorization information
      auth  --useshadow --passalgo=sha512   
      
      #Sytem timezone
      timezone --utc Europe/London
      
      #Use text mode install
      text
      
      # Install OS instead of upgrade
      install
    logging: |
      # Reboot after installation
      reboot
      
      # Installation logging level
      logging --level=info     
    network: |
      network  --bootproto=static --ip={{ b4_node_bmc_ip }} --netmask={{ b4_node_bmc_netmask }} --gateway={{ b4_node_bmc_gateway }} --onboot=on --hostname={{ b4_node_name }} --device={{ b4_node_bmc_mac }}
    packages: |
      @ base
      @ core
    storage: |
      # Clear the Master Boot Record
      zerombr
      
      # System bootloader configuration
      bootloader --location=mbr
      
      # Partition clearing information
      clearpart --all --initlabel
      
      #Partitions
      part / --fstype=ext4 --size=17408
      part pv.lab-okd-worker3-0001 --grow --size=1
      volgroup VolGroup00 --pesize=4096 pv.{{ b4_node_name }}
      logvol /nats --fstype=ext4 --name=LogVol03 --vgname=VolGroup00 --grow --size=1024
      logvol swap --name=lv_LogVol00 --vgname=VolGroup00 --grow --size=1008 --maxsize=16288

b4_kickstart_template_profiles:
   vmware_esxi: 
     storage: |
      # Clear the Master Boot Record
      zerombr
      
      # System bootloader configuration
      bootloader --location=mbr
      
      # Partition clearing information
      clearpart --all --initlabel
      
      #Partitions
      part / --fstype=ext4 --size=17408
      part pv.lab-okd-worker3-0001 --grow --size=1
      volgroup VolGroup00 --pesize=4096 pv.{{ b4_node_name }}
      logvol /nats --fstype=ext4 --name=LogVol03 --vgname=VolGroup00 --grow --size=1024
      logvol swap --name=lv_LogVol00 --vgname=VolGroup00 --grow --size=1008 --maxsize=16288     

#------------------------------------
# 2.- Cloud Init
#------------------------------------
b4_cloud-init_template_defaults:
    system: |
      user-data:
        disable_root: false
      identity:
        hostname: {{ b4_node_name }}
        username: {{ b4_default_user_name }}
        password: '{{ b4_default_user_password }}'
      keyboard:
        layout: us
      locale: en_US.UTF-8   
    ssh: |
      allow-pw: true
      authorized-keys: []
      install-server: true
    logging: |
      remotes:
        log_serv: "*.* @@{{ g4_genesis_ip }}:{{ g4_genesis_rsyslog_port }}"     
    network: |
      network:
        version: 2
        ethernets:
          eno1:
            critical: true
            addresses:
              - {{ g4_bmc_ip }}
            gateway4: {{ g4_bmc_gateway }}
            match:
              macaddress: {{ g4_bmc_mac }}
            set-name: eno1         
    storage: |
      layout:
        name: lvm
        match: {} 
    packages: |
      # even set to no/false, geoip lookup still happens
      geoip: no
      preserve_sources_list: false
      sources_list: |
        deb [trusted=yes] http://{{ b4_cloud-init_netinstall_url }} ./
      packages:
       - ubuntu-desktop-minimal          
    preinstall: |
      - path: /run/tmpfiles.d/bootorder.sh
        content: |
          #!/bin/bash
          BOOT_OS=$(/target/usr/bin/efibootmgr |egrep ubuntu|cut -b5-8|tr -s '\n' ',')
          BOOT_DEVICE=$(/target/usr/bin/efibootmgr |egrep -v "ubuntu|^Time|^BootC|^BootO|^Desired|^Mirror"|cut -b5-8|tr -s '\n' ','|sed 's/.$//')
          /target/usr/bin/efibootmgr -o ${BOOT_OS}${BOOT_DEVICE}     
    postinstall: |
      - echo '{{ g4_default_user_name }} ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/{{ g4_default_user_name }}
      - sed -i 's|^root:.:|root:{{ g4_root_user_password }}|' /target/etc/shadow
      - sed -i 's|#PermitRootLogin prohibit-password|PermitRootLogin yes|' /target/etc/ssh/sshd_config
      - /bin/bash /run/tmpfiles.d/bootorder.sh
      
#------------------------------------
# 3.- Preseeds
#------------------------------------


#------------------------------------
# 4.- Ignition
#------------------------------------


#------------------------------------
# 5.- Data Model
#------------------------------------
b4_os_installer_datamodel:
  anaconda:
    kernel:    "{{ b4_kickstart_kernel  | default('vmlinuz') }}"
    initram:   "{{ b4_kickstart_initram | default('initrd.img') }}"
    defaults:  "{{ b4_kickstart_template_defaults | default({}) }}"
    profiles:  "{{ b4_kickstart_template_profiles | default({}) }}"
    
  subsiquity:
    kernel:    "{{ b4_cloud-init_kernel  | default('vmlinuz') }}"
    initram:   "{{ b4_cloud-init_initram | default('initrd') }}"  
    defaults:  "{{ b4_cloud-init_template_defaults | default({}) }}"
    profiles:  "{{ b4_cloud-init_template_profiles | default({}) }}"
    
  ignition:
    kernel:    "{{ b4_ignition_kernel | default('vmlinuz') }}"
    initram:   "{{ b4_igntion_initram | default('initramfs') }}"    
    defaults:  "{{ b4_ignition_template_defaults | default({}) }}"
    profiles:  "{{ b4_ignition_template_profiles | default({}) }}"