#------------------------------------
# 5.- OS Manifesto Definitions
#------------------------------------
b4_node_manifesto_profiles: "{{ deploy['os_manifesto'][b4_node_os_installer] | default({}) }}" 
b4_system_manifesto_profiles: "{{ genesis_os_manifesto[b4_node_os_installer] | default({}) }}" 
b4_os_manifesto_profiles: "{{ b4_kickstart_template_os_profiles[b4_node_os_version] | default({}) }}"
b4_render_manifesto_file: "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
b4_render_manifesto_url: "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}"
b4_os_installer_manifesto:
  anaconda:
    template:  
      - "manifesto/kickstart.j2"
    file:      
      - "{{ b4_render_manifesto_file }}"
    url:        "{{ b4_render_manifesto_url }}" 
    defaults:   "{{ b4_kickstart_template_defaults  | default({}) }}"
    os_version: "{{ b4_os_manifesto_profiles }}"
    system:     "{{ b4_system_manifesto_profiles }}"
    node:       "{{ b4_node_manifesto_profiles   }}"

  casper:
    template:  
      - "manifesto/casper/meta-data.j2"
      - "manifesto/casper/user-data.j2"     
    file:      
      - "{{ b4_render_manifesto_file }}/meta-data"
      - "{{ b4_render_manifesto_file }}/user-data"
    url: "{{ b4_render_manifesto_url }}/"  
    defaults:   "{{ b4_casper_template_defaults  | default({}) }}"
    os_version: "{{ b4_os_manifesto_profiles }}"
    system:     "{{ b4_system_manifesto_profiles }}"
    node:       "{{ b4_node_manifesto_profiles   }}"

  autoyast: &suse_manifesto
    template:  
      - "manifesto/autoyast.j2"    
    file:      
      - "{{ b4_render_manifesto_file }}"
    url:        "{{ b4_render_manifesto_url }}" 
    defaults:   "{{ b4_autoyast_template_defaults  | default({}) }}"
    os_version: "{{ b4_os_manifesto_profiles }}"
    system:     "{{ b4_system_manifesto_profiles }}"
    node:       "{{ b4_node_manifesto_profiles   }}"
  amanda: *suse_manifesto
  
  esxi:
    template:  
      - "manifesto/kickstart.j2"
    file:      
      - "{{ b4_render_manifesto_file }}"
    url:        "{{ b4_render_manifesto_url }}" 
    defaults:   "{{ b4_kickstart_template_defaults  | default({}) }}"
    os_version: "{{ b4_os_manifesto_profiles }}"
    system:     "{{ b4_system_manifesto_profiles }}"
    node:       "{{ b4_node_manifesto_profiles   }}"

  preseed:
    template:  
      - "manifesto/preseed.j2"
    file:      
      - "{{ b4_render_manifesto_file }}"
    url:        "{{ b4_render_manifesto_url }}" 
    defaults:   "{{ b4_preseed_template_defaults  | default({}) }}"
    os_version: "{{ b4_os_manifesto_profiles }}"
    system:     "{{ b4_system_manifesto_profiles }}"
    node:       "{{ b4_node_manifesto_profiles   }}"
    
  ignition:
    template:  
      - "manifesto/ignition.j2"    
    file:      
      - "{{ b4_render_manifesto_file }}"
    url:        "{{ b4_render_manifesto_url }}" 
    defaults:   "{{ b4_ignition_template_defaults | default({}) }}"
    os_version: "{{ b4_os_manifesto_profiles }}"
    system:     "{{ b4_system_manifesto_profiles }}"
    node:       "{{ b4_node_manifesto_profiles   }}"

  microos:
    template:  
      - "manifesto/microos.j2"    
    file: 
      - "{{ b4_render_manifesto_file }}/script"
    url:        "{{ b4_render_manifesto_url }}/script" 
    defaults:   "{{ b4_microos_template_defaults | default({}) }}"
    os_version: "{{ b4_os_manifesto_profiles }}"
    system:     "{{ b4_system_manifesto_profiles  }}"
    node:       "{{ b4_node_manifesto_profiles    }}"
    
b4_node_os_manifesto: "{{ b4_os_installer_manifesto[b4_node_os_installer] | default({}) }}"
b4_os_manifesto_templates: "{{ b4_node_os_manifesto['template'] | default([]) }}"
b4_node_manifesto_files:   "{{ b4_node_os_manifesto['file']     | default([]) }}"

