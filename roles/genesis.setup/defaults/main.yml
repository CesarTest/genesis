#------------------------------------
# 1.- OS Installer Manifesto
#------------------------------------
b4_os_installer_manifesto:
  anaconda:
    template:  
      - "kickstart.j2"
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_kickstart_template_defaults | default({}) }}"
    profiles:  "{{ b4_kickstart_template_profiles | default({}) }}"
    
  esxi:
    template:  
      - "kickstart.j2"
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_kickstart_template_defaults | default({}) }}"
    profiles:  "{{ b4_kickstart_template_profiles | default({}) }}"    
    
  preseed:
    template:  
      - "preseed.j2"
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_preseed_template_defaults | default({}) }}"
    profiles:  "{{ b4_preseed_template_profiles | default({}) }}"   
    
  subsiquity:
    template:  
      - "cloud-init/meta-data.j2"
      - "cloud-init/user-data.j2"     
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_enroll_node_name }}/meta-data"
      - "{{ b4_repo_manifesto_path }}/{{ b4_enroll_node_name }}/user-data"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_enroll_node_name }}/meta-data"  
    defaults:  "{{ b4_subsiquity_template_defaults | default({}) }}"
    profiles:  "{{ b4_subsiquity_template_profiles | default({}) }}"
    
  ignition:
    template:  
      - "ignition.j2"    
    file:      
      - "{{ b4_repo_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    url:       "{{ b4_netinstall_os_manifesto_url }}/{{ b4_node_os_manifesto_file }}" 
    defaults:  "{{ b4_ignition_template_defaults | default({}) }}"
    profiles:  "{{ b4_ignition_template_profiles | default({}) }}"

b4_node_default_os_manifesto: "{{ b4_os_installer_manifesto[b4_node_default_os_installer] }}"
b4_node_os_manifesto: "{{ b4_os_installer_manifesto[b4_node_os_installer] | default(b4_node_default_os_manifesto) }}"
  
#------------------------------------
# 2.- OS Installer Call from Bootloader
#------------------------------------
b4_os_installer_bootloader_call:
  anaconda:
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd.img') }}"
    menu: >-
      inst.ks={{ b4_node_os_manifesto['url'] }}
      inst.repo={{ b4_netinstall_os_mounted_repo_url }}
      ifname=bootif:{{ b4_enroll_nic_provision_mac | lower }}
      ip={{ b4_enroll_nic_provision_ip }}::{{ b4_enroll_nic_provision_gateway }}:{{ b4_enroll_nic_provision_netmask }}::bootif:none
      BOOTIF={{ b4_enroll_nic_provision_mac | lower }}

  esxi:     
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd.img') }}"
    menu: >-
      ks={{ b4_node_os_manifesto.url }}
      ip={{ b4_enroll_nic_provision_ip }}
      netmask={{ b4_enroll_nic_provision_netmask }}
      gateway={{ b4_enroll_nic_provision_gateway }}
      netdevice={{ b4_enroll_nic_provision_mac | lower }}
  
  subsiquity:
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd') }}"  
    # Envolvemos el ds="..." completo en comillas para proteger el punto y coma del formateo de bloques YAML
    menu: >-
      url={{ b4_netinstall_os_iso_url }}
      autoinstall
      "ds=nocloud-net;s={{ b4_node_os_manifesto.url }}"
      ip={{ b4_enroll_nic_provision_ip }}::{{ b4_enroll_nic_provision_gateway }}:{{ b4_enroll_nic_provision_netmask }}::bootif:none
      BOOTIF=01-{{ b4_enroll_nic_provision_mac | lower | replace(':', '-') }}
  
  ignition:
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initramfs') }}"      
    menu: >-
      ignition.config.url={{ b4_node_os_manifesto.url }}
      ifname=eth0:{{ b4_enroll_nic_provision_mac | lower }}
      ip={{ b4_enroll_nic_provision_ip }}::{{ b4_enroll_nic_provision_gateway }}:{{ b4_enroll_nic_provision_netmask }}::eth0:none
  
  preseed:  
    kernel:  "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.kernel  | default('vmlinuz') }}"
    initram: "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_definions.initram | default('initrd') }}"  
    menu: >-
      auto=true
      priority=critical
      url={{ b4_node_os_manifesto.url }}
      netcfg/disable_dhcp=true
      netcfg/choose_interface={{ b4_enroll_nic_provision_mac | lower }}
      netcfg/get_ipaddress={{ b4_enroll_nic_provision_ip }}
      netcfg/get_netmask={{ b4_enroll_nic_provision_netmask }}
      netcfg/get_gateway={{ b4_enroll_nic_provision_gateway }}
      netcfg/confirm_static=true
  
b4_node_default_os_installer_bootloader_info: "{{ b4_os_installer_bootloader_call[b4_node_default_os_installer] | default({}) }}"
b4_node_os_installer_bootloader_info: "{{ b4_os_installer_bootloader_call[b4_node_os_installer] | default(b4_node_default_os_installer_bootloader_info) | default({}) }}" 
  
#------------------------------------
# 3.- Deploy Interfaces Configuration
#------------------------------------  

b4_deploy_interface_instance_info:
  ramdisk:
    image_source: "{{ b4_node_os_installer_bootloader_info['kernel'] }}"
    kernel:       "{{ b4_node_os_installer_bootloader_info['kernel'] }}"
    ramdisk:      "{{ b4_node_os_installer_bootloader_info['initram'] }}"
    boot_append_arguments: "{{ b4_node_os_installer_bootloader_info['menu'] }}"

b4_deploy_interface_node_instance_info: "{{ b4_deploy_interface_instance_info[b4_node_deploy_interface] }}"	