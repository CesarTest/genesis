---
# genesis.setup defaults
#   - Generate Install Manifesto for each Node
#   - Enroll Nodes
#   - Set Boot Interface
#   - Set deploy Interface
#   - Move across node life cycle transitions until Available State
#  
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

######################################################
#  GENESIS PATHS (global for update all genesis roles at once)
######################################################
# 1.- Repos Paths
genesis_repo_path:     "{{ role_path | dirname | dirname | realpath }}/repo"
genesis_local_repo_url: "file://{{ genesis_repo_path | realpath }}"
genesis_rsyslog_port: "5456"
file_url_port_tls: "8083"


# 2.- Bifrost Role Paths
genesis_bifrost_role_name: "genesis.bifrost"
genesis_bifrost_path:  "{{ role_path | dirname }}/{{ genesis_bifrost_role_name }}"
genesis_bifrost_roles: "{{ genesis_bifrost_path | realpath }}/{{ genesis_bifrost_role_name }}/playbooks/roles"
genesis_bifrost_files_path: "{{ genesis_bifrost_path | realpath }}/files"
genesis_bifrost_venv_dir: "{{ lookup('env', 'VENV') or '/opt/stack/bifrost' }}"

# 3.- Repositories
genesis_default_repos:
  os: "os"
  manifesto: "manifesto" 
  components: "openstack"
  cloud: "dib"
  ipa: "dib/files" 
  repo: "mnt"

genesis_os_definitions:
  centos:
    ansible_distribution: "CentOS"
    installer: "anaconda"
    prefix: "ks_"
    ext: ".ks" 
  redhat:
    ansible_distribution: "RedHat"
    installer: "anaconda"
    prefix: "ks_"
    ext: ".ks"  
  esxi:
    ansible_distribution: "unknown"
    installer: "anaconda"
    ext: ".ks"     
  ubuntu:
    ansible_distribution: "Ubuntu"
    installer: "subsiquity"
  coreos:
    ansible_distribution: "CoreOS"
    installer: "ignition"
    ext: ".ign"     
  debian:
    ansible_distribution: "Debian"
    installer: "preseed" 
    ext: ".cfg"     
 
######################################################
# B4 - PATHS
######################################################
# 1.- Paths
b4_repos: "{{ genesis_airgap_repos | default(genesis_default_repos) }}" 
b4_os_images_subpath: "{{ b4_repos['os'] | default('os') }}"
b4_os_mounted_repo_subpath: "{{ b4_repos['repo'] | default('mnt') }}"
b4_os_manifesto_subpath: "{{ b4_repos['manifesto'] | default('manifesto') }}"
b4_repo_os_path: "{{ genesis_repo_path | realpath }}/{{ b4_repo_os_images_subpath }}"
b4_repo_manifesto_path: "{{ genesis_repo_path | realpath }}/{{ b4_os_manifesto_subpath }}"
b4_http_manifesto_path: "{{ ironic_http_path | realpath }}/{{ b4_os_manifesto_subpath }}"

######################################################
#  BIFROST ROLES DEFINITION 
######################################################
b4_configdrive_roles:
   - name: "bifrost-configdrives-dynamic"

b4_enroll_roles:
   - name: "ironic-enroll-dynamic"
   - name: "ironic-inspect-node"
     condition: "{{ inspect_nodes | default('false') | bool }}" 

b4_delete_roles:
   - name: "ironic-delete-dynamic"
 

######################################################
# ENROLL PARTICULARS
######################################################

#------------------
# 1.- Nics Details, extract BMC and Provision NICs
#------------------
# 1.1.- Capture Nics Data
b4_enroll_nics:      "{{ enroll['nics'] | default({}) }}"
b4_enroll_node_inband_nics:  "{{ b4_enroll_nics['inband']  | default([]) }}"
b4_enroll_node_outband_nics: "{{ b4_enroll_nics['outband'] | default([]) }}" 
b4_enroll_nics_list: "{{ b4_enroll_node_inband_nics + b4_enroll_node_outband_nics }}"

# ---- Filter according to flag - provision: yes/true
b4_enroll_default_provision: "{{ b4_enroll_nics_list | selectattr('provision', 'defined') | selectattr('provision', 'equalto', true) | list }}"

# ---- NIC selection from list (BMC y Provisión)
b4_enroll_nic_bmc:   "{{ b4_enroll_node_outband_nics[0] | default(b4_enroll_default_provision[0] | default({})) }}"
b4_enroll_nic_provision: "{{ b4_enroll_default_provision[0] | default(b4_enroll_node_inband_nics[0] | default(b4_enroll_nic_bmc | default(b4_enroll_nics_list[0] | default({})))) }}"

# 1.2.- BMC NIC Particulars
b4_enroll_nic_bmc_mac:     "{{ b4_enroll_nic_bmc['mac'] | default('') | lower }}"
b4_enroll_nic_bmc_ipv4:    "{{ b4_enroll_nic_bmc['ipv4'] | default('127.0.0.1/24')  }}"
b4_enroll_nic_bmc_ip:      "{{ b4_enroll_nic_bmc_ipv4  | ansible.utils.ipaddr('address') }}"
b4_enroll_nic_bmc_netmask: "{{ b4_enroll_nic_bmc_ipv4  | ansible.utils.ipaddr('netmask') }}"
b4_enroll_nic_bmc_prefix:  "{{ b4_enroll_nic_bmc_ipv4  | ansible.utils.ipaddr('prefix') }}"
b4_enroll_nic_bmc_default_gateway: "{{ b4_enroll_nic_bmc_ipv4 | ansible.utils.ipaddr('last_usable') }}"
b4_enroll_nic_bmc_gateway: "{{ b4_enroll_nic_bmc['gateway'] | default(b4_enroll_nic_bmc_default_gateway) }}"

# 1.3.- Provision NIC Particulars
b4_enroll_nic_provision_mac:     "{{ b4_enroll_nic_provision['mac'] | default('') | lower }}"
b4_enroll_nic_provision_ipv4:    "{{ b4_enroll_nic_provision['ipv4'] | default('127.0.0.1/24')  }}"
b4_enroll_nic_provision_ip:      "{{ b4_enroll_nic_provision_ipv4  | ansible.utils.ipaddr('address') }}"
b4_enroll_nic_provision_netmask: "{{ b4_enroll_nic_provision_ipv4  | ansible.utils.ipaddr('netmask') }}"
b4_enroll_nic_provision_prefix:  "{{ b4_enroll_nic_provision_ipv4  | ansible.utils.ipaddr('prefix') }}"
b4_enroll_nic_provision_default_gateway: "{{ b4_enroll_nic_provision_ipv4 | ansible.utils.ipaddr('last_usable') }}"
b4_enroll_nic_provision_gateway: "{{ b4_enroll_nic_provision['gateway'] | default(b4_enroll_nic_provision_default_gateway) }}"

# 1.4.- List of NICs for OpenStack Ansible Module
b4_enroll_node_nics_raw: 
  - mac: "{{ b4_enroll_nic_provision_mac | default(none) }}" 
  - mac: "{{ b4_enroll_nic_bmc_mac       | default(none) }}"
b4_enroll_node_nics: >-
  {{ b4_enroll_node_nics_raw 
     | rejectattr('mac', 'none') 
     | rejectattr('mac', 'undefined') 
     | default(omit) }}
 
#------------------
# 2.- Out-Of-Band BMC Details (node -> inventory -> defaults)
#------------------
b4_enroll_node_name: "{{ enroll.name | default(hostname) | default(inventory_hostname_short) | default(inventory_hostname) | default(ansible_hostname) | default('nohost') }}" 
b4_enroll_node_uuid: "{{ enroll.uuid | default('') }}" 
b4_enroll_node_bmc_driver: "{{ enroll.driver | default('redfish') }}" 

#------------------
# 3.- Out-Of-Band BMC Credentials (node -> inventory -> defaults)
#------------------
b4_enroll_default_bmc_credentials:
   redfish:
     ipv4: "{{ b4_enroll_nic_bmc_ip }}/{{ b4_enroll_nic_bmc_prefix }}"  
     username: "root"
     password: "calvin"
     verify_ca: false 
   ipmi:
     ipv4: "{{ b4_enroll_nic_bmc_ip }}/{{ b4_enroll_nic_bmc_prefix }}"  
     username: "root"
     password: "calvin" 
     priv_level: "ADMINISTRATOR"
     port: 	"623"
     cipher_suite: "17"
b4_enroll_genesis_bmc_credentials: "{{ genesis_bmc_credentials[b4_enroll_node_bmc_driver] | default(b4_enroll_default_bmc_credentials) }}"
b4_enroll_node_bmc_credentials: "{{ enroll.bmc_credentials[b4_enroll_node_bmc_driver] | default(b4_enroll_genesis_bmc_credentials) }}"
b4_enroll_default_node_id: "{{ enroll.driver_info['node_id'] | default(b4_enroll_node_bmc_credentials['node_id']) | default(b4_enroll_genesis_bmc_credentials['node_id']) | default('') }}"

#------------------
# 4.- Out-Of-Band BMC URLs (node -> inventory -> defaults)
#------------------
b4_enroll_node_bmc_protocol: "{{ b4_enroll_node_bmc_credentials['protocol'] | default(b4_enroll_genesis_bmc_credentials['protocol']) | default('https') }}"
b4_enroll_node_bmc_ipv4: "{{ b4_enroll_node_bmc_credentials['ipv4'] | default(b4_enroll_genesis_bmc_credentials['ipv4']) | default(b4_enroll_nic_bmc_ipv4) | ansible.utils.ipaddr('address') }}"
b4_enroll_node_bmc_port: "{{ b4_enroll_node_bmc_credentials['port'] | default(b4_enroll_genesis_bmc_credentials['port']) | default(omit) }}"
b4_enroll_node_bmc_url: "{{b4_enroll_node_bmc_protocol }}://{{ b4_enroll_node_bmc_ipv4 }}{{  b4_enroll_node_bmc_port is not none | ternary(':'+b4_enroll_node_bmc_port,'','') }}"
b4_enroll_default_system_id: "/redfish/v1/Systems/{{ b4_enroll_default_node_id | default('') }}"

#------------------
# 5.- Out-Of-Band BMC driver Info
#------------------
b4_enroll_node_bmc_driver_info:
  redfish:
    redfish_address: "{{ b4_enroll_node_bmc_url }}"
    redfish_username: "{{ enroll.driver_info['redfish_username'] | default(b4_enroll_node_bmc_credentials['username']) | default(b4_enroll_genesis_bmc_credentials['username']) | default('root') }}"
    redfish_password: "{{ enroll.driver_info['redfish_password'] | default(b4_enroll_node_bmc_credentials['password']) | default(b4_enroll_genesis_bmc_credentials['password']) | default('calvin') }}"
    redfish_verify_ca: "{{ enroll.driver_info['redfish_verify_ca'] | default(b4_enroll_node_bmc_credentials['verify_ca']) | default(b4_enroll_genesis_bmc_credentials['verify_ca']) | default(false) }}"
    redfish_system_id: "{{ enroll.driver_info['redfish_system_id'] | default(b4_enroll_node_bmc_credentials['system_id']) | default(b4_enroll_genesis_bmc_credentials['system_id']) | default(b4_enroll_default_system_id) }}"
  ipmi:
    ipmi_address: "{{ b4_enroll_node_bmc_ipv4 }}"
    ipmi_username:  "{{ enroll.driver_info['ipmi_username'] | default(b4_enroll_node_bmc_credentials['username']) | default(b4_enroll_genesis_bmc_credentials['username']) | default('root') }}"
    ipmi_password: "{{ enroll.driver_info['ipmi_password'] | default(b4_enroll_node_bmc_credentials['password']) | default(b4_enroll_genesis_bmc_credentials['password']) | default('calvin') }}"
    ipmi_priv_level: "{{ enroll.driver_info['priv_level'] | default(b4_enroll_node_bmc_credentials['priv_level']) | default(b4_enroll_genesis_bmc_credentials['priv_level']) | default('ADMINISTRATOR') }}"
    ipmi_port: "{{ b4_enroll_node_bmc_port | default('623') }}"
    ipmi_cipher_suite: "{{  enroll.driver_info['ipmi_cipher_suite'] | default(b4_enroll_node_bmc_credentials['cipher_suite']) | default(b4_enroll_genesis_bmc_credentials['cipher_suite']) | default('17') }}"

#------------------
# 6.- Properties (Corregido)
#------------------
b4_enroll_node_chassis_default_properties: 
  cpus: 4              
  cpu_arch: "x86_64" 
  memory_mb: 4096      
  local_gb: 32         
  
b4_enroll_node_chassis_properties_input: "{{ enroll['properties'] | default(b4_enroll_node_chassis_default_properties) }}"
b4_enroll_node_chassis_capabilities: "{{ enroll['capabilities'] | default({}) }}"
b4_enroll_node_chassis_capabilities_string: "{{ (b4_enroll_node_chassis_capabilities | length > 0) | ternary(b4_enroll_node_chassis_capabilities.items() | map('join', ':') | join(',') | lower, '') }}"
b4_enroll_node_chassis_cpus: "{{ b4_enroll_node_chassis_properties_input['cpus'] | default(b4_enroll_node_chassis_default_properties['cpus']) | int }}"
b4_enroll_node_chassis_cpu_arch: "{{ b4_enroll_node_chassis_properties_input['cpu_arch'] | default(b4_enroll_node_chassis_properties_input['arch'] | default(b4_enroll_node_chassis_default_properties['cpu_arch'])) }}"
b4_enroll_node_chassis_memory_mb: "{{ b4_enroll_node_chassis_properties_input['memory_mb'] | default(b4_enroll_node_chassis_properties_input['ram'] | default(b4_enroll_node_chassis_default_properties['memory_mb'])) | int }}"
b4_enroll_node_chassis_local_gb: "{{ b4_enroll_node_chassis_properties_input['local_gb'] | default(b4_enroll_node_chassis_properties_input['disk_size'] | default(b4_enroll_node_chassis_default_properties['local_gb'])) | int }}"
b4_enroll_node_chassis_root_device: "{{ b4_enroll_node_chassis_properties_input['root_device'] | default(omit) }}"
b4_enroll_node_chassis_properties:
   cpus:         "{{ b4_enroll_node_chassis_cpus }}"
   cpu_arch:     "{{ b4_enroll_node_chassis_cpu_arch }}"
   memory_mb:    "{{ b4_enroll_node_chassis_memory_mb }}"
   local_gb:     "{{ b4_enroll_node_chassis_local_gb }}"
   root_device:  "{{ b4_enroll_node_chassis_root_device }}"
   capabilities: "{{ b4_enroll_node_chassis_capabilities_string }}"

   
######################################################
# MANAGE STAGE PARTICULARS
######################################################

#------------------
# 0.- Bifrost Data Model Dump File
#------------------
b4_baremetal_fact_caching_connection: "{{ lookup('ansible.builtin.config', 'fact_caching_connection', plugin_type='cache', plugin_name='jsonfile', errors='ignore') }}"
b4_baremetal_setup_vars_path: "{{ b5_baremetal_fact_caching_connection | default('/tmp', boolean=True) }}"
b4_baremetal_vars_filename: "genesis_{{ inventory_hostname }}.yml"
b4_baremetal_vars_file: "{{ b4_baremetal_setup_vars_path }}/{{ b4_baremetal_vars_filename }}"

#------------------
# 1.- Inband Provision URLs
#------------------
b4_url_protocol: "http"
b4_url_short_subpath:   "{{ b4_node_os | lower }}{{ b4_node_os_version | lower}}"
b4_url_full_subpath:    "{{ b4_node_os }}/{{ b4_node_os_version }}"
b4_url_genesis_ipv4:    "{{ hostvars[groups['target'][0]]['dhcp_address'] | default('127.0.0.1/24') }}"
b4_url_genesis_ip:      "{{ b4_url_genesis_ipv4 | ansible.utils.ipaddr('address') }}"
b4_url_genesis_gateway: "{{ b4_url_genesis_ipv4 | ansible.utils.ipaddr('last_usable') }}"
b4_url_genesis_netmask: "{{ b4_url_genesis_ipv4 | ansible.utils.ipaddr('netmask') }}"

b4_genesis_port:
  http:  "{{ genesis_http_port  | default(file_url_port)     | default('8080') }}"
  https: "{{ genesis_https_port | default(file_url_port_tls) | default('8083') }}" 
  oci:   "{{ genesis_https_oci  | default(registry_port)     | default('5500') }}"
  ironic: "{{ genesis_ironic_port  | default(ironic_api_port)     | default('6385') }}"

b4_url_genesis_port: "{{ b4_genesis_port[b4_url_protocol] is defined | ternary (':','','') }}{{ b4_genesis_port[b4_url_protocol] | default('') }}"
b4_url_genesis_url: "{{ genesis_address | default(b4_url_genesis_ip) }}{{ b4_url_genesis_port }}"
b4_url_ironic_port: "{{ b4_genesis_port['ironic'] is defined | ternary (':','','') }}{{ b4_genesis_port['ironic'] | default('') }}"
b4_url_ironic_url: "{{ genesis_address | default(b4_url_genesis_ip) }}{{ b4_url_ironic_port }}"

#------------------
# 2.- OS
#------------------
b4_node_default_os: "{{ genesis_node_default_os | default('CentOS') }}"
b4_node_default_os_version: "{{ genesis_node_default_version | default('9') }}"
b4_node_default_os_arch: "x86_64"
b4_node_default_os_profile: "none"
b4_node_default_os_installer: "anaconda"
b4_capture_node_os:   "{{ deploy.os.name | default(b4_node_default_os) | lower }}"
b4_node_os_definitions: "{{ genesis_os_definitions[b4_capture_node_os] }}"
b4_node_os:           "{{ b4_node_os_definitions['ansible_distribution'] | default('unknown') }}"
b4_node_os_version:   "{{ deploy.os.version | default(b4_node_default_os_version) }}"
b4_node_os_arch:      "{{ deploy.os.arch    | default(b4_node_default_os_arch) }}"
b4_node_os_profile:   "{{ deploy.os.profile | default(b4_node_default_os_profile) }}"
b4_node_os_installer: "{{ b4_node_os_definitions['installer'] | default(b4_node_default_os_installer) | lower}}"
b4_node_os_manifesto_file: "{{ b4_node_os_definitions['prefix'] }}{{ b4_enroll_node_name }}{{ b4_node_os_definitions['ext'] }}"
b4_node_os_iso_file: "{{ b4_node_os_iso | default(b4_node_os_arch + '.iso') }}"

#------------------
# 3.- Users 
#------------------
b4_default_user_name: 'genesis'
b4_default_user_password: ''
b4_root_user_password: ''

#------------------
# 4.- OS Installers URLs
#------------------
b4_ironic_base_url: "{{ b4_url_protocol }}://{{ b4_url_ironic_url }}"
b4_netinstall_base_url: "{{ b4_url_protocol }}://{{ b4_url_genesis_url }}"
b4_netinstall_os_manifesto_url:    "{{ b4_netinstall_base_url }}/{{ b4_os_manifesto_subpath }}"
b4_netinstall_os_images_url:       "{{ b4_netinstall_base_url }}/{{ b4_os_images_subpath }}/{{ b4_url_full_subpath }}"
b4_netinstall_os_mounted_repo_url: "{{ b4_netinstall_base_url }}/{{ b4_os_mounted_repo_subpath }}/{{ b4_url_full_subpath }}"
b4_netinstall_os_iso_url:          "{{ b4_netinstall_os_images_url }}/{{ b4_node_os_iso_file }}"

#------------------
# 5.- Interfaces
#------------------
b4_node_default_boot_interface: "ipxe"
b4_node_default_deploy_interface: "direct"
b4_node_boot_interface:   "{{ deploy['boot_interface'] | default(b4_node_default_boot_interface) }}"
b4_node_deploy_interface: "{{ deploy['deploy_interface'] | default(b4_node_default_deploy_interface) }}"

#####################################################
# OS_NATIVE: INSTALLERS TEMPLATES RENDERING
#   TODO: Install definition API that abstracts installer particulars
##################################################### 

#------------------------------------
# 1.- Kickstart
#------------------------------------
b4_kickstart_template_defaults:
  preinstall: |
    # Use NFS installation media
    url --url {{ b4_netinstall_os_mounted_repo_url }} 
  postinstall: |
    # 1. DETECCIÓN INTELIGENTE: ¿Es una Máquina Virtual?
    # Buscamos fabricantes comunes de VMs (QEMU, VMware, VirtualBox, KVM, Xen)
    IS_VM=0
    if command -v dmidecode &>/dev/null; then
        SYS_VENDOR=$(dmidecode -s system-manufacturer 2>/dev/null | tr '[:upper:]' '[:lower:]')
        if [[ "$SYS_VENDOR" =~ (qemu|kvm|vmware|virtualbox|xen|innotek|bochs) ]]; then
            IS_VM=1
        fi
    fi
    
    # 2. EJECUCIÓN CONDICIONAL
    if [ "$IS_VM" -eq 1 ]; then
        echo "[INFO] Entorno virtual detectado ($SYS_VENDOR). Omitiendo ipmitool para evitar errores." >> /root/ks-post-ipmi.log
    else
        echo "[INFO] Hardware físico detectado. Iniciando configuración IPMI..." >> /root/ks-post-ipmi.log
    
        # Asegurar módulos del Kernel (Requerido en RHEL modernos)
        modprobe ipmi_msghandler 2>/dev/null
        modprobe ipmi_si 2>/dev/null
        modprobe ipmi_devintf 2>/dev/null
        
        # Asegurar el nodo del dispositivo dentro del chroot de Anaconda
        if [ ! -c /dev/ipmi0 ]; then
            mknod /dev/ipmi0 c 242 0 2>/dev/null || mknod /dev/ipmi0 c 243 0
        fi
        
        # Doble validación: Si el nodo /dev/ipmi0 no existe tras el mknod, el hardware no tiene BMC real
        if [ ! -c /dev/ipmi0 ]; then
            echo "[ERROR] El dispositivo /dev/ipmi0 no pudo ser creado o el hardware no soporta IPMI." >> /root/ks-post-ipmi.log
        else
            # INTENTO 1: Servidores modernos UEFI (RHEL 8 y 9)
            echo "Intentando configurar orden persistente con UEFI..." >> /root/ks-post-ipmi.log
            ipmitool chassis bootdev disk options=persistent,efiboot 2>>/root/ks-post-ipmi.log
            
            # INTENTO 2: Servidores modernos con Legacy BIOS (RHEL 8 y 9)
            if [ $? -ne 0 ]; then
                echo "Fallo UEFI. Intentando persistent estándar..." >> /root/ks-post-ipmi.log
                ipmitool chassis bootdev disk options=persistent 2>>/root/ks-post-ipmi.log
            fi
            
            # INTENTO 3: Servidores antiguos o BMCs obsoletos (RHEL 6 y 7)
            if [ $? -ne 0 ]; then
                echo "Fallo 'options='. Intentando comando ipmitool clásico..." >> /root/ks-post-ipmi.log
                ipmitool chassis bootdev disk 2>>/root/ks-post-ipmi.log
            fi
        fi
    fi

  system: |       
    #system Language
    lang en_GB
           
    #system keyboard
    keyboard uk
           
    # Firewall configuration
    firewall --disabled
    
    # SELinux configuration
    selinux --disabled
           
    # System authorization information
    auth  --useshadow --passalgo=sha512   
    
    #Sytem timezone
    timezone --utc Europe/London
    
    #Use text mode install
    text
    
    # Install OS instead of upgrade
    install
  user: |
    # Root password 
    rootpw --iscrypted $1$HLvLgn43$n/B5bYQtDnht33ly  
  logging: |
    # Reboot after installation
    reboot
    
    # Installation logging level
    logging --level=info     
  network: |
    network  --bootproto=static --ip={{ b4_enroll_nic_bmc_ipv4 }} --netmask={{ b4_enroll_nic_bmc_netmask }} --gateway={{ b4_enroll_nic_bmc_gateway }} --onboot=on --hostname={{ b4_enroll_node_name }} --device={{ b4_enroll_nic_bmc_mac }}
  packages: |
    @ base
    @ core
    ipmitool
    OpenIPMI
    coreutils
  storage: |
    # Clear the Master Boot Record
    zerombr
    
    # System bootloader configuration
    bootloader --location=mbr
    
    # Partition clearing information
    clearpart --all --initlabel
    
    #Partitions
    part / --fstype=ext4 --size=17408
    part pv.{{ b4_enroll_node_name }}-0001 --grow --size=1
    volgroup VolGroup00 --pesize=4096 pv.{{ b4_enroll_node_name }}-0001
    logvol /home --fstype=ext4 --name=LogVol03 --vgname=VolGroup00 --grow --size=1024
    logvol swap --name=lv_LogVol00 --vgname=VolGroup00 --grow --size=1008 --maxsize=16288

b4_kickstart_template_profiles:
  vmware_esxi: 
    storage: |
      # Clear the Master Boot Record
      zerombr
      
      # System bootloader configuration
      bootloader --location=mbr
      
      # Partition clearing information
      clearpart --all --initlabel
      
      #Partitions
      part / --fstype=ext4 --size=17408
      part pv.lab-{{ b4_enroll_node_name }}-0001 --grow --size=1
      volgroup VolGroup00 --pesize=4096 pv.{{ b4_enroll_node_name }}-0001
      logvol /nats --fstype=ext4 --name=LogVol03 --vgname=VolGroup00 --grow --size=1024
      logvol swap --name=lv_LogVol00 --vgname=VolGroup00 --grow --size=1008 --maxsize=16288     

