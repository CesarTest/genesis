#---------------------------------------
# 1. Enroll Baremeral Nodes
#---------------------------------------   
- ansible.builtin.include_role: 
    name: "{{ b4_enroll.name }}"
  when: 
    - b4_enroll.name is defined
    - b4_enroll.condition | default(true) | bool 
  loop: "{{ b4_enroll_roles | default([]) }}"
  loop_control:
    loop_var: "b4_enroll"  