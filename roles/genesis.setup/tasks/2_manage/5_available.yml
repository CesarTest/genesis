---
# genesis.setup 2_manage/5_available.yml
#   - Leave Node in available State (ready to Deploy)
#      - Force Ironic to Render PXE Files for check
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

#---------------------------------------
# 1.- Force Ironic to Render PXE File
#---------------------------------------  

#---------------------------------------
# 2.- Audit & Diagnostic Results
#---------------------------------------  
- name: "B4 - SETUP -2- MANAGE: 5.1) Available: AUDIT Results"
  vars:
    b4_status_cmd:
      - |
        . /opt/stack/bifrost/bin/activate
        export OS_CLOUD=bifrost
        baremetal node show '{{ uuid }}' -f json
      - |
        systemctl status dnsmasq
      - |
        ss -tuplen | grep -i 'dnsmasq'
      - |
        systemctl status nginx
      - |
        ss -tuplen | grep -i 'nginx'
 
  block:
    - name: "B4 - SETUP -2- MANAGE: 5.1) Available: AUDIT Status Capture"
      ignore_errors: yes
      ansible.builtin.shell: "{{ b4_status }}"
      environment:
        OS_CLOUD: "bifrost"
        PATH: "/opt/stack/bifrost/bin:{{ ansible_env.PATH }}"  
      loop: "{{ b4_status_cmd | default([]) }}"
      loop_control: 
        loop_var: "b4_status"
      register: g1_audit_payload_raw
      changed_when: false

    - name: "B4 - SETUP -2- MANAGE: 5.2) Available: DIAGNOSTICS, trace result"
      delegate_to: localhost
      vars:
        # --- Variables de diagnóstico originales ---
        ironic_json: "{{ g1_audit_payload_raw.results[0].stdout | default('{}') | from_json }}"
        dnsmasq_status: "{{ g1_audit_payload_raw.results[1].stdout_lines | default(['No dnsmasq status captured']) }}"
        nginx_status: "{{ g1_audit_payload_raw.results[3].stdout_lines | default(['No nginx status captured']) }}"
        dnsmasq_sockets: "{{ g1_audit_payload_raw.results[2].stdout_lines | default(['No dnsmasq sockets detected']) }}"
        nginx_sockets: "{{ g1_audit_payload_raw.results[4].stdout_lines | default(['No nginx sockets detected']) }}"
        dnsmasq_conf_interface: "{{ g1_audit_payload_raw.results[5].stdout_lines | default(['No conf directives detected']) }}"
        
      ansible.builtin.debug:
        msg: |
          --- IRONIC BAREMETAL INSTANCE DATA ---
          {{ ironic_json | to_nice_json(indent=2) }}
          ----------- PXE SERVICES -------------
          
          => DNSMASQ CONFIGURATION DIRECTIVES:
          network_interface=[{{ network_interface }}]
          {% for line in dnsmasq_conf_interface %}
             {{ line }}
          {% endfor %}
          
          => DNSMASQ SERVICE STATUS:
          {% for line in dnsmasq_status %}
             {{ line }}
          {% endfor %}
         
          => ACTIVE DNSMASQ SOCKETS:
          {% for line in dnsmasq_sockets %}
             {{ line }}
          {% endfor %}
           
          => NGINX SERVICE STATUS:
          {% for line in nginx_status %}
             {{ line }}
          {% endfor %}
          
          => ACTIVE NGINX SOCKETS:
          {% for line in nginx_sockets %}
             {{ line }}
          {% endfor %}
          --------------------------------------