---
# genesis.setup 1_manifesto/1_os_native.yml
#   - Generate Install Manifesto:
#      - cloud-init
#      - kickstart
#      - ignition
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

#---------------------------------------
# 1. Manifest Folder
#---------------------------------------   
- name: "STEP 1 - Create Manifesto Folders"
  file:
     path: "{{ b4_folder | realpath }}"
     state: "directory"
     owner: ironic
     group: ironic     
     recurse: true
     mode: "775"
  loop: 
    - "{{ b4_node_os_manifesto_path }}"
  loop_control:
    loop_var: "b4_folder" 
    
- name: "STEP 1 - Expose Manifesto Folder"
  file:
    src:  "{{ b4_repo_manifesto_path }}"
    dest: "{{ b4_http_manifesto_path }}"
    owner: ironic
    group: ironic    
    state: link
    
#---------------------------------------
# 2. Manifest Rendering (KickStart, Cloud-Init, Ignition
#---------------------------------------
- name: "STEP 1 - Rendering OS Installation Manifest"
  become: yes
  ansible.builtin.template:
    src:   "{{ b4_node_manifesto_src  | default(omit) }}"
    dest:  "{{ b4_node_manifesto_dest | default(omit)  }}"
    owner: ironic
    group: ironic
    mode: '0644'
  vars:
    b4_node_os_manifesto_default_filename: "{{ b4_node_manifesto_src | basename }}" 
    b4_node_os_manifesto_filename: "{{ b4_node_os_manifesto_in_folder | default(false) | ternary(b4_node_os_manifesto_default_filename,b4_node_name,b4_node_name) }}"
    b4_node_os_manifesto_file: "{{ b4_node_os_manifesto_prefix | default('') }}{{ b4_node_os_manifesto_filename }}{{ b4_node_os_manifesto_ext  | default('') }}"
    b4_node_manifesto_dest: "{{ b4_node_os_manifesto_path }}/{{ b4_node_os_manifesto_file }}"
    input: "{{ b4_kickstart_template_defaults }}"
    profiles: "{{ b4_kickstart_template_profiles }}"
  loop: "{{ b4_node_os_manifesto_template | default([]) }}"
  loop_control:
    loop_var: "b4_node_manifesto_src"