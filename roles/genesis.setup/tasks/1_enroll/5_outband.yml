---
# genesis.setup 1_enroll/4_outband.yml
#   - Outband BMC Connectivity
#      - BMC Connectivity: TLS + Credentials
#      - BMC Authentication: TLS + Credentials
#   - Add Nodes to Ironic Database
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

#---------------------------------------
# 1. Enroll Baremeral Nodes
#---------------------------------------   
- name: "B4 SETUP - 1.- Enroll: 4) Assure Outband BMC Access to the Node" 
  block: 
    - ansible.builtin.include_role: 
        name: "{{ b4_enroll_node.name }}"
      when: 
        - b4_enroll_node.name is defined
        - b4_enroll_node.condition | default(true) | bool 
      loop: "{{ b4_enroll_roles | default([]) }}"
      loop_control:
        loop_var: "b4_enroll_node"  