---
# Versioning: https://releases.openstack.org/
openstack_version:
  openstacksdk:
     "stable/2025.2": "4.7.2"
  diskimage-builder:
     "stable/2025.2": "3.42.0"
  ironic :
     "stable/2025.2": "32.0.1"
     "stable/2026.1": "32.0.1"
     "stable/2026.2": "32.0.1"
  ironic-inspector:
     "stable/2025.2": "12.5.0"
  ironic-python-agent:
     "stable/2025.2": "11.2.0"
  ironic-python-agent-builder:
     "stable/2025.2": "6.2.0"
  ironic-prometheus-exporter:
     "stable/2025.2": "4.6.0"
  ironic-staging-drivers:
     "stable/2025.2": "0.11.0"   
  python-ironic-inspector-client:
     "stable/2025.2": "5.4.0"
  python-ironicclient:
     "stable/2025.2": "5.13.1"  
     
# 3.- Operating System Images
#----------------------------
deploy_image_sources:
  ubuntu:
    focal:
      image: "{{local_qcow_url}}/focal-server-cloudimg-amd64.img"
      checksum: "{{local_qcow_url}}/focal-server-cloudimg-amd64.img-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
    jammy:
      image: "{{local_qcow_url}}/jammy-server-cloudimg-amd64.img"
      checksum: "{{local_qcow_url}}/jammy-server-cloudimg-amd64.img-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
    noble:
      image: "{{local_qcow_url}}/noble-server-cloudimg-amd64.img"
      checksum: "{{local_qcow_url}}/noble-server-cloudimg-amd64.img-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
  rocky:
    "8":
      image: "{{local_qcow_url}}/Rocky-8-GenericCloud.latest.x86_64.qcow2"
      checksum: "{{local_qcow_url}}/Rocky-8-GenericCloud.latest.x86_64.qcow2-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
    "9":
      image: "{{local_qcow_url}}/Rocky-9-GenericCloud.latest.x86_64.qcow2"
      checksum: "{{local_qcow_url}}/Rocky-9-GenericCloud.latest.x86_64.qcow2-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
    "10":
      image: "{{local_qcow_url}}/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2"
      checksum: "{{local_qcow_url}}/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
  centos:
    9-stream:
      image: "{{local_qcow_url}}/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2"
      checksum: "{{local_qcow_url}}/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
    10-stream:
      image: "{{local_qcow_url}}/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2"
      checksum: "{{local_qcow_url}}/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2-checksum.CHECKSUMS"
      checksum_algorithm: "sha256"
  cirros:
    "0.5.3":
      # NOTE(Alex-Welsh): cirros_deploy_image_upstream_url has been deprecated in
      # favor of custom_deploy_image_upstream_url but is included for backwards
      # compatibility. It should be swapped permanently to
      # custom_deploy_image_upstream_url in the next major release.
      image: "{{ cirros_deploy_image_upstream_url | default({{local_qcow_url}} + '/cirros-0.5.3-x86_64-disk.img') }}"
      checksum: "{{local_qcow_url}}/cirros-0.5.3-x86_64-disk.img-checksum.CHECKSUMS"
      checksum_algorithm: "md5"