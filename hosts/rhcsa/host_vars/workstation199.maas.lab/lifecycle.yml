---
# lifecycle.ymnl
#
#   - Lifecycle Stages Definition - Overwrite default values
#     - 1) Enroll  - BMC Properties
#     - 2) Manage  - HW Propierties for Validation
#     - 3) Inspect - Steps
#     - 4) Clean   - Steps
#     - 5) Deploy  - PXE Particulars
#     - 6) Active  - hearbeat + Tenant networks
#     - 7) Delete  - Steps
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

#-----------------
# 1.- Enroll Stage
#-----------------
enroll:

   # 1.1.- Chassis Information
   name: "workstation199"
   uuid: "0f86778e-c7f2-4712-8cc8-3a5000ad7e69"
   properties:
     boot_mode: "uefi" 
     secure_boot: false
     cpu_arch: "x86_64"
     ram: "4096"
     disk_size: "32"
     cpus: "4"  

   # 1.2.- Network Devices Description    
   nics:
     - mac: "BC:24:11:3F:E9:A7"
       ipv4: "10.10.41.152" 
       network_interface: "noop" # No-Operation = No network Setup
       pxe: yes
     - mac: "BC:24:11:3F:D5:14"
       ipv4: "10.10.51.152"
       network_interface: "noop" # No-Operation = No network Setup

   # 1.3.- Out-of-Band BMC Information       
   driver: "redfish"
   driver_info:
     redfish_node_id: "104"

#-----------------
# 2.- Deploy Stage
#-----------------
deploy:   
   boot_interface:   "ipxe"
   deploy_interface: "ramdisk"
   os:
     name: "Ubuntu"
     version: "24.04"