# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "G1 - BOOSTRAP: 3.- Genesis Machine Ready"
  vars:
     g1_repo_local_folder:   "{{ g1_repo_os_path | dirname | realpath }}" 
  block:

    - name: "G1 - BOOSTRAP - 3.- Ready: 3.1) Find Repo Folders"
      ansible.builtin.find:
        paths: "{{ g1_repo_local_folder }}"
        file_type: directory
        patterns: "*"
        excludes: "*mnt*"
      register: g1_repo_folders_downloaded
    
    - name: "G1 - BOOSTRAP - 3.- Ready: 3.2) Set Ownership to Repo Folders"
      ansible.builtin.file:
        path: "{{ g1_repo_folder_download.path }}"
        owner: "{{ ansible_user | default('ironic') }}"
        group: ironic
        recurse: true
      loop: "{{ g1_repo_folders_downloaded.files | default([]) }}"
      loop_control:
        loop_var: "g1_repo_folder_download"
      when: 
        - g1_repo_folders_downloaded.matched > 0
    

