---
# genesis.bootstrap 3_ready/2_network.yml
#   - Setup Genesis Network Interfaces (Universal Multi-Distro Setup)
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

#---------------------------------------
#  1.- Network Configuration
#---------------------------------------
- name: "G1 - BOOTSTRAP - 3.- Ready : 2) Network - Setup"
  vars:  
    g1_os_family: "{{ ansible_facts['os_family'] | default('Debian') | lower }}"
  block:  
    - name: "G1 - BOOTSTRAP - 3.- Ready : 2.1) Include OS Specific Network Setup"
      ansible.builtin.include_tasks: "{{ g1_os_family }}_setup.yml"

#---------------------------------------
#   2.- Verifications
#---------------------------------------
- name: "G1 - BOOTSTRAP - 3.- Ready : 2) Network - Verification"
  block:  
    - name: "G1 - BOOTSTRAP - 3.- Ready : 2.2) Wait to recover the Connection"
      ansible.builtin.pause:
        seconds: 3
    
    - name: "G1 - BOOTSTRAP - 3.- Ready : 2.3) Capture Network Configuration"
      ansible.builtin.command: "ip a"
      register: genesis_network_result
      changed_when: false
    
    - name: "G1 - BOOTSTRAP - 3.- Ready : 2.4) Dump Network Configuration"
      ansible.builtin.debug:
        var: genesis_network_result.stdout_lines
