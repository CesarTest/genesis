- name: "T1 - PROXMOX_FACTS -1- Hypervisor: 4) Properties required by API Calls"
  block:

    #-----------------------------------------------------------------------
    # 1.- Node Name
    #-----------------------------------------------------------------------
    - name: "T1 - PROXMOX_FACTS -1- Hypervisor: 4.1) Proxmox Query Proxmox API node name dynamically"
      become: true
      ansible.builtin.shell: |
        pvesh get /nodes --output-format json | awk -F'\"node\":\"' '{print $2}' | awk -F'\"' '{print $1}'
      register: t1_pve_detected_node
      changed_when: false
      delegate_to: "{{ t1_hypervisor_node | default('localhost') }}"

    - name: "T1 - PROXMOX_FACTS -1- Hypervisor: 4.2) Proxmox Register node name as a runtime fact"
      ansible.builtin.set_fact:
        t1_hypervisor_api_hostname: "{{ genesis_hypervisor_api_hostname | default(t1_captured_hostname) }}"
      vars:
        t1_captured_hostname: "{{ t1_pve_detected_node.stdout | trim | default('pve') }}"

    #-----------------------------------------------------------------------
    # 2.- Internet Bridge
    #-----------------------------------------------------------------------
    - name: "T1 - PROXMOX_FACTS -1- Hypervisor: 4.2) Extract Internet Bridge"
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        ip route show default | awk '/default/ {print $5}'
      register: t1_pve_detected_bridge
      changed_when: false
      delegate_to: "{{ t1_hypervisor_node | default('localhost') }}"

    - name: "T1 - PROXMOX_FACTS -1- Hypervisor: 4.3) Set Internet Bridge Fact"
      set_fact:
        t1_proxmox_internet_bridge: "{{ t1_internet_bridge | default('vmbr0', true) }}"
      vars:
        t1_internet_bridge:  "{{ t1_pve_detected_bridge.stdout | trim | default('vmbr0', true) }}"

