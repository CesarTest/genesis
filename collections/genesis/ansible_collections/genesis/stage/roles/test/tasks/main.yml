---
# genesis.test main.yml
#   - Set Hypervisor Conditions
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

#-----------------------------------------------------------------------
# 1.- Create Emulation Environment on Hypervisor
#-----------------------------------------------------------------------
- name: "T1 - TEST : Create Emulation Environment on Hypervisor"
  block:
    - name: "T1 - TEST : Include Emulation Playbook Tasks"
      ansible.builtin.include_tasks: "emulation.yml"
  when:
    - t1_refresh_environment | default(false) | bool

#-----------------------------------------------------------------------
# 2.- Run Baremetal Certification Tests
#-----------------------------------------------------------------------
# 2.1.- Setup Instance
- name: "T1 - TEST : Baremetal Certification - Setup Instance"
  vars:
    t4_vm_state: "stop"
  block:
    - name: "T1 - TEST : Power Cycle Instance for Setup"
      ansible.builtin.include_tasks: "power_cycle.yml"
      when: "'fake' in (baremetal_power_cycle | default('manual', true))"
    - name: "T1 - TEST : Execute Genesis Setup Role"
      ansible.builtin.include_role: 
        name: "genesis.stage.setup"
  when:
    - not (t1_skip_tests | default(false) | bool)

# 2.2.- Deploy Instance
- name: "T1 - TEST : Baremetal Certification - Deploy Instance"
  vars:
    t4_vm_state: "start"
  block:
    - name: "T1 - TEST : Power Cycle Instance for Deployment"
      ansible.builtin.include_tasks: "power_cycle.yml"
      when: "'fake' in (baremetal_power_cycle | default('manual', true))"
    - name: "T1 - TEST : Execute Genesis Deploy Role"
      ansible.builtin.include_role: 
        name: "genesis.stage.deploy"
  when:
    - not (t1_skip_tests | default(false) | bool)

# 2.3.- Provision Instance - Documentation
- name: "T1 - TEST : Baremetal Certification - Provision Instance Documentation"
  vars:
    t4_vm_state: "start"
    ansible_python_interpreter: "/usr/bin/python3"
  block:
    - name: "T1 - TEST : Execute Genesis Provision Role for Documentation"
      ansible.builtin.include_role: 
        name: "genesis.stage.provision"
  when:
    - not (t1_skip_tests | default(false) | bool)
    - ( b6_software_profile is defined ) or ( b6_environment_profile is defined ) or ( t1_update_doc | default(false) | bool )
