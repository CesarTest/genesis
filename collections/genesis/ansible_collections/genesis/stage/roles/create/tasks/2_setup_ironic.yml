#---------------------------------------
# 1. Setup Keystone Client
#---------------------------------------     
- name: "G2 - CREATE - Setup Ironic: KEYSTONE CLIENT - Create Bifrost Cloud"
  ansible.builtin.include_role: 
    name: bifrost-keystone-client-config
  vars: 
    user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    clouds:
      bifrost:
        config_username: "{{ ironic.keystone.default_username }}"
        config_password: "{{ ironic.keystone.default_password }}"
        config_project_name: "baremetal"
        config_region_name: "{{ keystone.bootstrap.region_name }}"
        config_auth_url: "{{ keystone.bootstrap.public_url }}"
      bifrost-admin:
        config_username: "{{ keystone.bootstrap.username }}"
        config_password: "{{ keystone.bootstrap.password }}"
        config_project_name: "{{ keystone.bootstrap.project_name }}"
        config_region_name:  "{{ keystone.bootstrap.region_name }}"
        config_auth_url: "{{ keystone.bootstrap.public_url }}"
        config_system_scope: true

#---------------------------------------
# 2. Setup Ironic
#---------------------------------------            
- name: "G2 - CREATE - Setup Ironic: adjust Configurations Files"
  ansible.builtin.lineinfile:
    path:        "{{ replace.file   | default(omit)  }}"
    regexp:      "{{ replace.regexp | default(omit)  }}"
    line:        "{{ replace.line   | default(omit)  }}"
    insertafter: "{{ replace.insertafter | default(omit) }}" 
  loop: "{{ genesis_create_setup_ironic | default([]) }}"
  loop_control:
    loop_var: "replace"
  notify:
    - Restart Ironic  