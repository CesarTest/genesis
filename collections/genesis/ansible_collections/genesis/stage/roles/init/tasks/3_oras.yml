---
# genesis.init 3_oras.yml
#   - Expose ORAS Registry Repository of Images
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

- name: "G3 - INIT: 3.- Setup PXE-ORAS - Create OS Images Registry"
  vars:  

    # 1.- OS Particulars
    g3_image_os_distro:         "{{ g3_image.distribution | default('RedHat') | lower }}"
    g3_image_os_distro_version: "{{ g3_image.distribution_version | default('8') }}"
    g3_deploy_os_path:   "{{ g3_repo_os_path | realpath }}/{{ g3_image_os_distro }}/{{ g3_image_os_distro_version }}"
    g3_deploy_tftp_path:   "{{ g3_tftp_path | realpath }}/{{ g3_image_os_distro }}/{{ g3_image_os_distro_version }}"
    g3_deploy_mount_path:  "{{ g3_repo_mount_path | realpath }}/{{ g3_image_os_distro }}/{{ g3_image_os_distro_version }}"

    # 2.- Image Name Default Values
    g3_deploy_image_default_name: "{{ g3_image.image | default('') | basename }}"
    g3_deploy_image_default_ext:  "{{ g3_deploy_image_default_name | ansible.builtin.splitext | last }}"
    g3_default_os_image_name:     "{{ genesis_default_os_image_name[g3_deploy_image_default_ext] |  default(g3_deploy_image_default_name) }}" 
    g3_deploy_image_name: "{{ g3_image.os_image_name | default(g3_default_os_image_name) }}" 

    # 3.- Mount Points
    g3_mount_path: "{{ g3_image.mount_path | default(g3_mount_repo_path) | default('/mnt') | realpath }}"      

  block:
    - name: "G3 - INIT: Setup PXE-ORAS: Expose Image Repository"
      ansible.builtin.include_tasks: "3_oras/1_upload.yml"