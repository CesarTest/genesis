---
# genesis.setup 1_enroll/1_clean_ironic.yml
#   - Clean Instance Info:
#
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

- block:

    #--------------------
    # Clean Instance files via Ansible
    #--------------------
    # ==> 3.1. Symbolink Links Removal
    - name: "B4 SETUP - 1.- Enroll: 3.2) Detect symlinks pointing to this instance"
      ansible.builtin.find:
        paths:
          - "{{ genesis_http_path | default('/var/lib/ironic/httpboot') }}"
        file_type: "link"          
        recurse: yes                   
      register: b4_detected_symlinks   

    - name: "B4 SETUP - 1.- Enroll: 3.3) Gather deep stats of found links to extract targets"
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ b4_detected_symlinks.files | default([]) }}"
      register: b4_links_stats
    
    - name: "B4 INFRA - PURGE: Remove detected symlinks pointing to instance information UUID"
      ansible.builtin.file:
        path: "{{ b4_symlink.stat.path }}" 
        state: absent
      become: yes	  
      loop: "{{ b4_links_stats.results | default([]) }}"
      loop_control:
        loop_var: b4_symlink
      when: 
        - b4_symlink.stat.islnk is defined 
        - b4_symlink.stat.islnk
        - b4_symlink.stat.lnk_source is defined
        - b4_symlink.stat.lnk_source is not none
        - b4_symlink.stat.lnk_source is string
        - b4_symlink.stat.lnk_source is not mapping
        - b4_symlink.stat.lnk_source | length > 0
        - uuid in b4_symlink.stat.lnk_source
  
    # ==> 3.2. Instance Path
    - name: "B4 SETUP - 1.- Enroll: 3.4)  Wipe the physical instance UUID directory cache"
      ansible.builtin.file:
        path: "{{ genesis_http_path | default('/var/lib/ironic/httpboot') }}/{{ uuid }}"
        state: absent
      become: yes	  
      vars:
        b4_instance_path: "{{ genesis_http_path | default('/var/lib/ironic/httpboot') }}/{{ uuid | default('') }}"

  rescue:

    #--------------------
    # Clean Instance files via SHELL
    #--------------------

    - name: "RESCUE - PURGE: Limpieza rápida de symlinks y directorio caché usando Shell"
      ansible.builtin.shell: |
        # 1.- Borrar symlinks recursivos que apunten al UUID
        find "{{ genesis_http_path | default('/var/lib/ironic/httpboot') }}" -type l -exec sh -c 'readlink -f "$0" | grep -q "{{ uuid }}"' {} \; -delete

        # 2.- Borrar el directorio caché del UUID
        rm -rf "{{ genesis_http_path | default('/var/lib/ironic/httpboot') }}/{{ uuid }}"
      become: yes

  when:
    - uuid is defined
    - uuid is not none
    - uuid is string
    - uuid is not mapping
    - uuid | length > 0
