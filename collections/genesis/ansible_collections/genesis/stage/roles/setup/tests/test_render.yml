---
# SPDX-License-Identifier: Apache-2.0
# Blueprint test module to analyze cross-variable loading between lifecycle configurations and engine parameters

- name: "GENESIS CORE - Internal Role Template Rendering Test"
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    # -------------------------------------------------------------------------
    # Core Engine Core Directory Blueprints
    # -------------------------------------------------------------------------
    genesis_repo_path:   "{{ playbook_dir | dirname | dirname | dirname }}/repo"
    genesis_hosts_path:  "{{ playbook_dir | dirname  | dirname | dirname }}/hosts"
    genesis_target_path: "{{ genesis_hosts_path | realpath }}/target"
    genesis_env_path: "{{ genesis_hosts_path | realpath }}/rhcsa"
    genesis_baremetal_vars: "{{ lookup('env', 'BIFROST_INVENTORY_SOURCE') or genesis_default_inventory_source }}"
    ironic_http_path:   "{{ http_bootpath | default('/var/lib/ironic/httpboot') }}"
    genesis_node_hostvars: "{{ genesis_env_path }}/host_vars/servera199.maas.lab"

  tasks:
    # -------------------------------------------------------------------------
    # Safe Data Aggregation Layer
    # -------------------------------------------------------------------------
    - name: "Aggregate dynamic inventory host variables if folder path is reachable"
      ansible.builtin.include_vars:
        dir: "../defaults"
        extensions: ['yml', 'yaml']
        ignore_unknown_extensions: true

    - name: "Aggregate dynamic inventory host variables if folder path is reachable"
      ansible.builtin.include_vars:
        dir: "{{ genesis_node_hostvars }}"
        extensions: ['yml', 'yaml']
        ignore_unknown_extensions: true

    # -------------------------------------------------------------------------
    # Verification and Validation Output
    # -------------------------------------------------------------------------
    - name: "Execution Status"
      ansible.builtin.debug:
        msg:
          - "{{ genesis_node_hostvars | default('Nono') }}"
          - "=========================================================="
          - "               GENESIS ENGINE VAR INJECTION LOG           "
          - "=========================================================="
          - "OS Engine Path Reference:    {{ b4_repo_os_path | default('NOT_LOADED_ERR') }}"
          - "Node Lifecycle Manifesto:    {{ b4_node_os_manifesto | default('NOT_LOADED_ERR') }}"
          - "=========================================================="


    - name: "Render user-data template into the flat-repo webserver directory"
      ansible.builtin.template:
        src: "../templates/manifesto/casper/user-data.j2"
        dest: "result.txt"
        mode: '0644'
      vars:
         b4_os_manifesto_templates: "{{ b4_node_os_manifesto['template'] | default([]) }}"
         b4_node_manifesto_files:   "{{ b4_node_os_manifesto['file']     | default([]) }}"
         b4_node_default_manifesto_file: "{{ b4_repo_manifesto_path }}/{{ b4_node_name }}"
         j2_profile:    "{{ b4_node_os_profile               | default('None') }}"  
         j2_input:      "{{ b4_node_os_manifesto['defaults'] | default({}) }}"
         j2_os_profiles:     "{{ b4_node_os_manifesto['os_version']  | default({}) }}"
         j2_system_profiles: "{{ b4_node_os_manifesto['system'] | default({}) }}"	
         j2_node_profiles:   "{{ b4_node_os_manifesto['node'] | default({}) }}"


