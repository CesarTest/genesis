  role_name: genesis.stage.provision
  description: Install Software Profile in Two Stages (Golden Image Replication)
  license: Apache-2.0
  company: none
  min_ansible_version: "2.10"

  platforms:
    - name: Ubuntu
      versions:
        - "24.04"  

  galaxy_tags:
