- name: "B6 - PROVISION DOC NODE: Certification Testing Documentation Server"
  become: true
  block:

    - name: "B6 - PROVISION : 1) Environment Components that need a Machine Reboot (drivers, network, mac)"
      ansible.builtin.include_tasks: "component.yml"
      loop: "{{ b6_environment_profile | default([]) }}"
      loop_control:
        loop_var: "b6_component_role"    

    - name: "B6 - PROVISION : 2) Software Components that just need Services Restart"
      ansible.builtin.include_tasks: "component.yml"
      loop: "{{ b6_software_profile | default([]) }}"
      loop_control:
        loop_var: "b6_component_role"  

  rescue:

    - name: "B6 - PROVISION: [RESCUE] Print non-blocking provisioning failure alert message"
      ansible.builtin.debug:
        msg: |
          WARNING ALERT: An exception has been detected during the B6 provisioning phase on host {{ inventory_hostname }}.
          Execution will CONTINUE in non-blocking mode. Please review previous tasks to audit potential inconsistencies.

    - name: "B6 - PROVISION DOC NODE: [RESCUE] Clear host error state to avoid interrupting execution"
      ansible.builtin.meta: clear_host_errors