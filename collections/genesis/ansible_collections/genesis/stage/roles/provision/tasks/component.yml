- name: "B6 - PROVISION : Install Components"
  block: 
 
   #---------------------------------------
   # 1. Install Component
   #---------------------------------------  
   - name: "B6 - PROVISION : Trace Current Component"
     ansible.builtin.debug:
       msg: "{{ dump_text.split('\n') }}"
     vars:
       dump_text: |
         => COMPONENT ROLE:
         - b6_component_role.name:      [{{ b6_component_role.name      | default('b6_component_role.name not found') }}]
         - b6_component_role.condition: [{{ b6_component_role.condition | default('b6_component_role.condition not found') }}]
         -------------------------------------
   
   - name: "B6 - PROVISION : Install Component"
     ansible.builtin.include_role: 
       name: "{{ b6_component_role.name }}"
     when: 
       - b6_component_role.name is defined
       - b6_component_role.condition | default(true) | bool