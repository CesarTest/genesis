- name: "[genesis.service.grav] - GRAV -4- Content: Create Site Content"
  vars: 
    site_upload_dest: "{{ site_work_path|default('') }}/{{ site_content.dest|default('') }}"
    grav_emergency_shell:
      # 1. Purge
      - |
        if [ "{{ site_content.refresh | default(false) | bool }}" = "True" ]; then
          echo '==> [RESCUE] 1) Purging old target path... <=='
          rm -rf '{{ site_upload_dest | default('') }}'
        fi

      # 2. Folder
      - |
        if [ -n "{{ site_content.remote_src | default('') }}" ]; then
          echo '==> [RESCUE] 2) Deploying Repository Content Symlink... <=='
          ln -sfn '{{ site_content.remote_src }}' '{{ site_upload_dest | default('/var/www/html/grav/user/pages') }}'
          chown -h {{ apache_user | default('apache') }}:{{ apache_group | default('apache') }} '{{ site_upload_dest | default('/var/www/html/grav/user/pages') }}'
        else
          echo '==> [RESCUE] 2) Creating target physical directory and enforcing ownership... <=='
          mkdir -p '{{ site_upload_dest | default('/var/www/html/grav/user/pages') }}'
          chown -R {{ apache_user | default('apache') }}:{{ apache_group | default('apache') }} '{{ site_upload_dest | default('/var/www/html/grav/user/pages') }}'
          chmod -R 775 '{{ site_upload_dest | default('/var/www/html/grav/user/pages') }}'
        fi

  block:

    # -----------------------------------------------------
    # 1.- Remove Old Contents
    # -----------------------------------------------------
    - name: "[genesis.service.grav] - GRAV -4- Content: 1) Delete Old Contents"
      ansible.builtin.file:
        path: "{{ site_upload_dest | default('') }}"
        state: absent
      when:
        - site_content.refresh is defined
        - site_content.refresh is not none
        - site_content.refresh | bool is true

    # -----------------------------------------------------
    # 2.- Create Destination Contents Path
    # -----------------------------------------------------
    - name: "[genesis.service.grav] - GRAV -4- Content: 2a) Deploy Repository Content Symlink"
      ansible.builtin.file:
        src: "{{ site_content.remote_src }}"
        dest: "{{ site_upload_dest }}"
        state: link
        force: yes
        follow: false
        owner: "{{ apache_user | default('apache') }}"
        group: "{{ apache_group | default('apache') }}"
      when: site_content.remote_src is defined and site_content.remote_src | length > 0
   
    - name: "[genesis.service.grav] - GRAV -4- Content: 2b) Create Physical Local Directory"
      ansible.builtin.file:
        path: "{{ site_upload_dest }}"
        state: directory
        recurse: yes
        owner: "{{ apache_user | default('apache') }}"
        group: "{{ apache_group | default('apache') }}"
      when: site_content.remote_src is not defined or site_content.remote_src | length == 0
  

  rescue:

    # -----------------------------------------------------
    # 3. Perimeter Fallback: Executes the string loop cleanly
    # -----------------------------------------------------
    - name: "[genesis.service.grav] - GRAV -4- Content: Rescue: Trigger System Emergency Shell Contingency Mesh"
      ansible.builtin.shell:
        cmd: "{{ grav_cmd }}"
      loop: "{{ grav_emergency_shell | default([], true) }}"
      loop_control:
        loop_var: "grav_cmd"
        label: "Executing Fallback stage"
      failed_when: false

  always: 

    # -----------------------------------------------------
    # 4.- Populate Destination Contents Path   
    # -----------------------------------------------------
    - name: "[genesis.service.grav] - GRAV -4- Content: 3) Upload Physical Local Content"
      ansible.builtin.copy:
        src: "{{ site_content.src }}"
        dest: "{{ site_upload_dest }}/"
        owner: "{{ apache_user | default('apache') }}"
        group: "{{ apache_group | default('apache') }}"
        force: "{{ site_content.force | default(true) }}"
      when: site_content.remote_src is not defined or site_content.remote_src | length == 0  