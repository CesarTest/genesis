---
# genesis.service.grav package/2_tarball.yml
#   - Dynamic Package Deployment and Lifecycle Management (API Synced)
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "[genesis.service.grav] - GRAV -2- Package: 2) Tarball: Main Orchestration Block"
  vars:
    # 1. Parámetros de extracción consolidados para mitigar filtros inline repetitivos
    grav_target_src_basename: "{{ (grav_package.src | default('')) | basename }}"
    grav_calculated_tmp_dir: "{{ grav_package.tmp | default('/tmp/grav', true) }}"
    grav_calculated_tmp_file: "{{ grav_calculated_tmp_dir }}/{{ grav_target_src_basename }}"
    grav_calculated_dest_dir: "{{ grav_package.dest | default(grav_work_path) | default('/tmp/grav', true) }}"

    # 2. Comandos de contingencia en Bash puro estructurados localmente
    grav_tarball_emergency_commands:
      - "echo 'WARNING ALERT: Native copy/unarchive module failed. Triggering raw shell rescue...'"
      - "mkdir -p {{ grav_calculated_dest_dir }}"
      - "tar -xzf {{ grav_calculated_tmp_file }} -C {{ grav_calculated_dest_dir }} 2>/dev/null || unzip -o {{ grav_calculated_tmp_file }} -d {{ grav_calculated_dest_dir }} 2>/dev/null || cp -rf {{ grav_calculated_tmp_file }} {{ grav_calculated_dest_dir }}"
      - "chown -R {{ apache_user | default('apache', true) }}:{{ apache_group | default('apache', true) }} {{ grav_calculated_dest_dir }}"

  block:

    # ---------------------------------
    #  1.- Upload File 
    # ---------------------------------
    - name: "[genesis.service.grav] - GRAV -2- Package: 2.1) Tarball: Upload Package : |{{ grav_package.src | default('Empty') }}| -> |{{ grav_calculated_tmp_file }}|"
      ansible.builtin.copy:
        src:  "{{ grav_package.src | default('') }}"
        dest: "{{ grav_calculated_tmp_file }}" 
        owner: "{{ apache_user | default('root', true) }}"
        group: "{{ apache_group | default('root', true) }}"
        mode: "0644"

    # ---------------------------------
    #  2.- Unzip
    # ---------------------------------
    - name: "[genesis.service.grav] - GRAV -2- Package: 2.2) Tarball: Unarchive Package on Remote Machine"
      ansible.builtin.unarchive:
        src:   "{{ grav_tarball.src }}"
        dest:  "{{ grav_tarball.dest }}"
        owner: "{{ grav_tarball.owner }}"
        group: "{{ grav_tarball.group }}"  
        remote_src: true
      loop:
        - src:   "{{ grav_calculated_tmp_file }}"
          dest:  "{{ grav_calculated_dest_dir }}"
          owner: "{{ apache_user | default('apache', true) }}"
          group: "{{ apache_group | default('apache', true) }}"
      loop_control:
        loop_var: "grav_tarball"    
      when:
        - "grav_package.isTarball is not defined"

  rescue:

    - name: "[genesis.service.grav] - GRAV -2- Package: 2.3) Tarball: [RESCUE] Execute raw shell recovery sequence from block vars"
      ansible.builtin.shell: "{{ grav_emergency_command }}"
      loop: "{{ grav_tarball_emergency_commands }}"
      loop_control:
        loop_var: "grav_emergency_command"
      failed_when: false

    - name: "[genesis.service.grav] - GRAV -2- Package: 2.4) Tarball: [RESCUE] Print non-blocking failure alert message"
      ansible.builtin.debug:
        msg: |
          WARNING ALERT: Tarball deployment tasks experienced an exception on host {{ inventory_hostname }}.
          Fallback extraction was executed via shell. Execution will CONTINUE in non-blocking mode.

    - name: "[genesis.service.grav] - GRAV -2- Package: 2.5) Tarball: [RESCUE] Clear host error state to avoid interrupting execution"
      ansible.builtin.meta: clear_host_errors

  when:
    - "grav_package.src is defined"
    - "grav_package.src is not none"
    - "grav_package.src is string"
