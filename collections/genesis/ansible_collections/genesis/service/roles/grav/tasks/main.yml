---
# genesis.service.grav main
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#
- name: "[genesis.service.grav] - GRAV: MaaS Documentation Server"
  become: true
  block:


    #---------------------------------
    #  0.- Refresh Facts
    #---------------------------------
    - name: "[genesis.service.grav] - GRAV: 0) Refresh facts"
      ansible.builtin.setup:

    #---------------------------------
    #  1.- Deploy Grav Packages
    #---------------------------------
    - name: "[genesis.service.grav] - GRAV: 1) Deploy Package into Web Server"
      ansible.builtin.include_tasks: "1_package.yml"
      loop: "{{ grav_deploy | default([]) }}"
      loop_control:
         loop_var: "grav_package"

    #---------------------------------
    #  2.- Install Grav Skeleton
    #---------------------------------
    - name: "[genesis.service.grav] - GRAV: 2) Finalize environment deploying Grav CMS instance"
      ansible.builtin.include_tasks: "2_grav.yml"

    #---------------------------------
    #  3.- Create Sites
    #---------------------------------
    - name: "[genesis.service.grav] - GRAV 3) Create Sites"
      vars:
         root_defined: "{{ (grav_site.root is defined) and ( grav_site.root is not none )   }}"
         isRoot:       "{{ (root_defined is true) and (grav_site.root is true) }}"
         capture_work_path: |
           {%- if (isRoot|bool is true) -%}{{grav_work_path }}/user
           {%- else -%}{{ grav_work_path }}/user/env/{{ grav_site.path }}
           {%- endif -%}
         site_work_path:    "{{ capture_work_path | trim | replace('\n', '') }}"
         site_paths:
            accounts: "{{ site_work_path}}/themes"
            themes:  "{{ site_work_path}}/themes"
            pages:   "{{ site_work_path }}/pages"
            plugins: "{{ site_work_path }}/plugins"
            config: "{{ site_work_path }}/config"    
    
      ansible.builtin.include_tasks: "3_site.yml"
      loop: "{{ grav_sites | default([]) }}"
      loop_control:
          loop_var: "grav_site"
      when: "(isMultisite is true) or (isRoot is true)"


    #---------------------------------
    #  4.- Validate Grav Installation
    #---------------------------------
    - name: "[genesis.service.grav] - GRAV: 4) Finalize environment deploying Grav CMS instance"
      ansible.builtin.include_tasks: "4_ready.yml"

  rescue:

    - name: "[genesis.service.grav] - GRAV: [RESCUE] 3) Print non-blocking provisioning failure alert message"
      ansible.builtin.debug:
        msg: |
          WARNING ALERT: An exception has been detected during the B6 provisioning phase on host {{ inventory_hostname }}.
          Execution will CONTINUE in non-blocking mode. Please review previous tasks to audit potential inconsistencies.

    - name: "[genesis.service.grav] - GRAV: [RESCUE] Clear host error state to avoid interrupting execution"
      ansible.builtin.meta: clear_host_errors