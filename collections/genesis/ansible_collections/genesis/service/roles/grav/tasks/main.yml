- name: "[genesis.service.grav] - GRAV: MaaS Documentation Server"
  become: true
  block:

    - name: "[genesis.service.grav] - GRAV: 0) Refresh facts"
      ansible.builtin.setup:

    - name: "[genesis.service.grav] - GRAV: 1) Deploy Package into Web Server"
      ansible.builtin.include_tasks: "1_package.yml"
      loop: "{{ grav_deploy | default([]) }}"
      loop_control:
         loop_var: "grav_package"

    - name: "[genesis.service.grav] - GRAV: 2) Finalize environment deploying Grav CMS instance"
      ansible.builtin.include_tasks: "2_grav.yml"

    - name: "[genesis.service.grav] - GRAV: 2) Finalize environment deploying Grav CMS instance"
      ansible.builtin.include_tasks: "3_ready.yml"

  rescue:

    - name: "[genesis.service.grav] - GRAV: [RESCUE] 3) Print non-blocking provisioning failure alert message"
      ansible.builtin.debug:
        msg: |
          WARNING ALERT: An exception has been detected during the B6 provisioning phase on host {{ inventory_hostname }}.
          Execution will CONTINUE in non-blocking mode. Please review previous tasks to audit potential inconsistencies.

    - name: "[genesis.service.grav] - GRAV: [RESCUE] Clear host error state to avoid interrupting execution"
      ansible.builtin.meta: clear_host_errors