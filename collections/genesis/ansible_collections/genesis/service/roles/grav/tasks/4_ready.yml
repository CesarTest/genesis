- name: "[genesis.service.grav] - GRAV -3- Ready: Core Stack Finalization"
  vars:
    apache_service_name: "{{ (ansible_os_family | default('Debian') == 'Debian') | ternary('apache2', 'httpd') }}"
    apache_port:         "{{ web_server_port | default('80') | int }}"
  block:

    - name: "[genesis.service.grav] - GRAV -4- Ready: 1) Ensure Apache is enabled and restarted"
      ansible.builtin.service:
        name: "{{ apache_service_name }}"
        state: restarted
        enabled: yes

    - name: "[genesis.service.grav] - GRAV -4- Ready: 2) Verify Web Port Availability"
      ansible.builtin.wait_for:
        port: "{{ apache_port }}"
        delay: 2
        timeout: 15
        msg: "Apache failed to respond on port {{ apache_port }} after restart."
