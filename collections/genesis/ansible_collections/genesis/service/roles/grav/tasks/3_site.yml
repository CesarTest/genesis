---
# genesis.service.grav 3_site.yml
#   - Prepare Documentation Node
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "[genesis.service.grav] - GRAV -3- Site: Create Sites"
  vars:
    multisite_defined: "{{ (grav_multisite is defined) and ( grav_multisite is not none )   }}"
    multisite_none:    "{{ (multisite_defined is true) and (grav_multisite is string)       }}"
    multisite_type:    "{{ (multisite_none is true)    and (grav_mulstisite is not mapping) }}"
    isMultisite:       "{{ (multisite_type is true)    and (grav_multisite|length > 0)      }}" 

  block:

    - name: "[genesis.service.grav] - GRAV -3- Site: 1) Folders"
      ansible.builtin.include_tasks: "site/1_folder.yml"
 
    - name: "[genesis.service.grav] - GRAV -3- Site: 2) Upload Contents"
      ansible.builtin.include_tasks: "site/2_content.yml"
      loop: "{{ grav_site.contents | default([]) }}"
      loop_control:
        loop_var: "site_content"
      vars:
        site_upload_dest: "{{ site_work_path|default('') }}/{{ site_content.dest|default('') }}"
      when:
        - "(isMultisite is true) or (isRoot is true)"

    - name: "[genesis.service.grav] - GRAV -3- Site: 3) Setup Site"
      ansible.builtin.include_tasks: "site/3_config.yml"

  rescue:

    - name: "[genesis.service.grav] - GRAV -2- Grav: ERROR - PREPARING GRAV INSTALLATION"
      debug:
        msg:
          - "Missing Definitions: |grav_deploy|"
          - "{{ grav_deploy | default('Empty Value')}}"