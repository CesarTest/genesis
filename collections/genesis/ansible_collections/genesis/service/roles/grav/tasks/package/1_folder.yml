---
# genesis.service.grav package/1_folder.yml
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0
#

- name: "[genesis.service.grav] - GRAV -1- Package: 1) Folder: Main Orchestration Block"
  vars:
    grav_package_emergency_commands:
      - "echo 'WARNING ALERT: Native file module failed. Triggering raw shell rescue...'"
      - "rm -rf {{ grav_package.dest | default('/tmp/grav_failed') }}"
      - "mkdir -p {{ grav_package.dest | default('/tmp/grav') }} {{ grav_package.tmp | default('/tmp/grav_tmp') }}"
      - "chown -R {{ grav_package.owner | default(apache_user) | default('apache') }}:{{ grav_package.group | default(apache_group) | default('apache') }} {{ grav_package.dest | default('/tmp/grav') }}"

  block:

    - name: "[genesis.service.grav] - GRAV -1- Package: 1.1) Folder: Delete Old Contents"
      ansible.builtin.file:
        path: "{{ grav_package.dest | default('') }}"
        state: "absent"
      when:
        - "grav_package.refresh is defined"
        - "grav_package.refresh is not none"
        - "grav_package.refresh|bool is true"

    - name: "[genesis.service.grav] - GRAV -1- Package: 1.2) Folder: Create Package Folder |{{ grav_package.dest | default('Empty') }}|"
      vars:
        grav_pkg_folders:
          - path:  "{{ grav_package.dest  | default('/tmp/grav') }}"
            owner: "{{ grav_package.owner | default(apache_user) | default('apache') }}"
            group: "{{ grav_package.group | default(apache_group) | default('apache') }}"
            mode:  "{{ grav_package.folder_mode | default(omit) }}"
          - path:  "{{ grav_package.tmp   | default('/tmp/grav') }}"
            owner: "{{ apache_user   | default('apache') }}"
            group: "{{ apache_group  | default('apache') }}"
      ansible.builtin.file:
        path: "{{ grav_pkg_dir.path | default(omit) }}"
        state: "directory"
        owner: "{{ grav_pkg_dir.owner | default(omit) }}"
        group: "{{ grav_pkg_dir.group | default(omit) }}"
        mode: "{{ grav_pkg_dir.mode | default(omit) }}"
      loop: "{{ grav_pkg_folders | default([]) }}"
      loop_control:
        loop_var: "grav_pkg_dir"
      when:
        - "grav_pkg_dir.path is defined"
        - "grav_pkg_dir.path is not none"
        - "grav_pkg_dir.path is string"

  rescue:

    - name: "[genesis.service.grav] - GRAV -1- Package: 1.3) Folder: [RESCUE] Execute raw shell recovery sequence from block vars"
      ansible.builtin.shell: "{{ grav_emergency_command | default('id') }}"
      loop: "{{ grav_package_emergency_commands | default([]) }}"
      loop_control:
        loop_var: "grav_emergency_command"
      failed_when: false

    - name: "[genesis.service.grav] - GRAV -1- Package: 1.4) Folder: [RESCUE] Print non-blocking failure alert message"
      ansible.builtin.debug:
        msg: |
          WARNING ALERT: Package folder tasks experienced an exception on host {{ inventory_hostname }}.
          Recovery script was executed via shell. Execution will CONTINUE in non-blocking mode.

    - name: "[genesis.service.grav] - GRAV -1- Package: 1.5) Folder: [RESCUE] Clear host error state to avoid interrupting execution"
      ansible.builtin.meta: clear_host_errors

  when:
    - "grav_package.dest is defined"
    - "grav_package.dest is not none"
    - "grav_package.dest is string"