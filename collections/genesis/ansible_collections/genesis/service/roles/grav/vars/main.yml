#########################################################
#                    WEB SERVER
#########################################################
# 1.- Server Properties
server_domain: "{{ web_server_domain | default('genesis.lab', true) }}"
apache_logs: "{{ web_apache_logs | default('/var/log/httpd', true) }}"
apache_work_path: "{{ web_work_path | default('/var/www/html/maas',true) }}"

# 2.- Server Paths
grav_repos: "{{ genesis_airgap_repos | default(genesis_default_repos) }}" 
grav_repo_os_path: "{{ genesis_repo_path | realpath }}/{{ g1_repos['os'] | default('os') }}"
grav_repo_dib_path: "{{ genesis_repo_path | realpath }}/{{ g1_repos['cloud'] | default('dib')}}"
grav_repo_ipa_path: "{{ genesis_repo_path | realpath }}/{{ g1_repos['ipa'] | default('dib/files')}}"
grav_repo_openstack_path: "{{ genesis_repo_path | realpath }}/{{ g1_repos['components'] | default('dib/files')}}"
grav_tftp_path: "{{ genesis_tftp_path | default(ironic_tftp_master_path) | default('/var/lib/tftpboot') | realpath }}"
grav_http_path: "{{ genesis_http_path | default(http_boot_folder) | default('/var/lib/ironic/httpboot') | realpath }}"
grav_local_checksum_url: "file://{{ genesis_repo_path | realpath }}/checksum"
grav_repo_sylva_path: "{{ genesis_repo_path | realpath }}/{{ g1_repos['sylva'] | default('sylva') }}"
grav_repo_sylva_oci_path:  "{{ genesis_repo_path | realpath }}/{{ g1_repos['sylva'] | default('sylva/oci') }}"
grav_repo_doc_path: "{{ genesis_repo_path | realpath }}/{{ g1_repos['doc'] | default('doc') }}"
grav_repo_doc_content_path: "{{ grav_repo_doc_path }}/content"

#########################################################
#                  WEB CONTENTS DEFINITIONS
#########################################################

# -------------------------------------------------------
# 1.- Grav Installation
# -------------------------------------------------------
# 1.1.- Install GRAV
grav_work_path:  "{{ doc_grav_work_path  | default(apache_work_path) }}"
grav_users_default_workpath: "{{ grav_work_path }}/user/accounts" 
grav_users_path: "{{ doc_grav_users_path | default(grav_users_default_workpath, true) }}" 
doc_default_url: "{{ inventory_hostname_short }}.maas.{{ server_domain | default('genesis.lab') }}"
doc_default_gitea_url: "127.0.0.1:{{ gitea_port | default('3000') }}"
grav_site_url:   "{{ doc_grav_url | default(doc_default_url, true) }}"
grav_gitea_url:  "{{ doc_gitea_url | default(doc_default_gitea_url, true) }}"
grav_gitea_repo_url: "http://{{ grav_gitea_url }}/{{ gitea_user | default('genesis') }}/{{ gitea_repo | default('maas.git') }}"

# 1.2.- Grav Customizations (password=Training_2025)
doc_default_users:
  - username: "cdg"
    fullname: "Cesar Delgado"
    adminuser: yes
    hashed_password: "$2y$10$B7eEPyeiWQe9X3nyEnSCU.F03mOhp7KDP2BvBtvNFH6SVBauT5C.C"
    email: "cesar.delgado.gonzalez@alumnos.upm.es"
    title: "Administrador"
grav_users: "{{ doc_grav_users | default(doc_default_users, true) }}"

# 1.3.- Grav Deploy
doc_default_deploy:
  - name: "Learn2 Skeleton"
    src: "{{ grav_repo_doc_path }}/learn2-skeleton.zip"
    template:
      dest: "/etc/hosts"
      content: |
        {{ hostvars[groups['target'][0]]['ansible_host'] | default('127.0.0.1') }} seed.genesis.lab
        {{ ansible_host | default('127.0.0.1') }} {{ grav_site_url }}

  - name: "Learn4 Theme"
    src: "{{ grav_repo_doc_path }}/learn4-theme.zip"
    dest: "{{ grav_work_path | default('/tmp') }}/user/themes"
    rename: "learn4"
    original: "grav-theme-learn4-master"
    template:
      dest: "{{ grav_work_path | default('/tmp') }}/user/config/themes/maas.yaml"
      content: |
         enabled: true
         top_level_version: false
         github:
           position: top
         default_taxonomy_category: docs
         streams:
            schemes:
               theme:
                  type: ReadOnlyStream
                  prefixes: 
                    '': [user/themes/maas,user/themes/learn4]
         style: default
         hide_site_title: false
         enable_doc_versioning: false

  - name: "Quark Theme"
    src: "{{ grav_repo_doc_path }}/quark.zip"
    dest: "{{ grav_work_path | default('/tmp') }}/user/themes"
    rename: "quark"
    original: "grav-theme-quark-master"
    template:
      dest: "{{ grav_work_path | default('/tmp') }}/user/config/themes/labs.yaml"
      content: |
        enabled: true                 # Enable the theme
        production-mode: true         # In production mode, only minified CSS is used. When disabled, nested CSS with sourcemaps are enabled
        grid-size: grid-lg            # The max-width of the theme, options include: `grid-xl`, `grid-lg`, and `grid-md`
        header-fixed: true            # Cause the header to be fixed at the top of the browser
        header-animated: true         # Allows the fixed header to resize to a smaller header when scrolled
        header-dark: true             # Inverts the text/logo to work better on dark backgrounds
        header-transparent: true      # Allows the fixed header to be transparent over the page
        sticky-footer: false          # Causes the footer to be sticky at the bottom of the page
        blog-page: '/blog'            # The route to the blog listing page, useful for a blog style layout with sidebar
        custom_logo:                  # A custom logo rather than the default (see below)  
        custom_logo_mobile:           # A custom logo to use for mobile navigation'

  - name: "Quick Menu Plugin"
    src: "{{ grav_repo_doc_path }}/page-toc.zip"
    dest: "{{ grav_work_path | default('/tmp') }}/user/plugins"
    rename: "page-toc"
    original: "grav-plugin-page-toc-master"
    template:
      dest: "{{ grav_work_path | default('/tmp') }}/user/config/plugins/page-toc.yaml"
      content: |
        enabled: true               # Plugin enabled
        include_css: true           # Include CSS
        active: true                # Anchor IDs processed and generated for all pages
        templates:                  # Templates for which anchors should be generated if default is disabled
        start: 1                    # Start header tag level (1 = h1) for TOC
        depth: 6                    # Depth from start (2 = 2 levels deep) for TOC
        hclass:                     # Custom Header TOC styling classes
        anchors:                    # Anchor configuration
          start: 1                  # Start header tag level (1 = h1)
          depth: 6                  # Depth from start (2 = 2 levels deep)
          link: true                # Enabled auto-generation of clickable link with fragment
          aria: Anchor              # Aria label to use
          class:                    # Custom Header anchor styling classes
          icon: '#'                 # Icon to use, can be a symbol, emoji, ascii etc.
          position: after           # Position to put the anchor, `before|after`
          copy_to_clipboard: true   # Copy to clipboard functionality (coming soon)
          slug_maxlen: 25           # Max length of slugs used for anchors
          slug_prefix:              # A prefix used in front of generated slugs              
grav_deploy: "{{ doc_grav_deploy | default(doc_default_deploy, true) }}"


# 2.4.- Grav Sites
grav_multisite: "{{ doc_grav_multisite | default('setup_subdirectory', true) }}"
grav_multisite_path: "{{ doc_grav_multisite_path | default(['maas'], true) }}"

doc_default_sites:
  - title: "MaaS Labs"
    path: "home"
    root: yes
    
    contents:
      - src: "home/themes/labs"
        dest: "themes/labs"
        refresh: yes 
      - src: "{{ grav_multisite_path[0] | default('genesis') }}/themes/maas"
        dest: "themes/maas"
        refresh: yes         
      - src: "{{ grav_repo_doc_content_path }}/home/pages"
        dest: "pages"
        refresh: yes        
    
    configs:
      - file: "../.htaccess"
        regexp: "RewriteBase"
        line: "RewriteBase /"      
      - file: "config/system.yaml" 
        regexp: 'theme:' 
        line: '  theme: "labs"'
      - file: "config/site.yaml"
        regexp: 'title:'
        line: 'title: "Sylva MaaS Training Labs"'
      - file: "config/system.yaml"
        regexp: 'alias:'
        line: '  alias: /home'
      - file: "themes/labs/labs.yaml"
        regexp: 'home_url:'
        line: "home_url:  http://{{ grav_site_url }}"

  - title: "Metal as a Service Lab"
    path: "{{ grav_multisite_path[0] | default('genesis')}}"
    
    contents:
      - src: "{{ grav_repo_doc_content_path }}/{{ grav_multisite_path[0] | default('genesis') }}/pages" 
        dest: "pages"
        refresh: yes
      - src: "{{ grav_repo_doc_content_path }}/{{ grav_multisite_path[0] | default('genesis') }}/images"
        dest: "images"
        refresh: yes
        
    configs:
      - file: "config/system.yaml"
        regexp: 'theme:'
        line: '  theme: "maas"'
      - file: "config/site.yaml"
        regexp: 'title:'
        line: 'title: "Metal as a Service Lab"'
      - file: "config/system.yaml"
        regexp: 'alias:'
        line: '  alias: /intro'
      - file: "plugins/git-sync/blueprints.yaml"
        regexp: "placeholder: https://github.com"
        line: "      placeholder: {{ grav_gitea_repo_url | default('http://127.0.0.1:3000/genesis/maas.git') }}"
      - file: "plugins/git-sync/blueprints.yaml"
        regexp: "gituser: Use Git User Name"
        line:   "        gituser: {{ gitea_user | default('genesis') }}"
      - file: "plugins/git-sync/blueprints.yaml"
        regexp: "gitsync: Use GitSync Committer Name"
        line:   "        gitsync: {{ gitea_user | default('genesis') }}"

    dumps:
      - template:
           dest: "config/themes/maas.yaml"      
           content: |
             enabled: true
             production-mode: false
             grid-size: grid-lg
             github:
               note: true
               link: true
               tree: https://github.com
      - template: 
          dest: "config/plugins/git-sync.yaml"
          content: |
            enabled: true
            folders:
              - pages
            SyncNotice: null
            sync:
              on_save: true
              on_delete: true
              on_media: true
              cron_enable: false
              cron_at: '0 12,23 * * *'
            local_repository: "user/{{ inventory_hostname_short | default('maas') }}_git_clon"
            repository: "{{ grav_gitea_repo_url | default('http://127.0.0') }}"
            no_user: '0'
            user: "{{ gitea_user | default('genesis') }}"
            password: "{{ gitea_admin_password | default('genesis') }}"
            webhook: "/{{ grav_webhook_route | default('webhook-endpoint') }}"
            webhook_enabled: '1'
            webhook_secret: "{{ gitea_webhook_secret | default('GenesisSystemSecureWebhookSecret2026') }}"
            branch: "{{ gitea_branch | default('main') }}"
            remote:
              name: origin
              branch: "{{ gitea_branch | default('main') }}"
            git:
              author: "{{ gitea_user | default('genesis') }}"
              message: '(Grav GitSync) Automatic Commit from Genesis Node'
              name: "{{ gitea_user | default('genesis') }}"
              email: "{{ gitea_user | default('genesis') }}@{{ gitea_domain | default('genesis.local') }}"
              bin: git
              ignore: null
              private_key: null
            logging: true

grav_sites: "{{ doc_grav_sites | default(doc_default_sites, true) }}"
