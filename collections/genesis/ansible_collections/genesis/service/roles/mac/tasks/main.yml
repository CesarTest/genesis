---
# genesis.service.mac main.yml
#   - Mandatory Access Control Setup
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL: Users, Files and Connections Accessl Control"
  block:

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL: 1) User Permissions: RBAC and Folders"
      ansible.builtin.include_tasks: "1_user.yml"
      loop: "{{ mac_user_rbac | default([]) | list }}"
      loop_control:
        loop_var: "mac_user"

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL: 2) File Permissions: 2) SELinux, AppArmor"
      ansible.builtin.include_tasks: "2_file.yml"

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL: 3) Connection Permissions: Firewall, Cryto Policies"
      ansible.builtin.include_tasks: "3_connection.yml"