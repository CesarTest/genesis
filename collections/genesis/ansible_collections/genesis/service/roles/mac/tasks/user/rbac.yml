---
# genesis.service.mac user/rbac.yml
#   - RBAC Identity Management: Direct Single Element Extraction
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

- name: "[genesis.service.mac] - RBAC -1- User: Identity Provisioning Orchestration"
  become: true  
  vars:
    mac_username:  "{{ mac_user.username  | default('root', true) }}"
    mac_usergroup: "{{ mac_user.usergroup | default('root', true) }}"
    mac_usershell: "{{ mac_user.usershell | default('/bin/bash', true) }}"
    mac_user_emergency_commands:
      # Operación 1: Creación directa del grupo en Bash puro si falla la API
      - |
        getent group "{{ mac_usergroup }}" &>/dev/null || groupadd "{{ mac_usergroup }}"
        true

      # Operación 2: Creación/Acumulación directa del usuario en Bash puro (Idempotencia)
      - |
        getent passwd "{{ mac_username }}" &>/dev/null || \
          useradd -g "{{ mac_usergroup }}" -s "{{ mac_usershell }}" -m "{{ mac_username }}"
        
        # Agrega de forma acumulativa en el rescate por si el usuario ya existía
        usermod -aG "{{ mac_usergroup }}" "{{ mac_username }}"
        true

  block:

    - name: "[genesis.service.mac] - RBAC -1- User: [DEBUG TRACE] Display Identity Details"
      ansible.builtin.debug:
        msg: "{{ debug_identity_text.splitlines() }}"
      vars:
        debug_identity_text: |
          =================== GENESIS IDENTITY PARTICULARS ===================
          Source Variable:    mac_user
          Target Username:    [{{ mac_username | default('mac_username NOT DEFINED OR EMPTY', true) }}]
          Primary Group:      [{{ mac_usergroup | default('mac_usergroup NOT DEFINED OR EMPTY', true) }}]
          System Shell:       [{{ mac_usershell | default('mac_usershell NOT DEFINED OR EMPTY', true) }}]
      ignore_errors: true
      delegate_to: localhost
  
    - name: "[genesis.service.mac] - RBAC -1- User: 1.1) Identity: Build System Group"
      ansible.builtin.group:
        name: "{{ mac_usergroup }}"
        state: present
      when: 
        - mac_usergroup | length > 0
        - mac_usergroup != 'root'

    - name: "[genesis.service.mac] - RBAC -1- User: 1.2) Identity: Provision System User with Cumulative Group"
      ansible.builtin.user:
        name: "{{ mac_username }}"
        groups: "{{ mac_usergroup }}"
        append: true  # <--- Mantiene los grupos de pasadas previas del loop superior
        shell: "{{ mac_usershell }}"
        create_home: true
        state: present
      when: 
        - mac_username | length > 0
        - mac_username != 'root'

  rescue:
    - name: "[genesis.service.mac] - RBAC -1- User: [RESCUE] 1.3) Emergency identity injection via CLI"
      ansible.builtin.shell: "{{ mac_shell_user_cmd }}"
      loop: "{{ mac_user_emergency_commands }}"
      loop_control:
        loop_var: "mac_shell_user_cmd"
      failed_when: false
