---
#  genesis.service.mac mac/selinux.yml
#   - Mandatory Access Control Setup - SELinux & Booleans Unified Lifecycle
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

######################################################
#   SELINUX
######################################################
- name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux"
  become: true
  vars:

    mac_selinux_emergency_commands:
      # Operación 1: Instalación de dependencias del OS base (Corregido con join)
      - |
        if command -v dnf &> /dev/null; then
          dnf install -y {{ mac_selinux_dependencies_packages | default([]) | join(' ') }}
        elif command -v apt-get &> /dev/null; then
          apt-get update && apt-get install -y policycoreutils-python-utils unzip tar
        fi
    
      # Operación 2: Configuración del fichero nativo y setenforce en caliente
      - |
        if [ -n "{{ mac_server_selinux_mode.state | default('') }}" ]; then
          sed -i 's/^SELINUX=.*/SELINUX={{ mac_server_selinux_mode.state }}/' {{ mac_server_selinux_mode.configfile | default("/etc/selinux/config") }}
          if [ "{{ mac_server_selinux_mode.state }}" = "disabled" ] || [ "{{ mac_server_selinux_mode.state }}" = "permissive" ]; then
            setenforce 0 2>/dev/null || true
          elif [ "{{ mac_server_selinux_mode.state }}" = "enforcing" ]; then
            setenforce 1 2>/dev/null || true
          fi
        fi
    
      # Operación 3: Forzar Autorelabel y remover el bloqueo de SELinux en el Kernel Command Line
      - |
        CURRENT_STATE=$(getenforce 2>/dev/null || echo "Disabled")
        TARGET_STATE="{{ mac_server_selinux_mode.state | default('') }}"
        
        if [ "$CURRENT_STATE" = "Disabled" ] && { [ "$TARGET_STATE" = "enforcing" ] || [ "$TARGET_STATE" = "permissive" ]; }; then
          echo "[GENESIS] Detectado cambio de SELinux desde Disabled. Forzando autorelabel del sistema de archivos..."
          touch /.autorelabel
          
          # REMOVER EL BLOQUEO DE KERNEL EN SISTEMAS MODERNOS (RHEL 9 / ROCKY 9 / CENTOS 9)
          if command -v grubby &> /dev/null; then
            echo "[GENESIS] Eliminando argumento selinux=0 del kernel mediante grubby..."
            grubby --update-kernel ALL --remove-args selinux
          fi
      
          # Compatibilidad por si es un sistema heredado antiguo
          if grep -q "selinux=0" /etc/default/grub 2>/dev/null; then
            sed -i 's/selinux=0//g' /etc/default/grub
            if command -v grub2-mkconfig &> /dev/null; then
              grub2-mkconfig -o /boot/grub2/grub.cfg
            fi
          fi
        fi

      # Operación 4: Bucle embebido Jinja para mapear y aplicar políticas con semanage/restorecon
      - |
        CURRENT_STATE=$(getenforce 2>/dev/null || echo "Disabled")
        if [ "$CURRENT_STATE" != "Disabled" ]; then
          {% for policy in mac_server_selinux_policies | default([]) %}
          semanage fcontext -a -t {{ policy.setype | default('httpd_sys_content_t') }} "{{ policy.target }}" 2>/dev/null || \
          semanage fcontext -m -t {{ policy.setype | default('httpd_sys_content_t') }} "{{ policy.target }}"
          restorecon -irv "{{ policy.target }}"
          {% endfor %}
        else
          echo "[GENESIS] SELinux está Disabled en memoria. Las políticas se aplicarán automáticamente tras el reboot del rescue."
        fi

  block:
    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux: Python Dependencies"
      package:
        name: "{{ mac_selinux_dependencies_packages | default('') }}"
        state: present 
      
    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux Mode" 
      ansible.posix.selinux:
        policy:      "{{ mac_server_selinux_mode.policy     | default(omit)}}"
        state:       "{{ mac_server_selinux_mode.state      | default(omit)}}"
        configfile:  "{{ mac_server_selinux_mode.configfile | default(omit)}}"
        update_kernel_param: "{{ mac_server_selinux_mode.update_kernel_param | default(omit)}}"
      ignore_errors: yes 
      register: "mac_selinux_mode_switch"
      when:
        - "mac_server_selinux_mode is defined"
        - "mac_server_selinux_mode.state is defined"
        - "mac_server_selinux_mode.state is string"

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux: Trigger File System Autorelabel when state changed from disabled"
      ansible.builtin.file:
        path: "/.autorelabel"
        state: touch
        mode: '0644'
      when:
        - "mac_selinux_mode_switch is defined"
        - "mac_selinux_mode_switch.changed is defined"
        - "mac_selinux_mode_switch.changed is true"

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux: Rebooting when SELinux Mode changed"
      ansible.builtin.reboot:
      when:
        - "mac_selinux_mode_switch is defined"
        - "mac_selinux_mode_switch is not none"    
        - "(mac_selinux_mode_switch.reboot_required is defined)"
        - "(mac_selinux_mode_switch.reboot_required is not none)"
        - "(mac_selinux_mode_switch.reboot_required is true) "

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux: Refresh facts after reboot"
      ansible.builtin.setup:
      when:
        - "mac_selinux_mode_switch is defined"
        - "mac_selinux_mode_switch.reboot_required is defined"
        - "mac_selinux_mode_switch.reboot_required is true"

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux Policies"
      community.general.sefcontext:
        target:     "{{ mac_selinux_policy.target     | default(omit)}}"
        substitute: "{{ mac_selinux_policy.substitute | default(omit)}}"
        state:      "{{ mac_selinux_policy.state      | default(omit)}}"  
        ftype:      "{{ mac_selinux_policy.fftyp      | default(omit)}}"
        reload:     "{{ mac_selinux_policy.reload     | default(omit)}}"
        selevel:    "{{ mac_selinux_policy.selevel    | default(omit)}}"
        setype:     "{{ mac_selinux_policy.setype     | default(omit)}}"
        seuser:     "{{ mac_selinux_policy.seuser     | default(omit)}}"
        ignore_mac_selinux_state: "{{ mac_selinux_policy.ignore_mac_selinux_state | default(omit)}}"
      register: mac_selinux_apply_policy
      loop: "{{ mac_server_selinux_policies | default([]) }}"
      loop_control:
        loop_var: "mac_selinux_policy"
      when:
        - "ansible_selinux.status is defined"
        - "ansible_selinux.status != 'disabled'" 
        - "mac_server_selinux_policies is defined"
        - "mac_server_selinux_policies is not none"
        - "mac_server_selinux_policies is not string"
        - "mac_server_selinux_policies is not mapping"
        - "mac_server_selinux_policies is iterable"

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux: Apply Policies to target"            
      ansible.builtin.shell: "restorecon -irv {{ secontext | default('.') }}"
      loop: "{{ mac_selinux_apply_policy.results | default([]) }}"
      loop_control:
        loop_var: "mac_selinux_apply"
      vars:
        secontext: "{{ (mac_selinux_apply.target | default('.')) | dirname | dirname }}"
      when:
        - "ansible_selinux.status is defined"
        - "ansible_selinux.status != 'disabled'" 
        - "mac_selinux_apply_policy.results is defined"
        - "mac_selinux_apply_policy.results is not none"    
        - "mac_selinux_apply.changed is defined"
        - "mac_selinux_apply.changed is not none"

  rescue:

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux [RESCUE] - Execute raw shell recovery sequence from block vars"
      ansible.builtin.shell: "{{ emergency_command }}"
      loop: "{{ mac_selinux_emergency_commands }}"
      loop_control:
        loop_var: "emergency_command"
      failed_when: false

    - name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL - SElinux [RESCUE] - Emergency reboot if state was modified"
      ansible.builtin.reboot:
      when:
        - mac_server_selinux_mode is defined
        - mac_server_selinux_mode.state is defined
