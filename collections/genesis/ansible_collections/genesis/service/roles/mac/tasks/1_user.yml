- name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL: 1) User Permissions: RBAC"
  ansible.builtin.include_tasks: "user/rbac.yml"
  
- name: "[genesis.service.mac] - MANDATORY ACCESS CONTROL: 2) File Permissions: 1) Folders"
  ansible.builtin.include_tasks: "file/folder.yml"
  loop: "{{ mac_user.folders | default([]) | list }}"
  loop_control:
    loop_var: "mac_folder"
