######################################################
# SERVER SERVICES 
######################################################
- name: "B6 - PROVISION DOC NODE -1- MAC: Server Services"
  become: true
  vars:
    mac_emergency_commands:
      # Operación 1: Gestión de servicios del sistema vía systemctl puro
      - |
        {% for service in mac_services | default([]) %}
        {% if service.name is defined and service.name is string %}
        if systemctl list-unit-files | grep -q "^{{ service.name }}.service"; then
          {% if service.state | default('stopped') in ['started', 'running'] %}
          systemctl enable "{{ service.name }}" --now
          systemctl start "{{ service.name }}"
          {% else %}
          systemctl disable "{{ service.name }}" --now
          systemctl stop "{{ service.name }}"
          {% endif %}
        fi
        {% endif %}
        {% endfor %}

      # Operación 2: Inyección de reglas de Firewalld por CLI directa
      - |
        if systemctl is-active firewalld &>/dev/null; then
          {% for rule in mac_firewall_rules | default([]) %}
          {% if rule.service is defined %}
          firewall-cmd --permanent --add-service="{{ rule.service }}"
          {% elif rule.port is defined %}
          firewall-cmd --permanent --add-port="{{ rule.port }}"
          {% endif %}
          {% endfor %}
          
          # Recarga forzada del cortafuegos para aplicar los cambios en caliente
          firewall-cmd --reload
        fi
  block:
    - name: 'B6 - PROVISION DOC NODE -1- MAC: 1) Enable/Disable Server Services'
      ignore_errors: yes
      service:
        name:   "{{ mac_service.name }}"
        state:  "{{ mac_service.state | default('stopped') }}" 
        enabled: "{{ mac_service.state | bool }}" 
      loop: "{{ mac_services | default([]) }}"
      loop_control:
        loop_var: "mac_service"
      when: 
        - "mac_services is defined"
        - "mac_services is not none"
        - "mac_services is not string"
        - "mac_services is not mapping"
        - "mac_service.name is defined"
        - "mac_service.name is not none"
        - "mac_service.name is string"  
        #- ansible_facts.services[mac_service.name] is defined

    - name: "B6 - PROVISION DOC NODE -1- MAC: 2)Apply Firewall Rules"

      firewalld:
        port:      "{{ firewall_rule.port   | default(omit) }}"
        service:   "{{ firewall_rule.service| default(omit) }}"
        state:     "{{ firewall_rule.state  | default(omit) }}"
        permanent: "{{ firewall_rule.permanent | default(omit) }}"
        immediate: "{{ firewall_rule.immediate | default(omit) }}"
        offline:   "{{ firewawall_rule.offline | default(omit) }}"
      loop: "{{ mac_firewall_rules | default([]) }}"
      loop_control:
        loop_var: "firewall_rule"
      when:
        - "mac_firewall_rules is defined"
        - "mac_firewall_rules is not none"
        - "mac_firewall_rules is not string"
        - "mac_firewall_rules is iterable"
        - "mac_firewall_rules is not mapping"
        - "(firewall_rule.port is defined) or (firewall_rule.service is defined)"
        - "(firewall_rule.port is not none) or (firewall_rule.service is not none)"

    - name: "B6 - PROVISION DOC NODE -1- MAC: 3) Always reload firewalld"
      ansible.builtin.service:
        name: "firewalld"
        state: "reloaded"    

  rescue:

    - name: "B6 - SELINUX [RESCUE] - Firewall Rules by CLI"
      ansible.builtin.shell: "{{ mac_cmd }}"
      loop: "{{ mac_emergency_commands }}"
      loop_control:
        loop_var: "mac_cmd"
      failed_when: false