---
# genesis.service.web vars/main.yml
#  - Web Server Installation parameters (Elevated Priority via vars)
#     
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0

#########################################################
#            BASE VARIABLES & API INTERFACE
#########################################################
server_domain: "{{ web_server_domain | default('genesis.lab', true) }}"
apache_work_path: "{{ web_apache_work_path | default('/var/www/html', true) }}"
apache_logs: "{{ web_apache_logs | default('/var/log/httpd', true) }}"
apache_refresh: "{{ web_apache_refresh | default('true') | bool }}"

#########################################################
#            APACHE SERVER CONFIGURATIONS
#########################################################
apache_service: "{{ web_apache_service | default((ansible_os_family | default('Debian') == 'Debian') | ternary('apache2', 'httpd'), true) }}"
apache_user: "{{ web_apache_user | default((ansible_os_family | default('Debian') == 'Debian') | ternary('www-data', 'apache'), true) }}"
apache_shell: "{{ web_apache_shell | default('/bin/bash', true) }}"
apache_group: "{{ web_apache_group | default(apache_user, true) }}"

apache_create_vhosts: "{{ web_apache_create_vhosts | default(true, true) | bool }}"
apache_vhosts_filename: "{{ web_apache_vhosts_filename | default('vhosts.conf', true) }}"
apache_vhosts_template: "{{ web_apache_vhosts_template | default('vhosts.conf.j2', true) }}"
apache_global_vhost_settings: "{{ web_apache_global_vhost_settings | default('DirectoryIndex index.php index.html', true) }}"
apache_allow_override: "{{ web_apache_allow_override | default('All', true) }}"
apache_options: "{{ web_apache_options | default('All Indexes FollowSymLinks', true) }}"

apache_mods_disabled: "{{ web_apache_mods_disabled | default([], true) }}"

# Lista de Virtual Hosts que prioriza la entrada externa 'web_apache_vhosts'
apache_vhosts: "{{ web_apache_vhosts | default(grav_default_vhosts, true) }}"

# Tus Virtual Hosts internos por defecto en caso de no parametrizar desde fuera
grav_default_vhosts:
  - servername: "gitea.{{ server_domain }}"
    documentroot: "{{ apache_work_path }}/gitea"  
    serveradmin: "cesar.delgado.gonzalez@alumnos.upm.es"
    serveralias: "www.gitea.{{ server_domain }}" 
    extra_parameters: |
         ErrorLog  {{ apache_logs }}/gitea/error.log  
         CustomLog {{ apache_logs }}/gitea/access.log combined  
  - servername: "training.{{ server_domain }}"
    documentroot: "{{ apache_work_path }}/training"
    serveradmin: "cesar.delgado.gonzalez@alumnos.upm.es"
    serveralias: "www.training.{{ server_domain }}"
    extra_parameters: |
         ErrorLog  {{ apache_logs }}/training/error.log
         CustomLog {{ apache_logs }}/training/access.log combined

#########################################################
#            PHP CONFIGURATIONS FOR GRAV
#########################################################
#------------
# 1.- Main Config
#------------
php_user:  "{{ web_php_user | default(apache_user, true) }}"
php_group: "{{ web_php_group | default(apache_group, true) }}"
php_install_from_source: "{{ web_php_install_from_source | default(false, true) | bool }}"
php_enable_webserver: "{{ web_php_enable_webserver | default(true, true) | bool }}"
php_webserver_daemon: "{{ web_php_webserver_daemon | default(apache_service, true) }}"
php_packages_state: "{{ web_php_packages_state | default('present', true) }}"
php_install_recommends: "{{ web_php_install_recommends | default(true, true) | bool }}"
php_executable: "{{ web_php_executable | default('php', true) }}"
php_version: "{{ web_php_version | default('8.3', true) }}"

php_packages: "{{ web_php_packages | default(grav_default_php_packages, true) }}"

grav_default_php_packages:
  - php
  - php-cli
  - php-common
  - php-devel
  - php-gd
  - php-mbstring
  - php-pdo
  - php-pecl-apcu
  - php-xml
  - php-curl 
  - php-ctype
  - php-dom
  - php-gd
  - php-json
  - php-mbstring
  - php-openssl
  - php-session
  - php-simplexml
  - php-xml
  - php-zip

#------------
# 2.- PHP ini
#------------- 
php_memory_limit: "{{ web_php_memory_limit | default('128M', true) }}"
php_max_execution_time: "{{ web_php_max_execution_time | default('90', true) }}"
php_upload_max_filesize: "{{ web_php_upload_max_filesize | default('256M', true) }}"

#---------
# 3.- OPT Cache
#--------
php_opcache_zend_extension: "{{ web_php_opcache_zend_extension | default('opcache.so', true) }}"
php_opcache_enable: "{{ web_php_opcache_enable | default('1', true) }}"
php_opcache_enable_cli: "{{ web_php_opcache_enable_cli | default('0', true) }}"
php_opcache_memory_consumption: "{{ web_php_opcache_memory_consumption | default('96', true) }}"
php_opcache_interned_strings_buffer: "{{ web_php_opcache_interned_strings_buffer | default('16', true) }}"
php_opcache_max_accelerated_files: "{{ web_php_opcache_max_accelerated_files | default('4046', true) }}"
php_opcache_max_wasted_percentage: "{{ web_php_opcache_max_wasted_percentage | default('5', true) }}"
php_opcache_validate_timestamps: "{{ web_php_opcache_validate_timestamps | default('1', true) }}"
php_opcache_revalidate_path: "{{ web_php_opcache_revalidate_path | default('0', true) }}"
php_opcache_revalidate_freq: "{{ web_php_opcache_revalidate_freq | default('2', true) }}"
php_opcache_max_file_size: "{{ web_php_opcache_max_file_size | default('0', true) }}"