---
# genesis.service_permission mac/permissions.yml
#   - Mandatory Access Control Setup
#
# SPDX-FileCopyrightText: © 2026 Genesis System
# SPDX-License-Identifier: Apache-2.0


######################################################
# WEB FOLDERS
######################################################
- name: "[genesis.service.web] - WEB -1- Folder: 1) Web Folders"
  become: true  
  vars:
    vhost_documentroot: "{{ ((apache_vhosts|default([])) | map(attribute='documentroot') ) | default([]) }}"
    vhost_names: "{{ (vhost_documentroot | map('basename') | list) | default([]) }}"
    vhost_logs: "{{  [] | zip_longest(vhost_names, fillvalue=apache_logs + '/') | map('join') | list  }}"
    folders: "{{ (vhost_logs|default([])) +(vhost_documentroot|default([])) }}"
    web_server_users:
      - username:  "{{ apache_user |default('root')}}"
        usergroup: "{{ apache_group|default('root')}}"
        usershell: "{{ apache_shell|default('/sbin/nologin')}}"
        create_home: "yes"
      - username:  "{{ php_user    |default('root')}}"
        usergroup: "{{ php_group   |default('root')}}"
        usershell: "{{ apache_shell|default('/sbin/nologin')}}"
        create_home: "yes"
    web_emergency_commands:
      # Operación 1: Creación forzada de grupos en Bash puro si falla la API
      - |
        {% for group in [apache_group | default('root'), php_group | default('root')] %}
        getent group "{{ group }}" &>/dev/null || groupadd "{{ group }}"
        {% endfor %}

      # Operación 2: Creación forzada de usuarios de sistema y asignación de shells
      - |
        # Configuración para el usuario Apache
        getent passwd "{{ apache_user | default('root') }}" &>/dev/null || \
          useradd -g "{{ apache_group | default('root') }}" -s "{{ apache_shell | default('/sbin/nologin') }}" -m "{{ apache_user | default('root') }}"
        
        # Configuración para el usuario PHP
        getent passwd "{{ php_user | default('root') }}" &>/dev/null || \
          useradd -g "{{ php_group | default('root') }}" -s "{{ apache_shell | default('/sbin/nologin') }}" -m "{{ php_user | default('root') }}"

      # Operación 3: Limpieza condicional de directorios de hosting (Flag Apache Refresh)
      - |
        {% if apache_refresh is defined and apache_refresh is boolean and apache_refresh is true %}
        {% for folder in folders | default([]) %}
        if [ -d "{{ folder }}" ] && [ "{{ folder }}" != "/" ] && [ "{{ folder }}" != "/tmp" ]; then
          rm -rf "{{ folder }}"
        fi
        {% endfor %}
        {% endif %}
        true

      # Operación 4: Despliegue forzado del árbol de directorios web y herencia de permisos chown
      - |
        {% for folder in folders | default([]) %}
        mkdir -p "{{ folder }}"
        chown -R {{ apache_user | default('root') }}:{{ apache_group | default('root') }} "{{ folder }}"
        chmod -R 755 "{{ folder }}"
        {% endfor %}

  block:
    - name: "[genesis.service.web] - WEB -1- Folder: 1) Create Group"
      group:
        name:  "{{ userproperties.usergroup | default(omit) }}"
      loop: "{{ web_server_users | default([]) }}"
      loop_control:
        loop_var: "userproperties"
      when: 
        - userproperties.usergroup is defined
        - userproperties.usergroup is not none
        - userproperties.usergroup is string
        - userproperties.usergroup | length > 0

    - name: "[genesis.service.web] - WEB -1- Folder: 2) Create a user |{{ apache_user | default('Empty=root') }}|:|{{ apache_group | default('Empty=root') }}|"
      user:
        name:    "{{ userproperties.username | default(omit) }}"
        groups:  "{{ userproperties.usergroup| default(omit) }}"
        shell:   "{{ userpropeties.usershell | default(omit) }}"
        create_home: "{{ userproperties.create_home | default(omit)}}"
      loop: "{{ web_server_users | default([]) }}"
      loop_control:
        loop_var: "userproperties"
      when: 
        - userproperties.username is defined
        - userproperties.username is not none
        - userproperties.username is string
        - userproperties.username | length > 0

    - name: "[genesis.service.web] - WEB -1- Folder: 3) Remove vhost directory according apache_refresh flag"
      file:
        path: "{{ vhost_www_folder | default('/tmp') }}"
        state: "absent"
      loop: "{{ folders | default([]) }}"
      loop_control:
        loop_var: "vhost_www_folder"  
      when:
       - "apache_refresh is defined"
       - "apache_refresh is not none"
       - "apache_refresh is boolean"
       - "apache_refresh is true"

    - name: "[genesis.service.web] - WEB -1- Folder: 4) Create vhost directory if they don't exist"
      file:
         path: "{{ vhost_www_folder | default('/tmp') }}"
         state: "directory"
         recurse: "true"
         owner: "{{ apache_user | default('root') }}"
         group: "{{ apache_group | default('root') }}"
      loop: "{{ folders | default([]) }}"
      loop_control: 
         loop_var: "vhost_www_folder"
 
  rescue:

    - name: "[genesis.service.web] - WEB -1- Folder: [RESCUE]  5) Permissions by CLI"
      ansible.builtin.shell: "{{ mac_cmd }}"
      loop: "{{ web_emergency_commands }}"
      loop_control:
        loop_var: "web_cmd"
      failed_when: false