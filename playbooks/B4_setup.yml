#---------------------------------
#  CLEAN IRONIC
#---------------------------------
#  baremetal node set --retired {{node_uuid}}
- name: "Gather facts on localhost"
  hosts: localhost
  become: no
  gather_facts: yes

- name: "STEP 1 - Remove Nodes"
  hosts: localhost
  connection: local
  ignore_errors: yes
  become: no
  gather_facts: no
  vars:
    work_path: "{{ playbook_dir }}/../hosts"
    bifrost_default_inventory_source: "{{ work_path | realpath }}/baremetal.yml"
    bifrost_repo_path: "{{ playbook_dir }}/../repo"
    bifrost_inventory_source: "{{ lookup('env', 'BIFROST_INVENTORY_SOURCE') or bifrost_default_inventory_source }}"
    ironic_http_path: "{{ http_bootpath | default('/var/lib/ironic/httpboot') }}"
  tasks:

    - name: "Load Nodes to Enroll from |{{ bifrost_inventory_source }}|"
      ansible.builtin.include_vars:
         file: "{{ bifrost_inventory_source }}"
         name: "baremetal_nodes_enrolled"

    - name: "STEP 1 - Remove Nodes"
      shell:
         cmd: "{{command | default('ls')}}"
      vars:
         node_uuid: "{{ node.value.uuid | default(' ') }}"
         node_name: "{{ node.value.name | default(' ') }}"

         command: |
           . /opt/stack/bifrost/bin/activate
           export OS_CLOUD=bifrost
           baremetal allocation delete {{node_name}}
           baremetal node maintenance set {{node_uuid}}
           baremetal node delete {{node_uuid}}
      loop:  "{{ baremetal_nodes_enrolled | dict2items | default([]) }}"
      loop_control:
        loop_var: node


