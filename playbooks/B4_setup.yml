#---------------------------------
#  ENROLL NODES
#---------------------------------
- name: "STEP 2 - Enroll Nodes"
  ansible.builtin.import_playbook: "{{bifrost_shoot_path | trim}}/enroll-dynamic.yaml"
  become: true
  vars:
    bifrost_shoot_path: >-
     {{ bifrost_playbooks_path
      | default(playbook_dir + '/../roles/openstack.bifrost/openstack.bifrost/playbooks', True)
      | realpath  }}


#---------------------------------
#  SET INSTANCE INFORMATION
#---------------------------------
- name: "STEP 3 - Set Instance Information"
  hosts: localhost
  connection: local
  vars:
    work_path: "{{ playbook_dir }}/../hosts"
    bifrost_default_inventory_source: "{{ work_path | realpath }}/baremetal.yml"
    default_repo_path: "{{ playbook_dir  }}/../repo"
    bifrost_repo_path: "{{ bifrost_airgap_path | default( default_repo_path ) | realpath }}"
    bifrost_repo: "{{ bifrost_repo_path }}/dib"
    bifrost_inventory_source: "{{ lookup('env', 'BIFROST_INVENTORY_SOURCE') or bifrost_default_inventory_source }}"

  tasks:

    - name: "Load Nodes Enrolled from |{{ bifrost_inventory_source }}|"
      ansible.builtin.include_vars:
         file: "{{ bifrost_inventory_source }}"
         name: "baremetal_nodes_enrolled"

    - name: "STEP 3 - Set Instance Information"
      shell:
         cmd: "{{command | default('ls')}}"
      vars:
         node_uuid: "{{ node.value.uuid | default(' ') }}"
         node_name: "{{ node.value.name | default(' ') }}"
         node_image_source: "{{ node.value.instance_info.image_source | default('') }}"
         node_image_source_name: "{{node_image_source | basename | default('')}}"
         node_image_source_localpath: "{{bifrost_repo}}/{{node_image_source_name}}"
         node_boot_iso: "{{ node.value.instance_info.boot_iso |  default('') }}"
         node_ks_template: "{{ node.value.instance_info.ks_template |  default('') }}"
         node_boot_interface: "{{ node.value.instance_info.boot_interface |  default('ipxe') }}"
         node_deploy_interface: "{{ node.value.instance_info.deploy_interface |  default('direct') }}"
         node_kernel: "{{ node.value.instance_info.kernel |  default('') }}"
         node_ramdisk: "{{ node.value.instance_info.ramdisk |  default('') }}"
         command: |
           . /opt/stack/bifrost/bin/activate
           export OS_CLOUD=bifrost
           baremetal allocation delete {{node_name}}
           baremetal allocation create --name {{node_name}} --resource-class baremetal --wait
           baremetal node set {{node_uuid}} --boot-interface {{node_boot_interface}}
           baremetal node set {{node_uuid}} --deploy-interface {{node_deploy_interface}}
           if [ -n '{{node_image_source}}' ] ; then
             HASH=$( sha256sum {{node_image_source_localpath}} )
             baremetal node set {{node_uuid}} --instance-info image_source="{{node_image_source}}"
             if [ -n "${HASH}" ] ; then
               baremetal node set {{node_uuid}} --instance-info image_os_hash_value="${HASH%% *}"
               baremetal node set {{node_uuid}} --instance-info image_os_hash_algo="sha256"
             fi
           fi
           if [ -n '{{node_ks_template}}' ] ; then
              baremetal node set {{node_uuid}} --instance-info ks_template="{{node_ks_template}}"
           fi
           if [ -n '{{node_boot_iso}}' ] ; then
              baremetal node set {{node_name}} --instance-info boot_iso="{{node_boot_iso}}"
           fi
           if [ -n '{{node_kernel}}' ] ; then
              baremetal node set {{node_name}} --instance-info kernel="{{node_kernel}}"
           fi
           if [ -n '{{node_ramdisk}}' ] ; then
              baremetal node set {{node_name}} --instance-info ramdisk="{{node_ramdisk}}"
           fi
      loop:  "{{ baremetal_nodes_enrolled | dict2items | default([]) }}"
      loop_control:
        loop_var: node

