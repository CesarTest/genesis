#---------------------------------
# COPY DOWNLOADED OS IMAGES
#---------------------------------
- hosts: target
  become: true
  ignore_errors: yes
  vars:
    default_repo_path: "{{ playbook_dir  }}/../repo"
    bifrost_repo_path: "{{ bifrost_airgap_path | default( default_repo_path ) | realpath }}"
  tasks:

    - name: "STEP 0: Detect Ironic Destination Folder"
      file: 
        path: "{{ironic_tftp_master_path | default('/var/lib/ironic/master_images') }}"
        state: "directory"
        recurse: yes
        owner: ironic
        group: ironic 
      
    - name: "STEP 1: Copy Downloaded Files to Ironic Destination Folder"
      ansible.builtin.copy:
        src: "{{bifrost_repo_path | realpath}}/qcow/"
        dest: "{{ironic_tftp_master_path | default('/var/lib/ironic/master_images') }}/"

#---------------------------------------
# CREATE IMAGE  
#---------------------------------------
- name: "STEP 2: Build OS Bootable Images from local repository"
  hosts: target
  become: yes
  gather_facts: yes
  vars:
    bifrost_venv_dir: "{{ lookup('env', 'VENV') or '/opt/stack/bifrost' }}"
    bifrost_path: "{{ bifrost_workpath | default( playbook_dir + '/../roles/openstack.bifrost' ) | realpath }}"
    default_repo_path: "{{ playbook_dir  }}/../repo"
    bifrost_repo_path: "{{ bifrost_airgap_path | default( default_repo_path ) | realpath }}"
    bifrost_repo: "{{ bifrost_repo_path }}/dib"
    bifrost_roles: "{{bifrost_path}}/openstack.bifrost/playbooks/roles"
    bifrost_ironic_init: "{{bifrost_roles}}/bifrost-create-dib-image"
    #dib_offline: true
    build_ramdisk: false
    
  pre_tasks:
  
    - name: override ansible_python_interpreter to venv
      set_fact:
        ansible_python_interpreter: "{{ bifrost_venv_dir + '/bin/python3' }}"  

  tasks:
     - name: "STEP 2 - Build OS Bootable Images from local repository"
       ignore_errors: true      
       #vars:
          #ironic_tftp_master_path: "{{ bifrost_airgap_path | default( bifrost_path + '/files' ) }}/qcow"
          #dib_offline: true
          #build_ramdisk: true
       block:  
         - name: "STEP 2 - Build OS Bootable Images from local repository"         
           ansible.builtin.include_role: 
              name: "{{bifrost_ironic_init}}"
           vars: 
              dib_imagename: "{{bifrost_repo}}/{{os.distro}}-{{os.release}}"
              dib_imagetype: "{{os.imagetype | default('qcow') }}"
              dib_os_element: "{{os.distro}}"
              dib_os_release: "{{os.release}}" 
              dib_local_image_url: "{{deploy_image_sources[dib_os_element]['image']| default(omit) }}"
              dib_elements: >
                {{ dib_image_type|default('vm') }}
                {% if default_boot_mode != "bios" %}block-device-efi{% endif %}
                enable-serial-console
                {{ dib_init_element|default('simple-init') }}
                {{ extra_dib_elements|default('') }}
           loop: "{{ bifrost_download_images | default([]) }}"
           loop_control:
              loop_var: "os"
       
  environment:
    http_proxy: "{{ lookup('env','http_proxy') }}"
    https_proxy: "{{ lookup('env','https_proxy') }}"
    no_proxy: "{{ lookup('env', 'no_proxy') }}"
    
#---------------------------------------
# LOAD TO IRONIC
#---------------------------------------
- hosts: target
  become: true
  ignore_errors: yes
  vars:
    default_repo_path: "{{ playbook_dir  }}/../repo"
    bifrost_repo_path: "{{ bifrost_airgap_path | default( default_repo_path ) | realpath }}"
    bifrost_repo: "{{ bifrost_repo_path }}/dib"
  tasks:

    - name: "STEP 3: Detect Ironic Destination Folder"
      file: 
        path: "{{http_boot_folder | default('/var/lib/ironic/httpboot') }}"
        state: "directory"
        recurse: yes
        owner: ironic
        group: ironic        
      
    - name: "STEP 3: Copy Bootable OS Images to Ironic Destination Folder"
      ansible.builtin.copy:
        src: "{{bifrost_repo}}/"
        dest: "{{ironic_tftp_master_path | default('/var/lib/ironic/httpboot') }}/"